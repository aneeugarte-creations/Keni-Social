[project]
name = "keni-shared"
version = "0.1.0"
description = "Definiciones canonicas compartidas de Keni (marca, limites de plataforma, utilidades puras)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Keni Engineering" }]
# Capa MAS BAJA del monorepo: SIN dependencias de keni-metricas ni keni-consola.
# Solo la libreria estandar de Python. La fuente UNICA importable de lo que antes
# estaba espejado entre modulos (catalogo de marca, limites de plataforma,
# io_atomico, engagement_pct).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keni_shared"]
# Empaqueta los ficheros de cliente (marcas/cuentas externalizadas a config).
# Explicito para que los `.toml` de `clientes/` entren en el wheel/sdist; sin ellos
# la carga del catalogo fallaria al instalar el paquete.
artifacts = ["src/keni_shared/clientes/*.toml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
