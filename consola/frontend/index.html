<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- `viewport-fit=cover`: el layout llega al borde fisico en iPhone con notch/isla; los
         `env(safe-area-inset-*)` del feed movil dependen de esto para no quedar a 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Tema aplicado antes de pintar para evitar parpadeo. Respeta lo guardado en
      localStorage (clave keni-consola-tema, que persiste el TemaProvider) y si no
      hay nada cae a la preferencia del SO. Debe coincidir con `temaInicial()`.
    -->
    <script>
      try {
        var t = window.localStorage.getItem("keni-consola-tema");
        var oscuro =
          t === "oscuro" ||
          (t !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (oscuro) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <!-- Geist: tipografia del sistema de diseno (estilo Vercel). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Tipografias del CATALOGO del editor de plantillas (se aplican a las capas de texto en el
         lienzo Konva). Se cargan ASINCRONAS (media="print" + onload): el navegador trae la hoja
         sin bloquear el primer pintado de NINGUNA pagina; el lienzo Konva se redibuja cuando las
         caras llegan (`document.fonts` -> `loadingdone`, escuchado en editor/Lienzo y capas).
         La cobertura por familia es ESPEJO EXACTO de las caras estaticas que el servidor registra
         en Skia (render_node/fuentes.mjs; guard en fuentes.mirror.test.ts): ni un peso mas (lo
         pintaria la previa y el export no lo tiene) ni uno menos (un peso pedido resolveria a
         caras distintas en cada lado). Montserrat carga 300..900 -> Light y los titulares
         ExtraBold 800/Black 900 estilo Gotham de Claro Sports. Oswald carga 300..700: la Light
         real del titular condensado (Anton, su hermana, solo existe en un peso 400). Eje `ital`
         en las familias con cursiva real (Anton/Archivo Black/Oswald no tienen italica).
         Gemelas OFL de comerciales: Poppins 300..900 (+ital), Roboto Condensed 300/400/700
         (~ Univers Condensed), Mulish 400/700/800 (~ Proxima Nova) y Nunito Sans 400/700/900
         (~ Avenir Next), solo uprights salvo Poppins (igual que sus caras registradas). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Barlow:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&family=Exo+2:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700;1,800&family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Mulish:wght@400;700;800&family=Nunito+Sans:wght@400;700;900&family=Oswald:wght@300;400;500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Condensed:wght@300;400;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Barlow:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&family=Exo+2:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700;1,800&family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Mulish:wght@400;700;800&family=Nunito+Sans:wght@400;700;900&family=Oswald:wght@300;400;500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Condensed:wght@300;400;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>KENI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
