[project]
name = "keni-consola"
version = "0.2.0"
description = "Consola Keni: capa de gestion web LOCAL (127.0.0.1) sobre keni-metricas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Keni Engineering" }]
dependencies = [
    # Capa mas baja: definiciones canonicas compartidas (marca, limites, io_atomico,
    # engagement_pct). La consola y keni-metricas importan de aqui la MISMA fuente (H3/E1).
    "keni-shared",
    "keni-metricas",
    # Pila ASGI propia de la consola. keni-metricas ya no las arrastra: el server
    # MCP usa la pila que trae el SDK `mcp`. Floors alineados con los de `mcp`.
    "starlette>=0.27",
    "uvicorn>=0.31.1",
    # Backend de ficheros: el contenido vive en YAML por marca (fuente de verdad).
    "PyYAML>=6",
    # Validacion estricta del JSON que propone `claude -p` al importar la parrilla desde un
    # documento (dominio.parrilla_import: union discriminada por `tipo`). Hoy entraria
    # transitivo por keni-metricas, pero lo fijamos EXPLICITO: lo usamos DIRECTAMENTE en el
    # back/worker y no debe depender de un transitivo que pueda cambiar.
    "pydantic>=2.6",
    # Render del deck semanal de deportes (reporte_deck). En keni-metricas es un
    # extra opcional; la consola SI lo necesita, asi que lo fija como dependencia:
    # python-pptx para el .pptx y reportlab para el PDF NATIVO (sin LibreOffice, #141).
    "python-pptx>=0.6.23",
    "reportlab>=4.0",
    # Compositor determinista de imagen (Estudio + placa de marca: `motores/estudio_imagen`).
    # Hoy entraria transitivo por python-pptx, pero lo fijamos EXPLICITO: la composicion de la
    # plantilla de marca (logo + copy-in) corre en back y worker y no debe depender de un
    # transitivo que pueda cambiar.
    "pillow>=10",
    # Lectura del calendario editorial en .xlsx (importador_calendario). CSV va en la stdlib;
    # openpyxl es la unica via para Excel sin LibreOffice. Solo lectura, sin estilos.
    "openpyxl>=3.1",
    # Sondas de recursos del servidor (CPU/RAM) para el panel de Sistema (admin). El disco
    # va por `shutil` (stdlib); psutil aporta CPU/RAM. La API degrada con elegancia si
    # faltara, pero lo fijamos como dependencia para que el panel funcione en hosted.
    "psutil>=5.9",
    # MFA PASSKEYS / WebAuthn (segundo factor, gateado por `KENI_CONSOLA_MFA`). `webauthn`
    # (py_webauthn, de Duo) construye las opciones de registro/login y verifica las respuestas
    # del autenticador (registration/authentication). `cryptography` (Fernet) firma y fecha la
    # cookie del CHALLENGE/pre-auth bajo `KENI_CONSOLA_MFA_KEY` (ya no cifra un secreto TOTP:
    # en passkeys el secreto vive en el dispositivo). Con el flag OFF no se ejercitan, pero se
    # fijan como dependencia para que el back hosted pueda activarlos sin recompilar la imagen.
    "webauthn>=2.0",
    "cryptography>=42",
    # Detección de idioma del pool de noticias (`dominio.ingesta.detectar_idioma`): decide qué
    # historias son extranjeras para Traducir a MX. `langdetect` (n-gram, ~55 idiomas, pure-Python,
    # offline) sustituye la heurística es/en por palabras; con semilla fija es determinista. Si
    # faltara, el código degrada a la heurística (no rompe), pero se fija como dependencia.
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
# Persistencia HOSTED (#130). El perfil local/privado NO necesita estos extras: SQLite va
# en la stdlib y la media va a disco. Solo el back hosted los instala (ver
# deploy/back/Dockerfile), que es donde `DATABASE_URL`/`S3_*` estan cableadas.
#   - postgres: driver de Postgres + POOL de conexiones para `db.py`/`motor_db.py` cuando hay
#               `DATABASE_URL`. `psycopg_pool` da el `ConnectionPool` que reutiliza conexiones
#               en el camino caliente (evita el handshake TCP+auth por operacion).
#   - s3:       cliente S3 para `almacen_media.py`/`migracion.py` cuando hay `S3_*`.
postgres = ["psycopg[binary]>=3.1", "psycopg_pool>=3.1"]
s3 = ["boto3>=1.34"]
#   - asr: motor de transcripcion (gestor audio→texto). `faster-whisper` ES whisper (mismos pesos
#          OpenAI, modelo v3 turbo) corriendo sobre CTranslate2: se instala como WHEEL precompilado
#          (sin compilar nada, a diferencia de whisper.cpp), trae su propio decodificador de audio
#          (av/ffmpeg embebido) y DESCARGA el modelo UNA vez a un cache persistente. Solo lo instala
#          el servicio `transcriptor` (deploy/transcriptor/Dockerfile); el back/worker no transcriben.
#          `requests`: faster-whisper 1.1.0 hace `import requests` directo (utils.py) pero NO lo declara;
#          se apoyaba en que huggingface_hub lo arrastrara, y hf_hub 1.x ya no (migró a httpx). Sin esta
#          línea, `import faster_whisper` revienta con ModuleNotFoundError: requests. Lo fijamos explícito.
asr = ["faster-whisper>=1.1.0", "requests>=2"]
# pytest-timeout: backstop ANTI-CUELGUE de los tests de concurrencia/procesos (#116/#137)
# que usan @pytest.mark.timeout(...). Sin el, esa marca es un no-op silencioso (el test
# podria colgarse indefinidamente si una espera no se libera). Con el, el wall-timeout mata
# el test y falla en vez de bloquear la suite.
# pytest-postgresql: levanta un Postgres efimero para los tests del backend Postgres; los
# tests lo USAN si hay un binario `pg_ctl`/`initdb` disponible y se SALTAN (skip) si no, asi
# CI sin Postgres sigue verde. boto3 + moto: tests del backend S3 sin red (S3 simulado).
dev = [
    "pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.3", "pytest-xdist>=3.6", "respx>=0.21",
    "anyio>=4", "ruff>=0.6",
    "psycopg[binary]>=3.1", "psycopg_pool>=3.1", "pytest-postgresql>=6", "boto3>=1.34", "moto>=5",
]

[project.scripts]
keni-consola = "keni_consola.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout: hatchling empaqueta TODO lo que cuelga de src/keni_consola, no solo
# los .py. Asi viajan los estaticos (.css/.js) y las plantillas (.md).
packages = ["src/keni_consola"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# Marcadores del TEST-SCOPING por app (los aplica conftest.pytest_collection_modifyitems
# segun el fichero de cada test). Los pipelines `.woodpecker/tests-app-*` seleccionan por
# marcador (`-m "contrato or app_X"`) en vez de enumerar ficheros, asi borrar/renombrar un
# test ya no rompe el CI. Registrados aqui para que `--strict-markers` (si se activa) y los
# avisos de pytest los reconozcan.
markers = [
    "contrato: contrato compartido (fronteras + catalogo); corre en todos los pipelines scoped",
    "app_metricas: tests de la app Metricas (test-scoping del CI)",
    "app_operacion: tests de la app Operacion (test-scoping del CI)",
    "app_produccion: tests de la app Produccion (test-scoping del CI)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
