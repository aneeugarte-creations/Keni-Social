    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Tema aplicado antes de pintar para evitar parpadeo. Respeta lo guardado en
      localStorage (clave keni-consola-tema, que persiste el TemaProvider) y si no
      hay nada cae a la preferencia del SO. Debe coincidir con `temaInicial()`.
    -->
    <script>
      try {
        var t = window.localStorage.getItem("keni-consola-tema");
        var oscuro =
          t === "oscuro" ||
          (t !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (oscuro) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <!-- Geist: tipografia del sistema de diseno (estilo Vercel). -->
