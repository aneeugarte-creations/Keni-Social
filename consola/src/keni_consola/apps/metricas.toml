# Manifest de la app B · Métricas e inteligencia (ADR 0005).
#
# Lectura multi-marca / multi-plataforma, consolidación y reportes. Consumidor de
# Metricool (adapter `FuenteMetricol` detrás de `FuenteMetricas`), NO motor de
# ingesta. Sin gating para leer.
#
# Declarativo: lo lee `apps/registro.py`. Las claves de nivel superior van ANTES de
# los `[[nav]]` (regla TOML).

id = "metricas"
etiqueta = "Analíticas"
# Frase corta para la tarjeta del launcher (cajón de apps).
descripcion = "Métricas, campañas y reportes"
icono = "BarChart3"
flag_activacion = "KENI_APP_METRICAS"
permisos = ["editor", "admin"]

modulos_backend = [
  "metricas",
  "campanias",
  "vistas",
]

rutas_frontend = [
  "/datos/analiticas",
  "/datos/analiticas/metricas",
  "/datos/analiticas/campanias",
]

[[nav]]
ruta = "/datos/analiticas"
etiqueta = "Analíticas"
icono = "BarChart3"
descripcion = "Rendimiento de las cuentas y seguimiento de campañas. Pestañas Métricas / Campañas."
# Bloque "datos": la medición cierra el loop (alimenta de vuelta qué producir); es
# lectura, no un checkpoint de la operación diaria.
grupo = "datos"
grupo_orden = 30
orden = 20
