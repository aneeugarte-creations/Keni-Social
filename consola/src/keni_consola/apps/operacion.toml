  "/publicaciones",
  "/parrilla",
  "/parrilla/pendientes",
  "/parrilla/calendario",
]

[[nav]]
ruta = "/publicaciones"
etiqueta = "Publicaciones"
icono = "Send"
descripcion = "Gestiona borradores, aprueba, programa y publica."
