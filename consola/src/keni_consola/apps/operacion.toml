# Manifest de la app C · Operación de equipo (ADR 0005).
#
# Coordinación del trabajo del equipo: rota, pendientes, parrilla, programación y
# aprobación. La PUBLICACIÓN REAL es una sub-capacidad que enciende con App Review;
# rota/pendientes/parrilla entran ya con multiusuario.
#
# Declarativo: lo lee `apps/registro.py`. Claves de nivel superior ANTES de `[[nav]]`.

id = "operacion"
etiqueta = "Operación"
# Frase corta para la tarjeta del launcher (cajón de apps).
descripcion = "Rota, parrilla y publicación"
icono = "Send"
flag_activacion = "KENI_APP_OPERACION"
permisos = ["editor", "admin"]

modulos_backend = [
  "piezas",
  "aprobacion",
  "franjas",
  # Cadencia por (marca?, red?): scheduling por margen entre posts (sustituye franjas-caja
  # a volumen). La consume `calcular_hueco_para` (encolar/auto-programar).
  "cadencias",
  # Auto-planificación (Fase 3): sugerir la mejor hora para publicar combinando las FRANJAS
  # (operacional) con el histórico de engagement; SOLO lectura, lo consume el botón del tablero.
  "sugerencias_hora",
  "rota",
  # Importar un documento a la rota: un `claude -p` READ-ONLY lo lee y propone
  # eventos/turnos; el back valida y aplica tras la previsualización. Usa la infra
  # de jobs `generaciones` (A) en segundo plano (seam #7 en test_fronteras).
  "parrilla_import",
  "publicaciones",
  # Sub-features del tablero de contenido (sin nav propia; cuelgan de la tarjeta):
  "etiquetas",
  "colaboracion",
  # Automatización operacional: webhooks salientes + eventos internos del tablero.
  "webhooks",
]

rutas_frontend = [
  # Bloque «Operación»: «Feed» (hub: Feed de ideación + Portal + Lista de contenido) y «Programa»
  # (hub: Programación + Plan), por marca activa.
  "/operacion/feed",
  "/operacion/feed/feed",
  "/operacion/feed/portal",
  "/operacion/feed/lista",
  "/operacion/programa",
  "/operacion/programa/programacion",
  "/operacion/programa/plan",
  # Bloque «Equipo»: «Trabajo» (eventos/tareas y su cobertura) y «Calendario» (el horario de turnos).
  "/equipo/trabajo",
  "/equipo/calendario",
  # Webhooks salientes (admin; sin nav, se entra por URL directa). Ver router.tsx.
  "/webhooks",
]

# Dos destinos hermanos en el bloque «Equipo»: «Trabajo» (`/equipo/trabajo`) = eventos/tareas y
# su cobertura (la demanda); «Calendario» (`/equipo/calendario`) = el horario de turnos del equipo
# (la capacidad: Yo/Equipo, Semana/Mes).

# Feed: la superficie diaria del equipo (red social interna + lista de contenido).
[[nav]]
ruta = "/operacion/feed"
etiqueta = "Feed"
icono = "LayoutGrid"
descripcion = "El feed de ideación del equipo (piezas como posts, aprobación en línea) y la lista de contenido."
grupo = "operacion"
grupo_orden = 10
orden = 20

# El antiguo hub "Calendario" (1 entrada, 2 pestañas) se separó en DOS páginas planas del
# sidebar: Programación (calendario de publicaciones, por marca) y Turnos (rota de cobertura
# del equipo, por marca). Ambas respetan la marca activa del workspace; "Todas" agrega.

# Programa: hub con dos pestañas — «Programación» (calendario de publicaciones, por marca) y «Plan»
# (las líneas de la marca: su hashtag derivado y los keywords del clasificador). Por marca activa.
[[nav]]
ruta = "/operacion/programa"
etiqueta = "Programa"
icono = "CalendarDays"
descripcion = "Calendario de publicaciones y el plan de líneas (hashtag y keywords), por marca."
grupo = "operacion"
grupo_orden = 10
orden = 25

# Bloque «Equipo» (grupo `equipo`, entre Operación y Contenido): quién trabaja y cuándo. Reúne
# «Trabajo» (la demanda: qué hay que cubrir y quién lo coge) y «Calendario» (la capacidad: el
# horario de turnos). Es otra clase de cosa que el flujo de contenido, así que va en su propio bloque.

# Trabajo: eventos editoriales y tareas con su cobertura (qué hay que hacer y quién lo coge), por marca.
[[nav]]
ruta = "/equipo/trabajo"
etiqueta = "Trabajo"
icono = "ClipboardList"
descripcion = "Eventos y tareas del equipo con su cobertura: qué hay que cubrir y quién lo coge, por marca."
grupo = "equipo"
grupo_orden = 15
orden = 10

# Calendario: el horario de turnos del equipo (capacidad). Yo/Equipo · Semana/Mes, por marca activa.
[[nav]]
ruta = "/equipo/calendario"
etiqueta = "Calendario"
icono = "CalendarClock"
descripcion = "El horario de turnos del equipo: tu calendario y el del equipo, semana o mes, por marca."
grupo = "equipo"
grupo_orden = 15
orden = 20
