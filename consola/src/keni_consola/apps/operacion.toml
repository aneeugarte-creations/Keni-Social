# Manifest de la app C · Operación de equipo (ADR 0005 §C).
#
# Coordinación del trabajo del equipo: rota, pendientes, parrilla, programación y
# aprobación. La PUBLICACIÓN REAL es una sub-capacidad que enciende con App Review;
# rota/pendientes/parrilla entran ya con multiusuario (#130).
#
# Declarativo: lo lee `apps/registro.py`. Claves de nivel superior ANTES de `[[nav]]`.

id = "operacion"
etiqueta = "Operación"
# Frase corta para la tarjeta del launcher (cajón de apps).
descripcion = "Rota, parrilla y publicación"
icono = "Send"
flag_activacion = "KENI_APP_OPERACION"
permisos = ["editor", "admin"]

modulos_backend = [
  "publicaciones",
  "aprobacion",
  "franjas",
  # Cadencia por (marca?, red?): scheduling por margen entre posts (sustituye franjas-caja
  # a volumen). La consume `calcular_hueco_para` (encolar/auto-programar).
  "cadencias",
  # Auto-planificación (Fase 3): sugerir la mejor hora para publicar combinando las FRANJAS
  # (operacional) con el histórico de engagement; SOLO lectura, lo consume el botón del tablero.
  "sugerencias_hora",
  "rota",
  # Importar un documento a la rota: un `claude -p` READ-ONLY lo lee y propone
  # eventos/turnos; el back valida y aplica tras la previsualización. Usa la infra
  # de jobs `generaciones` (A) en segundo plano (seam #7 en test_fronteras).
  "parrilla_import",
  "contenido",
  # Sub-features del tablero de contenido (sin nav propia; cuelgan de la tarjeta):
  "etiquetas",
  "colaboracion",
  # Automatización operacional: webhooks salientes + eventos internos del tablero.
  "webhooks",
]

rutas_frontend = [
  # El antiguo hub "Parrilla" se separó en "Feed" (Feed de ideación + Lista de contenido) y,
  # luego, el hub "Calendario" se separó a su vez en DOS páginas planas: "Programación"
  # (publicaciones) y "Turnos" (rota). Las rutas legacy (/parrilla/* y /operacion/calendario/*)
  # se conservan en el scope para que sus redirecciones (ver router.tsx) resuelvan dentro de la app.
  "/publicaciones",
  "/operacion/tareas",
  "/operacion/parrilla",
  "/operacion/feed",
  "/operacion/feed/feed",
  "/operacion/feed/lista",
  "/operacion/programacion",
  "/operacion/turnos",
  "/operacion/calendario",
  "/operacion/calendario/turnos",
  "/operacion/calendario/calendario",
  # Webhooks salientes (admin; sin nav, se entra por URL directa). Ver router.tsx.
  "/webhooks",
]

# El tablero de Tareas del equipo (clase='tarea') ya NO tiene entrada propia: vive integrado
# como pestaña «Cobertura» dentro de Turnos (`/operacion/turnos`). La ruta vieja redirige allí.

# Feed: la superficie diaria del equipo (red social interna + lista de contenido).
[[nav]]
ruta = "/operacion/feed"
etiqueta = "Feed"
icono = "LayoutGrid"
descripcion = "El feed de ideación del equipo (piezas como posts, aprobación en línea) y la lista de contenido."
grupo = "operacion"
grupo_orden = 10
orden = 20

# El antiguo hub "Calendario" (1 entrada, 2 pestañas) se separó en DOS páginas planas del
# sidebar: Programación (calendario de publicaciones, por marca) y Turnos (rota de cobertura
# del equipo, por marca). Ambas respetan la marca activa del workspace; "Todas" agrega.

# Programación: la rejilla mensual de publicaciones programadas, por marca activa.
[[nav]]
ruta = "/operacion/programacion"
etiqueta = "Programación"
icono = "CalendarDays"
descripcion = "Calendario de publicaciones programadas, por marca. La cadencia por red alimenta esta rejilla."
grupo = "operacion"
grupo_orden = 10
orden = 25

# Turnos: la rota de cobertura del equipo (semana a semana), por marca activa.
[[nav]]
ruta = "/operacion/turnos"
etiqueta = "Turnos"
icono = "CalendarClock"
descripcion = "Turnos y cobertura del equipo, semana a semana, por marca. 'Todas' agrega todas las marcas."
grupo = "operacion"
grupo_orden = 10
orden = 28
