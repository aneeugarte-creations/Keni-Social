# Manifest de la app A · Producción (ADR 0005 §A).
#
# El motor editorial: convierte input crudo (nota, clip, URL, tendencia) en
# contenido publicable y verificado. Es el moat; sin gating (vendible hoy).
#
# Este fichero es DECLARATIVO: lo lee `apps/registro.py`, que arma el catálogo y
# (vía `api/catalogo.py`) hidrata el sidebar. Añadir/activar una app NO obliga a
# tocar `navegacion.ts` ni `app.py`.
#
# NOTA TOML: todas las claves de nivel superior (escalares y arrays como
# `modulos_backend`/`rutas_frontend`) van ANTES de los `[[nav]]`; una vez abierto un
# array-de-tablas, las claves siguientes pertenecerían a esa tabla, no a la raíz.

id = "produccion"
etiqueta = "Producción"
# Frase corta para la tarjeta del launcher (cajón de apps): el "para qué" de la app
# de un vistazo. El detalle por sección lo dan las descripciones de cada `[[nav]]`.
descripcion = "Copy, clips, imágenes y verificación"
# Nombre de icono de lucide-react (string). El frontend lo resuelve a un componente
# vía un mapa string->LucideIcon en `navegacion.ts`.
icono = "Sparkles"
# Env var que ACTIVA/DESACTIVA la app. Vacía/ausente => activa por defecto (el repo
# arranca IGUAL que hoy). "0"/"false"/"no" la oculta del catálogo.
flag_activacion = "KENI_APP_PRODUCCION"
permisos = ["editor", "admin"]

# Módulos backend (`api/<modulo>.py`) que POSEE esta app. Lo usa el lint de fronteras
# para mapear cada router a su app.
modulos_backend = [
  "actividad",
  "produccion",
  "texto",
  "bloques",
  "imagen",
  "generaciones",
  "evergreen",
  "hashtags",
  "historial",
  "imagenes",
  "marca_activos",
  "plantillas_diseno",
  "plantillas_marca",
  "verificaciones",
  "reciclaje",
  "rss",
  "breaking",
  "noticias",
  "fuentes",
  "insumos",
  # Cajón Presidencia (Fuentes -> Internas): nota de WhatsApp -> pieza carrusel automática.
  # Mismo dominio que insumos/evergreen (fuentes internas que producen piezas).
  "presidencia",
  # Cajón Clips (Fuentes -> Internas, Claro Sports): vídeo/foto de WhatsApp -> pieza
  # automática (video o carrusel). Mismo dominio que presidencia (media -> pieza directa).
  "clips",
  "algoritmos",
  "pipelines",
  # Patrones editoriales medidos + verificación de voz (ADR 0009): api/patrones.py.
  "patrones",
  # Motor de video (Ola VIDEO): api/video.py (lo crea otro agente). Declarado aqui para que
  # el lint de fronteras mapee el router a esta app.
  "video",
]

# Rutas frontend que pertenecen a la app (incluye sub-rutas de los hubs). Útil para el
# test scoping y para que `router.tsx`/validaciones sepan qué paths son de A.
rutas_frontend = [
  "/contenido/imagen",
  "/contenido/video",
  "/contenido/texto",
  "/contenido/texto/documentos",
  "/contenido/texto/estrategia",
  # Algoritmos (inteligencia de plataforma) pasó de Investigación a la página de Texto.
  "/contenido/texto/algoritmos",
  "/datos/investigacion",
  "/datos/investigacion/plan",
  "/datos/investigacion/descubrimiento",
  "/datos/investigacion/fuentes",
  "/datos/investigacion/cajones",
  "/datos/produccion",
  # Sección «Máquina» (la máquina de generación: dos cockpits + la Cola compartida).
  "/maquina",
  "/maquina/investigacion",
  "/maquina/produccion",
  "/maquina/cola",
]

# Entradas de navegación de esta app (mismo orden/aspecto que el sidebar actual).
# `ruta` es el path que ya resuelve `router.tsx`; el sidebar no expande sub-rutas.
#
# El sidebar agrupa por MOMENTO DEL FLUJO (no por dueño de app), con encabezado de
# bloque visible. Cada entrada declara a qué bloque pertenece (`grupo` + `grupo_orden`)
# y su `orden` dentro del bloque. El bloque es VISUAL y se desacopla del dueño de la
# app: Producción reparte sus entradas entre los tres bloques según cuánto las toca el
# humano. Bloques: operacion(10) = checkpoints diarios · contenido(20) = herramientas
# para crear/editar a mano · datos(30) = entradas que alimentan o reflejan la automatización.

# El bloque CONTENIDO son TRES páginas planas por tipo de contenido (sin hub con pestañas):
# Imagen (estudio de imagen por capas), Video (estudio de video) y Texto (prompts + editorial).
[[nav]]
ruta = "/contenido/imagen"
etiqueta = "Imagen"
icono = "Image"
descripcion = "Estudio de imagen por capas: texto, logos, marcos, plantillas y bloques por marca; genera/expande/retoca con IA y exporta el arte de la pieza."
grupo = "contenido"
grupo_orden = 20
orden = 10

[[nav]]
ruta = "/contenido/video"
etiqueta = "Video"
icono = "Clapperboard"
descripcion = "Estudio de video: el toque RRSS sobre un clip ya editado — formato, overlay, PiP y subtítulos; el render fiel lo produce el servidor."
grupo = "contenido"
grupo_orden = 20
orden = 20

[[nav]]
ruta = "/contenido/texto"
etiqueta = "Texto"
icono = "Type"
descripcion = "Prompts y línea editorial, estrategia de marcas e inteligencia de plataforma. Pestañas Documentos / Estrategia / Algoritmos."
grupo = "contenido"
grupo_orden = 20
orden = 30

[[nav]]
ruta = "/datos/investigacion"
etiqueta = "Investigación"
icono = "Search"
descripcion = "El loop diario de la marca: el Plan del día (la lista de contenidos de hoy) a partir del Descubrimiento de tendencias y de las Fuentes de cada marca. Pestañas Plan del día / Descubrimiento / Fuentes."
grupo = "datos"
grupo_orden = 30
orden = 10

[[nav]]
ruta = "/datos/produccion"
etiqueta = "Producción"
icono = "Activity"
descripcion = "Todo lo que la máquina produce, en una línea temporal: las runs del pipeline (etapa a etapa) y la actividad suelta de IA (copy, imágenes, investigación…), con conteos, coste, tokens y tiempo."
grupo = "datos"
grupo_orden = 30
orden = 30
# Antes se llamaba «Actividad IA» y tenía pestañas Feed/Pipelines: HOY están fusionadas
# en este feed único (/datos/produccion); las rutas viejas redirigen en `router.tsx`. La
# pestaña «Monitor» se relocalizó a la sección «Máquina» (fase 2A).

# (Antes existía una entrada "Activos" propia; se fusionó como pestaña "Plantillas"
# de la página Texto y dejó de ser una entrada de nav.)

# ===== Sección MÁQUINA (la máquina de generación, fase 2A) =====
# Bloque VISUAL propio (`maquina`, grupo_orden 25: entre Contenido y Datos): la máquina de
# generación como UNA sección con dos cockpits de igual peso —Investigación (descubre/verifica)
# y Producción (genera copy/arte)— y la COLA compartida (la vista global del worker/cola que
# ambos motores comparten, relocalizada del antiguo Monitor). Los cockpits son esqueletos en
# 2A; los rellenan 2B/2C.
[[nav]]
ruta = "/maquina/investigacion"
etiqueta = "Investigación"
icono = "Search"
descripcion = "Cockpit del motor de INVESTIGACIÓN: descubre y verifica noticias que alimentan la máquina. En construcción (fase siguiente)."
grupo = "maquina"
grupo_orden = 25
orden = 10

[[nav]]
ruta = "/maquina/produccion"
etiqueta = "Producción"
icono = "Sparkles"
descripcion = "Cockpit del motor de PRODUCCIÓN: genera copy y arte publicable. Aloja la tira de etapas y el drawer de ajustes de la máquina. En construcción (fase siguiente)."
grupo = "maquina"
grupo_orden = 25
orden = 20

[[nav]]
ruta = "/maquina/cola"
etiqueta = "Cola"
icono = "ListChecks"
descripcion = "La vista GLOBAL del worker/cola que comparten los dos motores: salud (doctor), capacidad del pool, economía de tokens (presupuesto + parada de emergencia), jobs en curso/esperando y throughput por día."
grupo = "maquina"
grupo_orden = 25
orden = 30
