# Manifest del Shell · servicios transversales (ADR 0005).
#
# NO es una app de catálogo: agrupa los servicios comunes que el shell ofrece a
# A/B/C (auth, sesión, catálogo, secretos, media, settings). Sus rutas viven en la
# home / el dropdown de ajustes del avatar, no como entradas de catálogo.
#
# `es_app = false` => `api/catalogo.py` lo EXCLUYE de las apps activas (no aparece
# en `apps`). Se declara igualmente para que el lint de fronteras mapee sus módulos a
# la unidad "shell" (todo→shell permitido; shell→app solo por los seams de la
# allowlist). El shell ya no aporta entradas de nav: todos sus servicios cuelgan del
# dropdown del avatar.

id = "shell"
etiqueta = "Shell"
icono = "Settings"
es_app = false
flag_activacion = "KENI_APP_SHELL"
permisos = ["editor", "admin"]

modulos_backend = [
  "auth",
  "usuarios",
  "ajustes",
  "config",
  "estado",
  "sistema",
  "conexiones",
  # api/marcas.py: dashboard "Marcas" (admin) — estado de conexiones por marca
  # (Metricool + Postproxy) + métricas agregadas via la fachada de métricas. Vista
  # transversal de configuración/estado, hermana de `conexiones`.
  "marcas",
  "limites",
  "media",
  # api/generaciones.py: la COLA DE JOBS (infra transversal). Varias apps encolan trabajo
  # `claude -p` en segundo plano (generación de copy/imagen, import de documentos, auto-
  # desarrollo) y leen el estado del job. Es base compartida —análoga a repos/db/keni-shared—,
  # así que vive en el shell: importarla es app→shell (siempre permitido), no un cruce de
  # frontera. Antes estaba en produccion.toml y obligaba a 4 entradas en SEAMS_PERMITIDOS. ADR 0005.
  "generaciones",
  "artes",
  "alertas",
  "sugerencias",
  # api/ralph.py: proxy admin-gated hacia worker-ralph (sesiones claude persistentes de
  # los agentes Ralph). Overlay global transversal del shell (la burbuja), hermano de sistema.
  "ralph",
  "notificaciones",
  # api/catalogo.py: hidrata el sidebar leyendo los manifests via apps/registro. Servicio
  # transversal del shell (el catalogo mismo se autoexcluye de las apps de catalogo).
  "catalogo",
]

# Rutas frontend del shell (ajustes del dropdown del avatar). No generan entradas de
# catálogo; se listan para el test scoping y para que `router.tsx` sepa que son paths
# legítimos del shell.
rutas_frontend = [
  "/mi-cuenta",
  "/configuracion",
  "/sugerencias",
  "/marcas",
  "/usuarios",
  "/sistema",
]
