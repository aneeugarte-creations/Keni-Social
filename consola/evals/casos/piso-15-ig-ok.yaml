copy: |
  Los rincones que de verdad cuentan una ciudad no están en las guías: están en la mesa de
  un café de barrio, en la terraza donde cae la tarde y en la conversación que se alarga sin
  prisa. Esta semana te llevamos a tres lugares para reconectar con tu ritmo. ☕✨
