# Red de seguridad de despliegue: nginx SIEMPRE-VIVO que sirve el cascarón de la Consola
# CONGELADO (mantenimiento.html, horneado del frontend real). Traefik lo enruta SOLO cuando el
# router `front` no existe (recreación del front, rollback, crash): el router catch-all de
# prioridad mínima vive en el file-provider (traefik/dynamic/mantenimiento.yml), que NO depende de
# ningún contenedor de la app y por eso SOBREVIVE a la recreación del front. Este contenedor solo
# se recrea cuando cambia el shell (su imagen va por hash de consola/frontend), no en cada deploy.
server {
    # nginx NO-ROOT (nginxinc/nginx-unprivileged): escucha en 8080 (Traefik enruta ahí).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # COMPRESION: la página congelada carga el bundle del shell (React + Sidebar). Sin gzip
    # viajaría en crudo. Mismos ajustes que el front.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml
               text/plain application/manifest+json;

    # Salud para Traefik: DEBE quedar `healthy` o Traefik (provider docker) no enrutaría la red de
    # seguridad a él. La sonda pega a /healthz (200), no a `/` (que da 503 a propósito): si no, el
    # healthcheck lo marcaría unhealthy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets del bundle (JS/CSS/fuentes con hash en el nombre): servidos 200 para que la página
    # cargue, cache larga e inmutable.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /favicon.png {
        try_files $uri =404;
        access_log off;
    }

    # SONDA "¿hay deploy en curso?" — mismo endpoint que el front. Cuando el front se está
    # recreando, ESTE catch-all es quien responde, así que el SPA puede distinguir deploy de avería
    # también en esa ventana. Lee el mismo flag (montado aquí en /estado:ro). 200 siempre.
    location = /estado-deploy {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        if (-f /estado/desplegando) {
            return 200 '{"desplegando":true}';
        }
        return 200 '{"desplegando":false}';
    }

    # La página de mantenimiento se sirve SOLO como cuerpo del 503 (error_page interno), nunca con
    # 200: cualquier cliente recibe un estado transitorio honesto y reintentable.
    location = /mantenimiento.html { internal; }

    # Cualquier navegación -> 503 + el cascarón congelado. `Retry-After` orienta a clientes y
    # buscadores; `no-store` impide cachear un estado pasajero.
    location / {
        error_page 503 /mantenimiento.html;
        add_header Retry-After "15" always;
        add_header Cache-Control "no-store" always;
        return 503;
    }
}
