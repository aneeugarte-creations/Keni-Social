# Routers Traefik para los sitios que learn-01 SÍ sirve además de keni-social:
#   - code.kenitech.io  -> code-launcher (127.0.0.1:9001), browser Claude Code.
#   - api.kenitech.io   -> learn-control-plane (127.0.0.1:8080), API del piloto learn.
#
# NOTA: learn.kenitech.io NO vive en esta máquina — su DNS apunta a 187.124.247.53
# (el VPS viejo, `vps_ip` del terraform). Por eso NO hay router learn aquí: tenerlo
# solo provocaba fallos de ACME en bucle (el challenge se resuelve en el otro host).
#
# Traefik corre en network_mode: host (ver docker-compose.yml), así que llega a esos
# servicios por 127.0.0.1. El idle-timeout 0 del entrypoint websecure preserva el
# WebSocket/PTY de code y el streaming, equivalente a read/write_timeout 0 de Caddy.
#
# VERIFICAR: api.kenitech.io llevaba CORS hecho a mano en Caddy (preflight + creds,
# allowlist = learn.kenitech.io). Aquí se replica con el middleware `headers`;
# pruébalo contra el frontend de learn (en 187.x) cuando esté operativo.

http:
  routers:
    api:
      rule: "Host(`api.kenitech.io`)"
      entryPoints: [websecure]
      service: api-cp
      middlewares: [api-cors, sec-headers]
      tls:
        certResolver: le
    code:
      rule: "Host(`code.kenitech.io`)"
      entryPoints: [websecure]
      service: code-launcher
      middlewares: [sec-headers]
      tls:
        certResolver: le

  services:
    api-cp:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8080"
    code-launcher:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9001"

  middlewares:
    sec-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
    api-cors:
      headers:
        accessControlAllowOriginList:
          - "https://learn.kenitech.io"
        accessControlAllowCredentials: true
        accessControlAllowMethods: ["GET", "POST", "PATCH", "DELETE", "OPTIONS"]
        accessControlAllowHeaders: ["Content-Type", "Authorization", "X-Requested-With"]
        accessControlMaxAge: 600
        addVaryHeader: true
