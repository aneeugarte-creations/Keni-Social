<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Guardián · incident-keeper</title>
<style>
  :root {
    --bg: #0b0c0e; --panel: #131519; --linea: #23262d; --txt: #e7e9ec; --apag: #8a909a;
    --azul: #4f86ff; --verde: #34c759; --ambar: #ffb02e; --rojo: #ff5c5c; --acc: #1b1e24;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--linea); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: .02em; }
  header h1 small { color: var(--apag); font-weight: 400; }
  .vig { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 12.5px; color: var(--apag); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .on { background: rgba(52,199,89,.12); color: var(--verde); } .off { background: var(--acc); color: var(--apag); }
  .bien { background: rgba(52,199,89,.14); color: var(--verde); } .mal { background: rgba(255,92,92,.14); color: var(--rojo); }
  main { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 49px); }
  #lista { border-right: 1px solid var(--linea); overflow-y: auto; }
  .ses { padding: 12px 16px; border-bottom: 1px solid var(--linea); cursor: pointer; }
  .ses:hover { background: var(--panel); } .ses.sel { background: var(--acc); }
  .ses .fila { display: flex; align-items: center; gap: 8px; }
  .trig { font-weight: 600; font-size: 13px; }
  .hora { color: var(--apag); font-size: 11.5px; margin-left: auto; }
  .ses .borrar { color: var(--apag); font-size: 16px; line-height: 1; padding: 0 2px; cursor: pointer; opacity: 0; transition: opacity .12s; }
  .ses:hover .borrar { opacity: .6; } .ses .borrar:hover { opacity: 1; color: var(--rojo); }
  .ses .meta2 { display: flex; gap: 10px; align-items: center; margin-top: 5px; color: var(--apag); font-size: 12px; flex-wrap: wrap; }
  .estado { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .e-corriendo { color: var(--azul); } .e-resuelto { color: var(--verde); } .e-escalado { color: var(--ambar); } .e-error { color: var(--rojo); } .e-bloqueado-limite { color: var(--rojo); } .e-abortado { color: var(--apag); } .e-interrumpido { color: var(--apag); } .e-verificando { color: var(--azul); } .e-fallido { color: var(--rojo); }
  .banner { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 16px; padding: 11px 14px; border-radius: 8px; background: rgba(255,92,92,.1); border: 1px solid rgba(255,92,92,.3); color: var(--txt); font-size: 13px; }
  .banner b { color: var(--rojo); } .banner .sub { color: var(--apag); display: block; margin-top: 3px; font-size: 12px; }
  .banner.info { background: rgba(79,134,255,.08); border-color: rgba(79,134,255,.3); } .banner.info b { color: var(--azul); }
  .blink { animation: bl 1s steps(2) infinite; } @keyframes bl { 50% { opacity: .35; } }
  .coste { font-variant-numeric: tabular-nums; } a { color: var(--azul); text-decoration: none; } a:hover { text-decoration: underline; }
  #detalle { overflow-y: auto; padding: 18px 22px; }
  #detalle .vacio { color: var(--apag); margin-top: 40px; text-align: center; }
  .cab { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .cab h2 { font-size: 15px; margin: 0; } .titulo { color: var(--apag); font-size: 13px; margin: 2px 0 16px; }
  .kpis { display: flex; gap: 22px; margin: 0 0 18px; padding: 12px 0; border-top: 1px solid var(--linea); border-bottom: 1px solid var(--linea); }
  .kpi b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; } .kpi span { color: var(--apag); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  .item { padding: 9px 0; border-bottom: 1px solid var(--acc); white-space: pre-wrap; word-break: break-word; }
  .item.razonamiento { color: var(--apag); font-style: italic; }
  .item.accion { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--ambar); }
  .item .et { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--apag); margin-right: 8px; vertical-align: 1px; }
  .cursor::after { content: "▋"; color: var(--azul); animation: bl .9s steps(2) infinite; }
  .ovl { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-start; justify-content: center; z-index: 10; }
  .ovl.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--linea); border-radius: 12px; width: min(460px, calc(100vw - 32px)); margin-top: 72px; padding: 18px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .modal h3 { margin: 0 0 4px; font-size: 15px; } .modal .sub { color: var(--apag); font-size: 12px; margin: 0 0 14px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  .badge { padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .b-on { background: rgba(52,199,89,.12); color: var(--verde); } .b-off { background: var(--acc); color: var(--apag); } .b-warn { background: rgba(255,176,46,.12); color: var(--ambar); }
  .med { margin: 9px 0; } .med .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--apag); margin-bottom: 3px; }
  .bar { height: 6px; border-radius: 4px; background: var(--acc); overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--verde); }
  .bar.hi > i { background: var(--ambar); } .bar.full > i { background: var(--rojo); }
  .btn { border: 1px solid var(--linea); background: var(--acc); color: var(--txt); font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 8px; cursor: pointer; }
  .btn:hover { border-color: var(--azul); } .btn.pri { background: var(--azul); border-color: var(--azul); color: #fff; } .btn.danger { color: var(--rojo); border-color: rgba(255,92,92,.4); }
  .btn:disabled { opacity: .5; cursor: default; }
  .modal input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--linea); border-radius: 8px; color: var(--txt); font: inherit; padding: 8px 10px; }
  .modal label { font-size: 12.5px; color: var(--apag); display: flex; align-items: center; gap: 6px; }
  .urlbox { background: var(--bg); border: 1px solid var(--linea); border-radius: 8px; padding: 8px 10px; font-size: 12px; word-break: break-all; margin: 8px 0; }
  .muted { color: var(--apag); font-size: 12px; }
  .err { color: var(--rojo); font-size: 12.5px; margin-top: 8px; }
  .end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
</style>
</head>
<body>
<header>
  <h1>Guardián <small>· incident-keeper</small></h1>
  <div class="vig" id="vig">…</div>
  <button id="bcuenta" class="pill off" style="cursor:pointer;border:none;font:inherit;margin-left:14px" title="Cuenta de Claude del guardián (estado / cambiar)">cuenta</button>
  <button id="btok" class="pill off" style="cursor:pointer;border:none;font:inherit;margin-left:8px" title="Token de Woodpecker (poner / rotar)">token</button>
  <button id="blimpiar" class="pill off" style="cursor:pointer;border:none;font:inherit;margin-left:8px" title="Borrar todo el historial de detecciones">🗑 limpiar</button>
</header>
<main>
  <div id="lista"></div>
  <div id="detalle"><div class="vacio">Selecciona una detección para ver el razonamiento.</div></div>
</main>
<div class="ovl" id="ovl"><div class="modal" id="modal"></div></div>
<script>
const REPO = "https://github.com/kenitech-io/keni-social/commit/";
let sel = null, timerDet = null;

const esc = s => (s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmtHora = iso => { if (!iso) return ""; try { return new Date(iso).toLocaleString("es-ES", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); } catch { return iso; } };
const fmtCoste = m => m.coste_usd != null ? "$" + Number(m.coste_usd).toFixed(4) : "—";
const fmtTok = m => (m.tokens_in != null || m.tokens_out != null) ? `${(m.tokens_in||0)+(m.tokens_out||0)} tok` : "";
const ESTADO_LBL = { "bloqueado-limite": "límite", "abortado": "abortado", "interrumpido": "interrumpido", "verificando": "verificando", "fallido": "fallido" };
const lblEstado = e => ESTADO_LBL[e] || e || "";
const pendiente = e => e === "corriendo" || e === "verificando";  // parpadea / sigue sondeando
const CI_BASE = "https://ci-social.kenitech.io";
const CIPIPE = n => `${CI_BASE}/repos/1/pipeline/${n}`;
// "CI #42" -> el #42 enlazado a su pipeline; "incidente prod" (sin #N) -> texto plano.
const trigHTML = t => { const m = /^(.*?)#(\d+)(.*)$/.exec(t || ""); return m ? `${esc(m[1])}#<a href="${CIPIPE(m[2])}" target="_blank" rel="noopener">${esc(m[2])}</a>${esc(m[3])}` : esc(t || "incidente"); };

function pintarVig(v) {
  const el = document.getElementById("vig");
  if (!v) { el.textContent = ""; return; }
  const ci = v.ci_on ? `<span class="pill on"><span class="dot" style="background:var(--verde)"></span>CI vigilada</span>`
                     : `<span class="pill off"><span class="dot" style="background:var(--apag)"></span>CI off</span>`;
  // SALUD de main AHORA: el último pipeline con VEREDICTO (verde/rojo), no el 'running' de turno.
  let salud = "";
  if (v.ultimo_completo) {
    const c = v.ultimo_completo, rojo = c.status==="failure"||c.status==="error";
    salud = `<span class="pill ${rojo?'mal':'bien'}"><span class="dot" style="background:${rojo?'var(--rojo)':'var(--verde)'}"></span>main ${rojo?'ROJO':'VERDE'} <a href="${CIPIPE(c.number)}" target="_blank" rel="noopener">#${c.number}</a></span>`;
  }
  let pipe = "";
  if (v.ultimo_pipeline && (!v.ultimo_completo || v.ultimo_pipeline.number !== v.ultimo_completo.number)) {
    const p = v.ultimo_pipeline;
    pipe = `<span>último <a href="${CIPIPE(p.number)}" target="_blank" rel="noopener">#${p.number}</a> ${esc(p.status)}</span>`;
  }
  el.innerHTML = ci + salud + pipe + (v.ultimo_chequeo ? `<span>chequeo ${fmtHora(v.ultimo_chequeo)}</span>` : "");
}

function pintarLista(ses) {
  const el = document.getElementById("lista");
  if (!ses.length) { el.innerHTML = `<div class="ses" style="cursor:default;color:var(--apag)">Aún no hay detecciones.</div>`; return; }
  el.innerHTML = ses.map(m => {
    const corr = pendiente(m.estado);
    return `<div class="ses ${m.id===sel?'sel':''}" data-id="${m.id}">
      <div class="fila"><span class="trig">${esc(m.trigger||"incidente")}</span>
        <span class="estado e-${m.estado} ${corr?'blink':''}">${esc(lblEstado(m.estado))}</span>
        <span class="hora">${fmtHora(m.inicio)}</span>
        ${corr ? "" : `<span class="borrar" data-del="${m.id}" title="Borrar esta detección">×</span>`}</div>
      <div class="meta2">
        <span class="coste">${fmtCoste(m)}</span><span>${fmtTok(m)}</span>
        ${m.commit_sha ? `<a href="${REPO}${m.commit_sha}" target="_blank" title="${esc(m.commit_msg)}">${m.commit_sha.slice(0,7)} ✓</a>` : ""}
        ${m.is_error && m.estado !== "bloqueado-limite" ? `<span style="color:var(--rojo)">error</span>` : ""}
      </div></div>`;
  }).join("");
  el.querySelectorAll(".ses[data-id]").forEach(d => d.onclick = () => seleccionar(d.dataset.id));
  el.querySelectorAll(".borrar[data-del]").forEach(b => b.onclick = e => { e.stopPropagation(); borrarSesion(b.dataset.del); });
}

function olvidarDetalle(id) {
  if (sel === id || id == null) { sel = null; if (timerDet) { clearInterval(timerDet); timerDet = null; }
    document.getElementById("detalle").innerHTML = `<div class="vacio">Selecciona una detección para ver el razonamiento.</div>`; }
}
async function borrarSesion(id) {
  if (!confirm("¿Borrar esta detección?")) return;
  try { await fetch(`/api/sesiones/${id}/borrar`, {method:"POST"}); olvidarDetalle(id); refrescarLista(); }
  catch { alert("Error de red al borrar."); }
}
async function limpiarHistorial() {
  if (!confirm("¿Borrar TODO el historial de detecciones? No se puede deshacer.")) return;
  try {
    const r = await fetch("/api/historial/borrar", {method:"POST"});
    if (r.ok) { olvidarDetalle(null); refrescarLista(); }
    else { const e = await r.json().catch(()=>({})); alert("Error: " + (e.error || r.status)); }
  } catch { alert("Error de red al borrar."); }
}
document.getElementById("blimpiar").onclick = limpiarHistorial;

function pintarDetalle(d) {
  const el = document.getElementById("detalle"); const m = d.meta;
  const corr = pendiente(m.estado);
  const items = (d.transcript||[]).map(it => {
    const et = it.tipo==="razonamiento" ? "razonamiento" : it.tipo==="accion" ? "acción" : "";
    return `<div class="item ${it.tipo} ${it.vivo?'cursor':''}">${et?`<span class="et">${et}</span>`:""}${esc(it.texto)}</div>`;
  }).join("");
  const banner = m.bloqueo_motivo === "limite-uso" ? `
    <div class="banner">⛔<div><b>Cuenta de Claude sin cuota.</b> El keeper no pudo arrancar: la cuenta agotó su límite de uso${m.bloqueo_tipo==="seven_day"?" semanal":""}.
      ${m.bloqueo_reset_iso ? `<span class="sub">Se restablece el ${fmtHora(m.bloqueo_reset_iso)}.</span>` : ""}
      ${m.bloqueo_mensaje ? `<span class="sub">${esc(m.bloqueo_mensaje)}</span>` : ""}</div></div>`
    : m.estado === "abortado" ? `
    <div class="banner info">✋<div><b>Fix abortado.</b> ${esc(m.nota || "Apareció un pipeline más nuevo en verde mientras arreglaba: el rojo ya estaba resuelto.")}</div></div>`
    : m.estado === "interrumpido" ? `
    <div class="banner info">⚠️<div><b>Sesión interrumpida.</b> ${esc(m.nota || "La sesión se cortó antes de terminar (reinicio del keeper o límite de tiempo).")}</div></div>`
    : m.estado === "verificando" ? `
    <div class="banner info">⏳<div><b>Verificando el fix.</b> ${esc(m.nota || "Fix pusheado; esperando a que su pipeline termine para confirmar el verde.")}</div></div>`
    : m.estado === "fallido" ? `
    <div class="banner">❌<div><b>El fix no bastó.</b> ${esc(m.nota || "El pipeline del fix salió rojo.")}</div></div>` : "";
  el.innerHTML = `
    <div class="cab"><h2>${trigHTML(m.trigger)}</h2>
      <span class="estado e-${m.estado} ${corr?'blink':''}">${esc(lblEstado(m.estado))}</span>
      ${m.commit_sha ? `<a href="${REPO}${m.commit_sha}" target="_blank">${m.commit_sha.slice(0,7)} · ${esc(m.commit_msg)}</a>` : ""}</div>
    <div class="titulo">${esc(m.titulo||"")}</div>
    ${banner}
    <div class="kpis">
      <div class="kpi"><b class="coste">${fmtCoste(m)}</b><span>coste</span></div>
      <div class="kpi"><b>${m.tokens_in!=null?m.tokens_in:"—"}</b><span>tokens in</span></div>
      <div class="kpi"><b>${m.tokens_out!=null?m.tokens_out:"—"}</b><span>tokens out</span></div>
      <div class="kpi"><b>${m.num_turns!=null?m.num_turns:"—"}</b><span>turnos</span></div>
    </div>
    ${items || `<div class="vacio">Sin razonamiento todavía…</div>`}`;
}

async function seleccionar(id) {
  sel = id;
  document.querySelectorAll(".ses").forEach(s => s.classList.toggle("sel", s.dataset.id===id));
  if (timerDet) clearInterval(timerDet);
  const cargar = async () => {
    try {
      const r = await fetch(`/api/sesiones/${id}`); if (!r.ok) return;
      const d = await r.json(); pintarDetalle(d);
      if (!pendiente(d.meta.estado) && timerDet) { clearInterval(timerDet); timerDet = null; }
    } catch {}
  };
  await cargar();
  timerDet = setInterval(cargar, 1500);   // sondeo => sensación de streaming mientras corre
}

async function refrescarLista() {
  try {
    const r = await fetch("/api/sesiones"); if (!r.ok) return;
    const d = await r.json(); pintarVig(d.vigilancia); pintarLista(d.sesiones || []);
    if (sel === null && d.sesiones && d.sesiones.length) seleccionar(d.sesiones[0].id);
  } catch {}
}
async function refrescarToken() {
  try {
    const r = await fetch("/api/token"); if (!r.ok) return;
    const d = await r.json(); const b = document.getElementById("btok");
    b.className = "pill " + (d.set ? "on" : "off");
    b.innerHTML = `<span class="dot" style="background:${d.set?'var(--verde)':'var(--ambar)'}"></span>token ${d.set?'✓':'—'}`;
  } catch {}
}
document.getElementById("btok").onclick = async () => {
  const t = prompt("PAT de Woodpecker para el keeper (poner / rotar).\nGenéralo en ci-social.kenitech.io → avatar → Settings → CLI and API.\nDeja vacío para cancelar:");
  if (!t || !t.trim()) return;
  try {
    const r = await fetch("/api/token", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({token: t.trim()})});
    if (r.ok) { alert("Token guardado. El keeper lo tomará en el próximo ciclo."); refrescarToken(); }
    else { const e = await r.json().catch(()=>({})); alert("Error: " + (e.error || r.status)); }
  } catch { alert("Error de red al guardar el token."); }
};
refrescarToken();

// ----- Cuenta de Claude del guardián -----------------------------------------------------
let cuenta = null, vista = "principal", loginSesion = null, errCuenta = "";
const post = (url, body) => fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{})}).then(async r => ({ok:r.ok, data: await r.json().catch(()=>({}))}));

function pintarPillCuenta() {
  const b = document.getElementById("bcuenta"); const a = cuenta && cuenta.auth;
  const on = a && a.logueado === true, desc = !a || a.logueado == null;
  b.className = "pill " + (on ? "on" : "off");
  const color = on ? "var(--verde)" : desc ? "var(--apag)" : "var(--ambar)";
  const txt = on ? (a.email || "cuenta ✓") : desc ? "cuenta" : "sin cuenta";
  b.innerHTML = `<span class="dot" style="background:${color}"></span>${esc(txt)}`;
}

async function cargarCuenta() {
  try {
    const r = await fetch("/api/cuenta"); if (!r.ok) return;
    cuenta = await r.json(); pintarPillCuenta();
    if (document.getElementById("ovl").classList.contains("open")) renderModal();
  } catch {}
}

function medidor(m) {
  const pct = Math.max(0, Math.min(100, m.pct || 0));
  const cls = pct >= 95 ? "full" : pct >= 80 ? "hi" : "";
  const reset = m.reset_iso ? fmtHora(m.reset_iso) : (m.reset || "");
  return `<div class="med"><div class="lbl"><span>${esc(m.etiqueta)}</span><span>${pct}%${reset?` · ${esc(reset)}`:""}</span></div>
    <div class="bar ${cls}"><i style="width:${pct}%"></i></div></div>`;
}

function renderModal() {
  const m = document.getElementById("modal");
  const a = (cuenta && cuenta.auth) || {}, u = (cuenta && cuenta.uso) || {};
  const cargando = cuenta === null;
  const head = `<h3>Cuenta de Claude · Guardián</h3>
    <p class="sub">Independiente de la cuenta de generación. El keeper usa esta.</p>`;
  const errBox = errCuenta ? `<div class="err">${esc(errCuenta)}</div>` : "";

  if (vista === "opciones") {
    m.innerHTML = head + `
      <div class="row"><label><input type="checkbox" id="cConsole"> cuenta de consola (API) en vez de suscripción</label></div>
      <div class="row"><input type="text" id="cEmail" placeholder="email (opcional)" autocomplete="off"></div>
      <div class="row"><label><input type="checkbox" id="cSso"> usar SSO</label></div>
      ${errBox}
      <div class="end"><button class="btn" id="cVolver">Volver</button><button class="btn pri" id="cEnlace">Obtener enlace</button></div>`;
    m.querySelector("#cVolver").onclick = () => { vista="principal"; errCuenta=""; renderModal(); };
    m.querySelector("#cEnlace").onclick = async (e) => {
      e.target.disabled = true; e.target.textContent = "Pidiendo enlace…"; errCuenta = "";
      const r = await post("/api/cuenta/login/iniciar", {
        console: m.querySelector("#cConsole").checked,
        email: m.querySelector("#cEmail").value.trim() || null,
        sso: m.querySelector("#cSso").checked,
      });
      if (r.ok && r.data.sesion) { loginSesion = r.data; vista = "url"; renderModal(); }
      else { errCuenta = r.data.error || "no se pudo iniciar el login"; if (r.data.salida) errCuenta += " · " + r.data.salida; renderModal(); }
    };
    return;
  }

  if (vista === "url" && loginSesion) {
    m.innerHTML = head + `
      <p class="muted">1. Abre el enlace, inicia sesión con la cuenta de <b>Keni</b> y copia el código.</p>
      <div class="urlbox">${esc(loginSesion.url)}</div>
      <div class="row"><button class="btn" id="cCopiar">Copiar</button><button class="btn" id="cAbrir">Abrir</button></div>
      <p class="muted">2. Pega aquí el código:</p>
      <div class="row"><input type="text" id="cCodigo" placeholder="código de autorización" autocomplete="off"></div>
      ${errBox}
      <div class="end"><button class="btn" id="cCancelar">Cancelar</button><button class="btn pri" id="cConfirmar">Confirmar</button></div>`;
    m.querySelector("#cCopiar").onclick = () => navigator.clipboard?.writeText(loginSesion.url);
    m.querySelector("#cAbrir").onclick = () => window.open(loginSesion.url, "_blank", "noopener");
    m.querySelector("#cCancelar").onclick = () => cancelarLogin();
    m.querySelector("#cConfirmar").onclick = async (e) => {
      const cod = m.querySelector("#cCodigo").value.trim();
      if (!cod) { errCuenta = "pega el código"; return renderModal(); }
      e.target.disabled = true; e.target.textContent = "Confirmando…"; errCuenta = "";
      const r = await post("/api/cuenta/login/codigo", {sesion: loginSesion.sesion, codigo: cod});
      if (r.ok && r.data.ok) { loginSesion = null; vista = "principal"; cuenta = null; renderModal(); cargarCuenta(); }
      else { errCuenta = r.data.mensaje || r.data.error || "el login falló"; renderModal(); }
    };
    return;
  }

  // vista principal
  const badge = cargando ? `<span class="badge b-off">cargando…</span>`
    : a.logueado === true ? `<span class="badge b-on">conectada</span>`
    : a.logueado === false ? `<span class="badge b-warn">sin cuenta</span>`
    : `<span class="badge b-off">desconocida</span>`;
  const ident = a.logueado === true ? `<span class="muted">${esc(a.email||"")}${a.plan?` · ${esc(a.plan)}`:""}${a.org?` · ${esc(a.org)}`:""}</span>` : "";
  const meds = (u.disponible && u.medidores && u.medidores.length)
    ? u.medidores.map(medidor).join("") + (u.cacheado ? `<p class="muted">medidor cacheado</p>` : "")
    : (cargando ? "" : `<p class="muted">Sin medidor de uso disponible.</p>`);
  m.innerHTML = head + `
    <div class="row">${badge}${ident}</div>
    ${meds}
    ${errBox}
    <div class="end">
      ${a.logueado === true ? `<button class="btn danger" id="cLogout">Cerrar sesión</button>` : ""}
      <button class="btn pri" id="cCambiar">${a.logueado === true ? "Cambiar cuenta" : "Conectar cuenta"}</button>
    </div>`;
  const camb = m.querySelector("#cCambiar"); if (camb) camb.onclick = () => { vista="opciones"; errCuenta=""; renderModal(); };
  const lg = m.querySelector("#cLogout"); if (lg) lg.onclick = async (e) => {
    if (!confirm("¿Cerrar la sesión de Claude del guardián? El keeper quedará sin cuenta hasta el próximo login.")) return;
    e.target.disabled = true; e.target.textContent = "Cerrando…"; errCuenta = "";
    const r = await post("/api/cuenta/logout", {});
    if (r.ok && r.data.ok) { cuenta = null; renderModal(); cargarCuenta(); }
    else { errCuenta = r.data.mensaje || "no se pudo cerrar sesión"; renderModal(); }
  };
}

async function cancelarLogin() {
  if (loginSesion && loginSesion.sesion) { try { await post("/api/cuenta/login/cancelar", {sesion: loginSesion.sesion}); } catch {} }
  loginSesion = null; vista = "principal"; errCuenta = ""; renderModal();
}

function abrirCuenta() {
  document.getElementById("ovl").classList.add("open");
  vista = "principal"; errCuenta = ""; renderModal(); cargarCuenta();
}
function cerrarCuenta() {
  document.getElementById("ovl").classList.remove("open");
  if (vista === "url") cancelarLogin();
}
document.getElementById("bcuenta").onclick = abrirCuenta;
document.getElementById("ovl").onclick = e => { if (e.target.id === "ovl") cerrarCuenta(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.getElementById("ovl").classList.contains("open")) cerrarCuenta(); });
cargarCuenta();

refrescarLista();
setInterval(refrescarLista, 2500);
setInterval(refrescarToken, 15000);
</script>
</body>
</html>
