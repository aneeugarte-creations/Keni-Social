# keni-social — stack hosted/equipo (ADR 0002, Fase C).
#
# Topologia (deployables de ADR 0002 + infra compartida):
#   traefik  reverse proxy + TLS (Let's Encrypt). Unico que publica :80/:443.
#   front    SPA React servido por nginx.            (Traefik: TODO menos /api)
#   back     gateway Starlette; ENCOLA la generacion. (Traefik: /api)  Sin Node ni `claude`.
#   worker   consume la cola y corre `claude -p`.    (interno; #130 Fase 2 / ADR 0002 Fase B)
#   mcp      keni-metricas por HTTP (interno; expon con bearer si lo necesitas).
#   db       Postgres 16  (CONSUMIDO por el back si DATABASE_URL; si no, SQLite local).
#   files    Garage S3     (CONSUMIDO por el back si S3_*; si no, media a disco local).
#
# El contexto de build de las imagenes propias es la RAIZ del repo (`..`).
#
# INGRESS: Traefik es el ingress unico (network_mode: host, dueño de :80/:443).
# En el servidor Latitude el Caddy de sistema fue retirado (systemctl disable --now caddy).
# Traefik sirve tambien code/api.kenitech.io via traefik/dynamic/legacy-sites.yml.

name: keni-social

# ──────────────────────────────────────────────────────────────────────────────
# LIMITES DE RECURSOS / SALUD (hardening, single-VPS Compose — NO Swarm).
#
# Esto es un deploy de Docker Compose en UNA sola maquina (Latitude), no Swarm: por
# eso usamos las claves de Compose `mem_limit` / `cpus` (top-level del servicio), NO
# `deploy.resources` (que Compose IGNORA fuera de Swarm).
#
# Los `mem_limit` de abajo estan AFINADOS al VPS REAL (medido): 12 vCPU, 61 GiB RAM,
# 879 GB disco. El objetivo es que un pico de `claude -p` (worker) o un Garage (files)
# desbocado NO pueda OOM-matar a Postgres y tumbar la caja entera, dejando a la vez
# holgura amplia (la caja comparte con el stack de CI Woodpecker + un learn-postgres).
# Los limites de los servicios pesados son OVERRIDABLES por env (.env) sin tocar este
# fichero:
#
#   Servicio   mem_limit (def)   env override            cpus
#   ────────   ───────────────   ─────────────────────   ─────────
#   db         8g                DB_MEM_LIMIT            (reserva: sin tope de CPU)
#   worker     6g                WORKER_MEM_LIMIT        WORKER_CPUS (def 4)
#   back       3g                BACK_MEM_LIMIT          3.0
#   files      3g                FILES_MEM_LIMIT         2.0
#   daemons    2g                DAEMONS_MEM_LIMIT       2.0
#   mcp        1g                MCP_MEM_LIMIT           1.0
#   traefik    512m              —                       1.0
#   front      256m              —                       1.0
#
# Suma de defaults ≈ 23.8 GiB sobre 61 GiB: deja ~37 GiB para host + CI + learn-postgres.
# Los `cpus` son TOPES (no reservas): si keni esta ocioso, el CI usa los 12 nucleos.
# ──────────────────────────────────────────────────────────────────────────────

services:
  traefik:
    # v3 (movil): Traefik v3.1 trae un cliente Docker que negocia API 1.24 y falla
    # contra Docker Engine 29 ("client version 1.24 is too old", API min >=1.40).
    # El v3 al dia negocia la version con el daemon. (Conviene fijar tag exacto.)
    image: traefik:v3
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=keni-social_edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${KENI_ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # Provider de fichero: routers de los 3 sitios legados (learn/api/code) para
      # el cutover de Caddy -> Traefik. Inertes hasta que Traefik sea el ingress.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # Sin idle-timeout: imprescindible para streaming SSE (generacion token a
      # token de la Consola) y para el PTY/WebSocket del code-launcher.
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=0
      # - --api.dashboard=true   # opcional: protege con middleware antes de exponer
      # - --log.level=DEBUG
    # network_mode: host — necesario porque los servicios legados del host
    # (learn-control-plane 127.0.0.1:8080, code-launcher 127.0.0.1:9001) escuchan
    # SOLO en loopback y un Traefik en bridge no los alcanza. En host mode Traefik
    # comparte la loopback del host (llega a esos :8080/:9001) y ademas alcanza a
    # front/back por su IP de la red bridge keni-social_edge. Bind 80/443 directo.
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    # Ingress liviano; topes conservadores (ver bloque de cabecera).
    mem_limit: 512m
    cpus: 1.0

  front:
    build:
      context: ..
      dockerfile: deploy/front/Dockerfile
    image: keni-social/front:${KENI_VERSION:-latest}
    restart: unless-stopped
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=keni-social_edge
      # Catch-all del host: el SPA. Prioridad BAJA para no tapar /api del back.
      - traefik.http.routers.front.rule=Host(`${KENI_HOST}`)
      - traefik.http.routers.front.priority=1
      - traefik.http.routers.front.entrypoints=websecure
      - traefik.http.routers.front.tls.certresolver=le
      - traefik.http.services.front.loadbalancer.server.port=80
    # nginx estatico: huella minima. 127.0.0.1 (no `localhost`): el busybox wget de
    # alpine intenta ::1 (IPv6) primero y nginx solo escucha IPv4 (ver front/Dockerfile).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: 1.0

  back:
    build:
      context: ..
      dockerfile: deploy/back/Dockerfile
    image: keni-social/back:${KENI_VERSION:-latest}
    restart: unless-stopped
    environment:
      XDG_CONFIG_HOME: /data
      KENI_DATA_DIR: /data
      KENI_SKILLS_CWD: /app
      # Store EDITABLE de ajustes (flags + tuning) cambiados desde la UI por el admin. En el
      # volumen COMPARTIDO (back, daemons, worker) para que un cambio en caliente lo vean
      # todos los procesos (precedencia store > env > defecto en config._crudo).
      KENI_CONSOLA_AJUSTES: /data/ajustes.toml
      # El back YA corre como usuario no-root (deploy/back/Dockerfile). El back no ejecuta
      # `claude` (solo encola), pero dejamos IS_SANDBOX=1 inocuo por si algun camino lo
      # consultara; el bypass de root de `claude` ya no aplica al ser no-root. Ver README.
      IS_SANDBOX: "1"
      # Modelo de imagen en OpenRouter. El SELECTOR de Ajustes lo elige (se guarda en el
      # almacen y MANDA sobre este env). Este env es solo un override de operador por .env;
      # VACIO por defecto => el defecto del codigo: openai/gpt-5-image-mini (economico y
      # SI genera personas; Nano Banana/Gemini es mas barato pero BLOQUEA personas).
      OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-}
      # Token interino OPCIONAL (#130): gate EXTRA. La barrera principal es el login
      # multiusuario (sesion) + CSRF; el back queda protegido aunque esto este vacio.
      KENI_CONSOLA_TOKEN: ${KENI_CONSOLA_TOKEN}
      # Host(s) externo(s) permitido(s) para el chequeo CSRF detras de Traefik. Igual a
      # KENI_HOST (social.kenitech.io): el `Origin` del SPA es el host publico, no el Host
      # interno que ve el back. Sin esto, las mutaciones del SPA tras el proxy darian 403.
      KENI_CONSOLA_ORIGENES: ${KENI_HOST}
      # Cookies Secure: vamos tras un proxy TLS (Traefik termina HTTPS).
      KENI_CONSOLA_HTTPS: "1"
      KENI_CONSOLA_ADMIN_USER: ${KENI_CONSOLA_ADMIN_USER}
      KENI_CONSOLA_ADMIN_PASS: ${KENI_CONSOLA_ADMIN_PASS}
      KENI_CONSOLA_SESION_HORAS: ${KENI_CONSOLA_SESION_HORAS}
      # MCP operativo (servidor MCP en `/mcp` del mismo back): bearer que exige el endpoint
      # a los clientes (Claude Code) e identidad con la que opera la API por dentro. Si
      # KENI_MCP_BEARER esta vacio, `/mcp` NO se monta (apagado por defecto). KENI_MCP_USUARIO
      # es opcional: vacio => cae al admin/dueño (KENI_CONSOLA_ADMIN_USER). Ver deploy/README.
      KENI_MCP_BEARER: ${KENI_MCP_BEARER:-}
      KENI_MCP_USUARIO: ${KENI_MCP_USUARIO:-}
      KENI_MAX_JOBS: ${KENI_MAX_JOBS}
      # El back solo ENCOLA (#130 Fase 2): NO arranca su worker in-proceso (lo hace el
      # servicio `worker`). La credencial de Claude la lleva el worker, no el back.
      KENI_WORKER_EXTERNO: "1"
      # Persistencia hosted (#130): el back consume Postgres si DATABASE_URL esta puesta y
      # S3/Garage si S3_* lo estan; vacias => SQLite + disco (perfil local). Cutover de datos
      # existentes: `python -m keni_consola.migracion` (ver deploy/README.md).
      # DATABASE_URL es OPCIONAL: si se deja en blanco, el back la DERIVA de POSTGRES_* (con
      # %-encoding) para que NO pueda desincronizarse de la password. Solo fijala para apuntar
      # a un Postgres externo o un DSN con parametros especiales.
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Agencias de noticias (item F): fuentes OPCIONALES del Radar/Fuentes. Sin credencial
      # quedan "pendientes" (no descargan, no rompen). Ver deploy/README.md.
      KENI_REUTERS_API_KEY: ${KENI_REUTERS_API_KEY:-}
      KENI_AFP_CLIENT_ID: ${KENI_AFP_CLIENT_ID:-}
      KENI_AFP_CLIENT_SECRET: ${KENI_AFP_CLIENT_SECRET:-}
    volumes:
      # Estado de la app: consola.db (SQLite), secretos.toml (0600), media, tareas.
      - keni-data:/data
    networks:
      - edge
      - internal
    # Arranque en frio ordenado: no levantar el back antes de que Postgres acepte
    # conexiones (si no, crash-loop al boot). `files` (S3/Garage) tambien sano: el
    # back consume S3_* al arrancar. `mcp` no expone condicion -> service_started.
    depends_on:
      db:
        condition: service_healthy
      files:
        condition: service_healthy
      mcp:
        condition: service_started
    # El HEALTHCHECK lo hereda del Dockerfile (curl :8765/healthz). No lo redefinimos.
    mem_limit: ${BACK_MEM_LIMIT:-3g}
    cpus: 3.0
    labels:
      - traefik.enable=true
      - traefik.docker.network=keni-social_edge
      # /api y /mcp van al gateway. Prioridad ALTA para ganar al catch-all del front. El
      # MCP operativo se sirve en /mcp del mismo back (sin imagen/servicio nuevos); su
      # barrera es el bearer KENI_MCP_BEARER (no la auth del SPA). Ver mcp_operativo.py.
      - traefik.http.routers.back.rule=Host(`${KENI_HOST}`) && (PathPrefix(`/api`) || PathPrefix(`/mcp`))
      - traefik.http.routers.back.priority=10
      - traefik.http.routers.back.entrypoints=websecure
      - traefik.http.routers.back.tls.certresolver=le
      - traefik.http.services.back.loadbalancer.server.port=8765

  daemons:
    # Proceso SOLO-daemons (Fase 3): el `back` corre uvicorn (que a proposito NO arranca
    # daemons, para no levantarlos en los tests) y el `worker` solo procesa la cola de jobs;
    # sin este servicio los hilos demonio de fondo NO correrian en prod. Corre
    # `python -m keni_consola.daemons`: refresco de metricas (cuenta + por pieza), alertas de
    # rendimiento/reciclaje, scanner de vencimientos, captura comercial, programador (DRY-RUN
    # salvo KENI_PUBLICAR_REAL), auto-promocion del Radar (solo con KENI_RADAR_AUTO) y la
    # AUTO-PRODUCCION de la tuberia (Flujo C): auto-copy (KENI_AUTOGEN) + auto-arte
    # (KENI_AUTOGEN_ARTE), que llevan los temas a BORRADOR en la cola de revision. NO publica
    # ni aprueba contenido por su cuenta (la auto-produccion para en el gate humano); NO
    # publica puertos ni va por Traefik. Misma imagen que el `back`; comparte Postgres + /data
    # (donde viven las credenciales Metricool y la clave del proveedor de imagen del auto-arte).
    build:
      context: ..
      dockerfile: deploy/back/Dockerfile
    image: keni-social/back:${KENI_VERSION:-latest}
    restart: unless-stopped
    command: ["python", "-m", "keni_consola.daemons"]
    # El daemons NO levanta uvicorn (corre solo los hilos de fondo), pero comparte imagen
    # con el back, cuyo Dockerfile define un HEALTHCHECK `curl :8765/healthz`. Heredado aqui
    # daria SIEMPRE "unhealthy" (no hay servidor en 8765) -> estado de salud enganoso. Lo
    # desactivamos: la liveness la cubre `restart: unless-stopped` (si el proceso muere, el
    # contenedor sale y se reinicia).
    healthcheck:
      disable: true
    environment:
      XDG_CONFIG_HOME: /data
      KENI_DATA_DIR: /data
      KENI_SKILLS_CWD: /app
      IS_SANDBOX: "1"
      # Store EDITABLE de ajustes compartido con back/worker (mismo volumen keni-data): los
      # daemons leen aqui los flags/tuning cambiados en caliente (store > env > defecto).
      KENI_CONSOLA_AJUSTES: /data/ajustes.toml
      # No arranca worker in-proceso (lo hace el servicio `worker`); inocuo aqui igualmente.
      KENI_WORKER_EXTERNO: "1"
      # Persistencia compartida con el back: Postgres + S3/Garage. Las credenciales de
      # Metricool por marca viven en la persistencia (/data + DB), no en estas env.
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Agencias de noticias (item F): tambien aqui, porque la auto-promocion del Radar
      # (radar_auto) lee las mismas fuentes. Sin credencial: pendientes, no rompen.
      KENI_REUTERS_API_KEY: ${KENI_REUTERS_API_KEY:-}
      KENI_AFP_CLIENT_ID: ${KENI_AFP_CLIENT_ID:-}
      KENI_AFP_CLIENT_SECRET: ${KENI_AFP_CLIENT_SECRET:-}
      # MOTOR DE INGESTA PERSISTENTE (Ola A): ACTIVO en producción. SOLO LEE feeds RSS públicos
      # y persiste cada artículo en `noticias_items` (archivo a nivel de artículo) en background;
      # NO genera ni publica nada, así que es seguro encenderlo aquí (a diferencia de los gates
      # de abajo). El Radar/Plan y la UI leen del store; la red se sondea con cadencia por feed.
      KENI_INGESTA: "1"
      # GATES DE SEGURIDAD: ausentes por defecto. Sin estos, el sistema NO publica ni crea
      # contenido solo. Activar SOLO con decision explicita (ver deploy/README.md §Validacion):
      #   KENI_RADAR_AUTO:    "1"   # auto-promueve temas del Radar (def: solo bandeja revisable)
      #   KENI_AUTOGEN:       "1"   # auto-genera COPY de los temas (borrador a la cola de revision)
      #   KENI_AUTOGEN_ARTE:  "1"   # auto-genera ARTE de los temas con copy sin imagen
      #   KENI_PUBLICAR_REAL: "1"   # publica de verdad a Metricool (def: dry-run, no postea)
      # VALIDACION (decision de direccion 2026-06-01): encender los TRES primeros con
      # KENI_PUBLICAR_REAL OFF. Es seguro: todo para en la cola de revision; nada sale a redes
      # sin que el humano lo autorice. Los flags tambien se encienden EN CALIENTE desde el store
      # editable (/data/ajustes.toml), sin reiniciar el contenedor (store > env > defecto).
    volumes:
      - keni-data:/data
    networks:
      - internal
    # Arranque ordenado: Postgres sano (lee la cola/estado) y Garage sano (el
    # auto-arte importa media a S3). Evita crash-loop en cold start.
    depends_on:
      db:
        condition: service_healthy
      files:
        condition: service_healthy
    mem_limit: ${DAEMONS_MEM_LIMIT:-2g}
    cpus: 2.0

  worker:
    # Worker de generacion (#130 Fase 2 / ADR 0002 Fase B): consume la cola (tabla `jobs`
    # del Postgres compartido) y corre `claude -p`. SI lleva Node + `claude` (la del back
    # ya no). NO publica puertos ni va por Traefik: solo habla con db/files por la red
    # interna. Reiniciar el back NO mata sus jobs (es otro contenedor). Escalable: subir
    # `--scale worker=N` reparte la cola sin doble-ejecutar (claim FOR UPDATE SKIP LOCKED).
    build:
      context: ..
      dockerfile: deploy/worker/Dockerfile
    image: keni-social/worker:${KENI_VERSION:-latest}
    restart: unless-stopped
    environment:
      XDG_CONFIG_HOME: /data
      KENI_DATA_DIR: /data
      KENI_SKILLS_CWD: /app
      # Store EDITABLE de ajustes compartido con back/daemons (mismo volumen keni-data): el
      # worker ve los flags/tuning cambiados en caliente (store > env > defecto).
      KENI_CONSOLA_AJUSTES: /data/ajustes.toml
      # El worker YA corre como usuario no-root (deploy/worker/Dockerfile). Fuera de root,
      # `claude` NO restringe --dangerously-skip-permissions (esa guarda es solo para uid 0),
      # asi que IS_SANDBOX deja de ser necesario; lo dejamos en "1" (inocuo) por compatibilidad.
      IS_SANDBOX: "1"
      OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-}
      # Concurrencia de `claude` por worker + topes de coste/tiempo (mismos nombres que antes).
      KENI_MAX_JOBS: ${KENI_MAX_JOBS}
      # Credencial de Claude para `claude -p` (el back ya no la necesita: no genera).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      # Cola compartida (Postgres) + media (S3/Garage): el worker LEE la cola de Postgres y
      # ESCRIBE el post-procesado (historial/borradores/media) en la misma persistencia.
      # DATABASE_URL es OPCIONAL: si se deja en blanco, el worker la DERIVA de POSTGRES_* (con
      # %-encoding) para que NO pueda desincronizarse de la password. Solo fijala para apuntar
      # a un Postgres externo o un DSN con parametros especiales.
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      # Mismo volumen de estado que el back: secretos.toml (clave de imagen), media en
      # disco si no hay S3, y el contenido editorial YAML que el post-procesado escribe.
      - keni-data:/data
    networks:
      - internal
    # Arranque ordenado: el worker LEE la cola de Postgres y ESCRIBE media en S3/Garage,
    # ambos deben estar sanos antes de arrancar (evita crash-loop en cold start).
    depends_on:
      db:
        condition: service_healthy
      files:
        condition: service_healthy
    # El worker NO sirve HTTP (solo consume la cola): no hay endpoint que sondear. Como
    # heartbeat comprobamos que el bucle del worker (`keni_consola.worker`) sigue vivo
    # escaneando /proc con el python que ya trae la imagen (sin depender de procps/pgrep).
    # Si el bucle muere, el contenedor sale y `restart: unless-stopped` lo reinicia; este
    # healthcheck ademas lo marca `unhealthy` para visibilidad/monitorizacion.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          python -c "import os,glob,sys;
          sys.exit(0 if any('keni_consola.worker' in open(p).read().replace(chr(0),' ')
          for p in glob.glob('/proc/[0-9]*/cmdline')) else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: ${WORKER_MEM_LIMIT:-6g}
    cpus: ${WORKER_CPUS:-4}

  mcp:
    build:
      context: ..
      dockerfile: deploy/mcp/Dockerfile
    image: keni-social/mcp:${KENI_VERSION:-latest}
    restart: unless-stopped
    environment:
      KENI_MCP_TRANSPORT: http
      KENI_MCP_HOST: 0.0.0.0
      KENI_MCP_PORT: "8000"
      KENI_METRICAS_FUENTE: ${KENI_METRICAS_FUENTE}
      # KENI_METRICAS_CONFIG: /config/config.toml
    # volumes:
    #   - ./config:/config:ro   # monta aqui el config.toml real (fuente=real)
    networks:
      - internal
    # El endpoint /mcp (streamable-http) no responde 200 a un GET simple; comprobamos
    # que el puerto 8000 acepta conexiones con el python que ya trae la imagen (mismo
    # criterio que el HEALTHCHECK del Dockerfile, explicitado aqui).
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import socket; socket.create_connection(('127.0.0.1',8000),2)\" || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: ${MCP_MEM_LIMIT:-1g}
    cpus: 1.0
    # INTERNO por defecto: el endpoint /mcp NO lleva auth propia. Para exponerlo a
    # clientes Claude del equipo, añade un router Traefik con un middleware bearer/
    # basicauth y un subdominio (p.ej. mcp.kenitech.io). Ver README.

  db:
    image: postgres:16
    restart: unless-stopped
    # Tuning para el VPS real (61 GiB, db mem_limit 8g). La app abre MUCHAS conexiones
    # cortas (back + daemons + worker escalable); el techo por defecto (max_connections=100)
    # da "too many clients". Subimos a 200 y shared_buffers a ~25% del mem_limit (2GB). El
    # arreglo de fondo (pool de conexiones) sigue pendiente: con pool, 200 sobra. Si bajas
    # DB_MEM_LIMIT, baja shared_buffers en proporcion.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=2GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Password del rol de aplicacion de MINIMO PRIVILEGIO `keni_app` (lo consume el
      # init script `postgres/initdb/10-app-role.sh` en el PRIMER arranque). El back
      # conecta como keni_app via DATABASE_URL, no como el superuser bootstrap.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea `keni_app` SOLO al inicializar un cluster vacio (postgres ejecuta initdb.d
      # una unica vez). En un volumen ya poblado no corre. Ver el script para detalles.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Postgres es el corazon del stack: le reservamos holgura de RAM y NO le ponemos tope
    # de CPU (no queremos throttlearlo). El mem_limit es un suelo defensivo para que un pico
    # de otro servicio no lo OOM-mate; subelo si el VPS tiene RAM de sobra.
    mem_limit: ${DB_MEM_LIMIT:-8g}
    # Sin `ports`: NO se publica 5432 al host (evita choque con learn-postgres y
    # no se expone a la red). Solo el back lo alcanza por la red interna.

  files:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks:
      - internal
    # La imagen de Garage es minima (sin shell, ni curl/wget, ni python): no podemos usar
    # CMD-SHELL. Usamos su PROPIO binario `/garage status` (forma exec, sin shell), que se
    # conecta por RPC al daemon local leyendo /etc/garage.toml y sale !=0 si el nodo no
    # responde. start_period holgado por el arranque del motor LMDB.
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: ${FILES_MEM_LIMIT:-3g}
    cpus: 2.0
    # Bootstrap de una vez (layout + bucket + clave): ver README. Sin `ports`:
    # interno; el back habla S3 por http://files:3900.

networks:
  edge:
  internal:

volumes:
  traefik-acme:
  keni-data:
  pgdata:
  garage-meta:
  garage-data:
