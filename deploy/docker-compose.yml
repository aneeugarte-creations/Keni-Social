# keni-social — stack hosted/equipo (ADR 0002, Fase C).
#
# Topologia (deployables de ADR 0002 + infra compartida):
#   traefik  reverse proxy + TLS (Let's Encrypt). Unico que publica :80/:443.
#   front    SPA React servido por nginx.            (Traefik: TODO menos /api)
#   back     gateway Starlette; ENCOLA la generacion. (Traefik: /api)  Sin Node ni `claude`.
#   worker   consume la cola y corre `claude -p`.    (interno; #130 Fase 2 / ADR 0002 Fase B)
#   mcp      keni-metricas por HTTP (interno; expon con bearer si lo necesitas).
#   db       Postgres 16  (CONSUMIDO por el back si DATABASE_URL; si no, SQLite local).
#   files    Garage S3     (CONSUMIDO por el back si S3_*; si no, media a disco local).
#
# El contexto de build de las imagenes propias es la RAIZ del repo (`..`).
#
# INGRESS: Traefik es el ingress unico (network_mode: host, dueño de :80/:443).
# Los sitios legacy code/api.kenitech.io fueron desmantelados (2026-06-12); Traefik
# ya solo sirve este stack.

name: keni-social

# ──────────────────────────────────────────────────────────────────────────────
# LIMITES DE RECURSOS / SALUD (hardening, single-VPS Compose — NO Swarm).
#
# Esto es un deploy de Docker Compose en UNA sola maquina (Latitude), no Swarm: por
# eso usamos las claves de Compose `mem_limit` / `cpus` (top-level del servicio), NO
# `deploy.resources` (que Compose IGNORA fuera de Swarm).
#
# Los `mem_limit` de abajo estan AFINADOS al VPS REAL (medido): 12 vCPU, 61 GiB RAM,
# 879 GB disco. El objetivo es que un pico de `claude -p` (worker) o un Garage (files)
# desbocado NO pueda OOM-matar a Postgres y tumbar la caja entera, dejando a la vez
# holgura amplia (la caja comparte con el stack de CI Woodpecker + un learn-postgres).
# Los limites de los servicios pesados son OVERRIDABLES por env (.env) sin tocar este
# fichero:
#
#   Servicio   mem_limit (def)   env override            cpus
#   ────────   ───────────────   ─────────────────────   ─────────
#   db         8g                DB_MEM_LIMIT            (reserva: sin tope de CPU)
#   worker     20g               WORKER_MEM_LIMIT        WORKER_CPUS (def 6)
#   back       3g                BACK_MEM_LIMIT          3.0
#   files      3g                FILES_MEM_LIMIT         2.0
#   daemons    2g                DAEMONS_MEM_LIMIT       2.0
#   mcp        1g                MCP_MEM_LIMIT           1.0
#   traefik    512m              —                       1.0
#   front      256m              —                       1.0
#
# El worker corre KENI_MAX_JOBS (def 6, antes 4) jobs `claude -p` EN PARALELO. Cada job
# ~1.5–2.5 GiB en pico => 6 × 2.5 + margen ≈ 18–20 GiB. Ver la nota junto al servicio
# `worker`. Suma de defaults ≈ 37.8 GiB sobre 61 GiB: deja ~23 GiB para host + CI +
# learn-postgres.
# Los `cpus` son TOPES (no reservas): si keni esta ocioso, el CI usa los 12 nucleos.
# ──────────────────────────────────────────────────────────────────────────────

services:
  traefik:
    # Tag FIJADO (antes `traefik:v3` movil): un tag flotante se actualiza solo en cada
    # `docker pull` del deploy, metiendo cambios de comportamiento sin querer. Fijamos la
    # version EXACTA que corre hoy (3.7.1) para builds reproducibles; subela a conciencia.
    # (v3 ya negocia la API con el daemon; el DOCKER_API_VERSION de abajo cubre Engine 29.)
    image: traefik:v3.7.1
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=keni-social_edge
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${KENI_ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # Provider de fichero: routers de los 3 sitios legados (learn/api/code) para
      # el cutover de Caddy -> Traefik. Inertes hasta que Traefik sea el ingress.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # Sin idle-timeout: imprescindible para streaming SSE (generacion token a
      # token de la Consola) y para el PTY/WebSocket del code-launcher.
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=0
      # - --api.dashboard=true   # opcional: protege con middleware antes de exponer
      # - --log.level=DEBUG
    # network_mode: host — herencia de cuando Traefik tambien servia los sitios
    # legacy del host (retirados 2026-06-12). Se mantiene: bind 80/443 directo y
    # alcanza a front/back por su IP de la red bridge keni-social_edge.
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    # Ingress liviano; topes conservadores (ver bloque de cabecera).
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  front:
    build:
      context: ..
      dockerfile: deploy/front/Dockerfile
    # Tag POR CONTENIDO (hash de las entradas de build): la fija deploy.sh (FRONT_VERSION/
    # BACK_VERSION/WORKER_VERSION/MCP_VERSION) para que `up -d` recree SOLO lo que cambió. En
    # un `docker compose` a pelo (sin deploy.sh) cae a :latest, como antes.
    image: keni-social/front:${FRONT_VERSION:-latest}
    restart: unless-stopped
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=keni-social_edge
      # Catch-all del host: el SPA. Prioridad BAJA para no tapar /api del back.
      - traefik.http.routers.front.rule=Host(`${KENI_HOST}`)
      - traefik.http.routers.front.priority=1
      - traefik.http.routers.front.entrypoints=websecure
      - traefik.http.routers.front.tls.certresolver=le
      # nginx no-root (nginxinc/nginx-unprivileged) escucha en 8080, no en 80.
      - traefik.http.services.front.loadbalancer.server.port=8080
      - traefik.http.routers.front.middlewares=keni-sec
      - autoheal=true  # vigilado por el sidecar autoheal
      # Cabeceras de seguridad para TODO social.kenitech.io (front Y back, ver router back):
      # HSTS (fuerza HTTPS en visitas siguientes), nosniff, X-Frame-Options: DENY (anti
      # clickjacking) y Referrer-Policy. Definido por labels para vivir junto al
      # servicio.
      - traefik.http.middlewares.keni-sec.headers.stsSeconds=31536000
      - traefik.http.middlewares.keni-sec.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.keni-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.keni-sec.headers.frameDeny=true
      - traefik.http.middlewares.keni-sec.headers.referrerPolicy=strict-origin-when-cross-origin
      # CSP REAL (no Report-Only), validada contra el SPA actual (consola/frontend):
      #   - script-src 'unsafe-inline': index.html lleva un <script> inline (tema oscuro
      #     anti-parpadeo) y el back puede inyectar window.__KENI_TOKEN__ en el index (modo
      #     local). Sigue bloqueando scripts EXTERNOS (ningun CDN de JS permitido).
      #   - style-src/font-src con fonts.googleapis.com / fonts.gstatic.com: el index carga
      #     Geist + las tipografias del editor de plantillas desde Google Fonts.
      #   - img/media con data:/blob:: previews del editor (createObjectURL) y media inline.
      #   - connect-src 'self': la API/SSE es mismo-origen (/api). frame-ancestors 'none'
      #     refuerza el frameDeny de arriba. Si el SPA suma un origen externo nuevo, hay que
      #     anadirlo AQUI a la vez.
      - "traefik.http.middlewares.keni-sec.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    # nginx estatico no-root: huella minima. 127.0.0.1 (no `localhost`): el busybox wget de
    # alpine intenta ::1 (IPv6) primero y nginx solo escucha IPv4 (ver front/Dockerfile).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  back:
    build:
      context: ..
      dockerfile: deploy/back/Dockerfile
    image: keni-social/back:${BACK_VERSION:-latest}
    restart: unless-stopped
    environment:
      XDG_CONFIG_HOME: /data
      KENI_DATA_DIR: /data
      # URL base PUBLICA de la consola: con ella el programador incluye las media URLs
      # (`/api/media/<objeto>`) en los posts que entrega a Metricool (sin ella, el post va
      # SOLO TEXTO y las redes que exigen media —Instagram/TikTok— ni se construyen). El GET
      # de objeto de media es publico (capability URL) para que Metricool pueda ingerirla.
      KENI_CONSOLA_URL_PUBLICA: https://social.kenitech.io
      # Store EDITABLE de ajustes (flags + tuning) cambiados desde la UI por el admin. En el
      # volumen COMPARTIDO (back, daemons, worker) para que un cambio en caliente lo vean
      # todos los procesos (precedencia store > env > defecto en config._crudo).
      KENI_CONSOLA_AJUSTES: /data/ajustes.toml
      # El back YA corre como usuario no-root (deploy/back/Dockerfile). El back no ejecuta
      # `claude` (solo encola), pero dejamos IS_SANDBOX=1 inocuo por si algun camino lo
      # consultara; el bypass de root de `claude` ya no aplica al ser no-root. Ver README.
      IS_SANDBOX: "1"
      # Modelo de imagen en OpenRouter. El SELECTOR de Ajustes lo elige (se guarda en el
      # almacen y MANDA sobre este env). Este env es solo un override de operador por .env;
      # VACIO por defecto => el defecto del codigo: openai/gpt-5-image-mini (economico y
      # SI genera personas; Nano Banana/Gemini es mas barato pero BLOQUEA personas).
      OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-}
      # Token interino OPCIONAL (#130): gate EXTRA. La barrera principal es el login
      # multiusuario (sesion) + CSRF; el back queda protegido aunque esto este vacio.
      KENI_CONSOLA_TOKEN_FILE: /run/secrets/consola_token
      # Host(s) externo(s) permitido(s) para el chequeo CSRF detras de Traefik. Igual a
      # KENI_HOST (social.kenitech.io): el `Origin` del SPA es el host publico, no el Host
      # interno que ve el back. Sin esto, las mutaciones del SPA tras el proxy darian 403.
      KENI_CONSOLA_ORIGENES: ${KENI_HOST}
      # Cookies Secure: vamos tras un proxy TLS (Traefik termina HTTPS).
      KENI_CONSOLA_HTTPS: "1"
      KENI_CONSOLA_ADMIN_USER: ${KENI_CONSOLA_ADMIN_USER}
      KENI_CONSOLA_ADMIN_PASS_FILE: /run/secrets/consola_admin_pass
      KENI_CONSOLA_SESION_HORAS: ${KENI_CONSOLA_SESION_HORAS}
      # MCP operativo (servidor MCP en `/mcp` del mismo back): bearer que exige el endpoint
      # a los clientes (Claude Code) e identidad con la que opera la API por dentro. Si
      # KENI_MCP_BEARER esta vacio, `/mcp` NO se monta (apagado por defecto). KENI_MCP_USUARIO
      # es opcional: vacio => cae al admin/dueño (KENI_CONSOLA_ADMIN_USER). Ver deploy/README.
      KENI_MCP_BEARER_FILE: /run/secrets/mcp_bearer
      KENI_MCP_USUARIO: ${KENI_MCP_USUARIO:-}
      # Gestion de la cuenta de Claude (panel admin -> Sistema): el back PROXEA al listener
      # de control del daemons (quien tiene `claude`) por la red interna. ACTIVO por defecto:
      # el bearer que comparten back y daemons se auto-persiste en /data (sin configurar nada).
      KENI_CONTROL_URL: http://daemons:8770
      # Listener de Ralph (sesiones `claude` persistentes): el back PROXEA (admin-gated) al
      # servicio worker-ralph por la red interna con el bearer compartido. URL fija al DNS del
      # servicio; el puerto debe coincidir con KENI_RALPH_PORT de worker-ralph (def 8771).
      KENI_RALPH_URL: ${KENI_RALPH_URL:-http://worker-ralph:8771}
      KENI_MAX_JOBS: ${KENI_MAX_JOBS}
      # El back solo ENCOLA (#130 Fase 2): NO arranca su worker in-proceso (lo hace el
      # servicio `worker`). La credencial de Claude la lleva el worker, no el back.
      KENI_WORKER_EXTERNO: "1"
      # Persistencia hosted (#130): el back consume Postgres si DATABASE_URL esta puesta y
      # S3/Garage si S3_* lo estan; vacias => SQLite + disco (perfil local). Cutover de datos
      # existentes: `python -m keni_consola.migracion` (ver deploy/README.md).
      # DATABASE_URL es OPCIONAL: si se deja en blanco, el back la DERIVA de POSTGRES_* (con
      # %-encoding) para que NO pueda desincronizarse de la password. Solo fijala para apuntar
      # a un Postgres externo o un DSN con parametros especiales.
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      # Agencias de noticias (item F): fuentes OPCIONALES del Radar/Fuentes. Sin credencial
      # quedan "pendientes" (no descargan, no rompen). Ver deploy/README.md.
      KENI_REUTERS_API_KEY: ${KENI_REUTERS_API_KEY:-}
      KENI_AFP_CLIENT_ID: ${KENI_AFP_CLIENT_ID:-}
      KENI_AFP_CLIENT_SECRET: ${KENI_AFP_CLIENT_SECRET:-}
      # Panel Sistema -> seccion Backups: directorio (SOLO LECTURA, ver volumes) donde el
      # keni-backup del host deja dumps + estado.json. Vacio/ausente => seccion degradada.
      KENI_BACKUPS_DIR: /backups
    volumes:
      # Estado de la app: consola.db (SQLite), secretos.toml (0600), media, tareas.
      - keni-data:/data
      # Backups del HOST en solo-lectura: el panel Sistema muestra el ultimo estado.json
      # y la antiguedad/tamano de los dumps sin poder tocarlos (observabilidad pura).
      - /var/backups/keni-social:/backups:ro
    # Secretos como ficheros en /run/secrets (no como env -> no salen en docker inspect).
    secrets:
      - postgres_password
      - s3_access_key
      - s3_secret_key
      - consola_token
      - consola_admin_pass
      - mcp_bearer
    networks:
      # `data` (internal) para alcanzar db/files; `internal`/`edge` conservan egress (NAT).
      - edge
      - internal
      - data
    # Arranque en frio ordenado: no levantar el back antes de que Postgres acepte
    # conexiones (si no, crash-loop al boot). `files` (S3/Garage) tambien sano: el
    # back consume S3_* al arrancar. `mcp` no expone condicion -> service_started.
    depends_on:
      db:
        condition: service_healthy
      files:
        condition: service_healthy
      mcp:
        condition: service_started
    # El HEALTHCHECK lo hereda del Dockerfile (curl :8765/healthz). No lo redefinimos.
    # RECURSOS: el back corre 2 workers uvicorn (ver back/Dockerfile CMD): sirve /api + /mcp +
    # SSE de larga vida, no genera (eso es el worker). 3.0 CPU = ~1.5 vCPU/worker de techo,
    # holgado para un proceso interactivo. mem 3g cubre 2 procesos que reimportan la app
    # (~300–500 MiB c/u en reposo + buffers de SSE); si subes a 2 workers algo pesado, sube
    # BACK_MEM_LIMIT. Son TOPES, no reservas (ver cabecera).
    mem_limit: ${BACK_MEM_LIMIT:-3g}
    cpus: 3.0
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - traefik.enable=true
      - traefik.docker.network=keni-social_edge
      # /api y /mcp van al gateway. Prioridad ALTA para ganar al catch-all del front. El
      # MCP operativo se sirve en /mcp del mismo back (sin imagen/servicio nuevos); su
      # barrera es el bearer KENI_MCP_BEARER (no la auth del SPA). Ver mcp_operativo.py.
      - traefik.http.routers.back.rule=Host(`${KENI_HOST}`) && (PathPrefix(`/api`) || PathPrefix(`/mcp`))
      - traefik.http.routers.back.priority=10
      - traefik.http.routers.back.entrypoints=websecure
      - traefik.http.routers.back.tls.certresolver=le
      - traefik.http.services.back.loadbalancer.server.port=8765
      # RATE LIMITING (hardening): limites GENEROSOS pensados para no romper el uso normal
      # (la UI hace polling; una oficina entera puede salir por UNA sola IP NAT).
      #   keni-ratelimit: 50 req/s de media con rafagas de 100 POR IP de origen (criterio
      #     por defecto de Traefik: la IP remota). Periodo por defecto: 1s.
      #   keni-inflightreq: tope de 150 peticiones EN PROCESO hacia el back. OJO: el criterio
      #     por defecto de inFlightReq es requestHost => es un tope GLOBAL de concurrencia
      #     (las SSE abiertas cuentan); protege al unico proceso uvicorn de un pileup.
      - traefik.http.middlewares.keni-ratelimit.ratelimit.average=50
      - traefik.http.middlewares.keni-ratelimit.ratelimit.burst=100
      - traefik.http.middlewares.keni-inflightreq.inflightreq.amount=150
      - traefik.http.routers.back.middlewares=keni-sec,keni-ratelimit,keni-inflightreq  # cabeceras + limites
      # TOPE DE BODY para SUBIDAS (videos de hasta ~300 MB): middleware buffering con techo
      # de 350 MB, aplicado SOLO al router de subidas (POST /api/media*). NO se aplica al
      # router general del back a proposito: buffering almacena la respuesta antes de
      # reenviarla y ROMPERIA el streaming SSE token a token de la generacion. El limite
      # fino por endpoint (JSON pequeno, etc.) lo aplica el propio backend.
      - traefik.http.middlewares.keni-buffer.buffering.maxRequestBodyBytes=367001600
      - traefik.http.routers.back-subidas.rule=Host(`${KENI_HOST}`) && PathPrefix(`/api/media`) && Method(`POST`)
      - traefik.http.routers.back-subidas.priority=20
      - traefik.http.routers.back-subidas.entrypoints=websecure
      - traefik.http.routers.back-subidas.tls.certresolver=le
      - traefik.http.routers.back-subidas.service=back
      - traefik.http.routers.back-subidas.middlewares=keni-sec,keni-ratelimit,keni-inflightreq,keni-buffer
      - autoheal=true  # el sidecar autoheal lo reinicia si /healthz queda unhealthy (cuelgue)

  daemons:
    # Proceso SOLO-daemons (Fase 3): el `back` corre uvicorn (que a proposito NO arranca
    # daemons, para no levantarlos en los tests) y el `worker` solo procesa la cola de jobs;
    # sin este servicio los hilos demonio de fondo NO correrian en prod. Corre
    # `python -m keni_consola.daemons`: refresco de metricas (cuenta + por pieza), alertas de
    # rendimiento/reciclaje, scanner de vencimientos, captura comercial, programador (DRY-RUN
    # salvo KENI_PUBLICAR_REAL), auto-promocion del Radar (solo con KENI_RADAR_AUTO) y la
    # MÁQUINA DE CONTENIDO (Flujo C): el pipeline (KENI_PIPELINE_REDACTAR) ingiere del news-pool y, en sus
    # etapas de Redactar e Ilustrar (KENI_PIPELINE_ILUSTRAR), lleva los temas a BORRADOR en la cola de revision.
    # NO publica ni aprueba contenido por su cuenta (la auto-produccion para en el gate humano); NO
    # publica puertos ni va por Traefik. Comparte Postgres + /data (donde viven las credenciales
    # Metricool y la clave del proveedor de imagen del auto-arte).
    #
    # IMAGEN DEL WORKER (no la del back): los pasos IA INLINE del pool de noticias —fusión
    # semántica de historias, encaje editorial, traducción— corren `claude -p` SÍNCRONO dentro
    # de ESTE proceso (dominio.fusion_semantica/traduccion), no por la cola. Con la imagen del
    # back (sin Node/claude) fallaban TODOS los barridos con "El asistente (claude) no está
    # disponible en el servidor" y la etapa de Fusionar nunca corría en hosted. La imagen del
    # worker trae claude + el entrypoint que carga el token desde /run/secrets.
    build:
      context: ..
      dockerfile: deploy/worker/Dockerfile
    # Misma tag por contenido WORKER_VERSION: un cambio en `consola/` recrea worker Y daemons.
    image: keni-social/worker:${WORKER_VERSION:-latest}
    restart: unless-stopped
    command: ["python", "-m", "keni_consola.daemons"]
    # El daemons NO levanta uvicorn (corre solo los hilos de fondo), pero comparte imagen
    # con el back, cuyo Dockerfile define un HEALTHCHECK `curl :8765/healthz`. Heredado aqui
    # daria SIEMPRE "unhealthy" (no hay servidor en 8765). En su lugar sondeamos el FICHERO
    # DE LATIDO que el bucle principal de `keni_consola.daemons` toca cada ~30s
    # (`latidos.tocar_fichero`): si lleva >120s sin tocarse, el proceso esta colgado/atascado
    # (no muerto: ese caso ya lo cubre `restart: unless-stopped`) y autoheal lo reinicia.
    # Sin dependencia de la BD: un Postgres caido NO marca unhealthy a los daemons.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          python -c "import os,sys,time;
          f=os.environ.get('KENI_DAEMONS_LATIDO_FICHERO','/tmp/keni-daemons.latido');
          sys.exit(0 if os.path.exists(f) and time.time()-os.path.getmtime(f)<120 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - autoheal=true  # con healthcheck real, el sidecar ya puede vigilarlo
    environment:
      XDG_CONFIG_HOME: /data
      KENI_DATA_DIR: /data
      # URL base PUBLICA de la consola: con ella el programador incluye las media URLs
      # (`/api/media/<objeto>`) en los posts que entrega a Metricool (sin ella, el post va
      # SOLO TEXTO y las redes que exigen media —Instagram/TikTok— ni se construyen). El GET
      # de objeto de media es publico (capability URL) para que Metricool pueda ingerirla.
      KENI_CONSOLA_URL_PUBLICA: https://social.kenitech.io
      IS_SANDBOX: "1"
      # API key OPCIONAL para los pasos IA INLINE del pool (fusión/encaje/traducción): vacía
      # por defecto; el entrypoint de la imagen la exporta si está. La cuenta de Claude la fija
      # el login del panel (credenciales en /data, ver abajo), no esta key.
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      # Config/credenciales de `claude` en el volumen COMPARTIDO /data (ADR 0013): la cuenta se
      # fija con `claude auth login` desde el panel (lo corre el daemons) y vive aquí, así que
      # worker+daemons la usan y un cambio de cuenta aplica EN CALIENTE, sin reiniciar.
      CLAUDE_CONFIG_DIR: /data/claude-cfg
      # Listener de CONTROL (gestion de la cuenta de Claude): el daemons (instancia unica) lo
      # levanta SIEMPRE; el bearer que comparte con el back se auto-persiste en /data.
      # Store EDITABLE de ajustes compartido con back/worker (mismo volumen keni-data): los
      # daemons leen aqui los flags/tuning cambiados en caliente (store > env > defecto).
      KENI_CONSOLA_AJUSTES: /data/ajustes.toml
      # No arranca worker in-proceso (lo hace el servicio `worker`); inocuo aqui igualmente.
      KENI_WORKER_EXTERNO: "1"
      # Persistencia compartida con el back: Postgres + S3/Garage. Las credenciales de
      # Metricool por marca viven en la persistencia (/data + DB), no en estas env.
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      # Agencias de noticias (item F): tambien aqui, porque la auto-promocion del Radar
      # (radar_auto) lee las mismas fuentes. Sin credencial: pendientes, no rompen.
      KENI_REUTERS_API_KEY: ${KENI_REUTERS_API_KEY:-}
      KENI_AFP_CLIENT_ID: ${KENI_AFP_CLIENT_ID:-}
      KENI_AFP_CLIENT_SECRET: ${KENI_AFP_CLIENT_SECRET:-}
      # MÁQUINA DE CONTENIDO: APAGADA por defecto. Se enciende EN CALIENTE desde el panel admin
      # (avatar -> Configuración) o, si se prefiere fijar por entorno, descomentando los flags de
      # abajo. El maestro KENI_MAQUINA es el kill-switch global; cuelgan de él las 3 etapas:
      #   KENI_MAQUINA:       "1"   # interruptor general (sin él, NADA automático de contenido corre)
      #   KENI_PIPELINE_RECOLECTAR:       "1"   # «Crear noticias»: Recolectar + Agrupar + Traducir (siempre on)
      #   KENI_PIPELINE_REDACTAR:      "1"   # «Generar copy»: etapa de Redactar (único motor de copy)
      #   KENI_PIPELINE_ILUSTRAR:  "1"   # «Generar arte»: etapa de Ilustrar (temas con copy sin imagen)
      # GATES DE SEGURIDAD: ausentes por defecto. Sin estos, el sistema NO publica ni crea
      # contenido solo. Activar SOLO con decision explicita (ver deploy/README.md §Validacion):
      #   KENI_RADAR_AUTO:    "1"   # auto-promueve temas del Radar (def: solo bandeja revisable)
      #   KENI_PUBLICAR_REAL: "1"   # publica de verdad a Metricool (def: dry-run, no postea)
      # VALIDACION: encender el master + las 3 etapas con KENI_PUBLICAR_REAL OFF. Es seguro: todo
      # para en la cola de revision; nada sale a redes sin que el humano lo autorice. Los flags
      # también se encienden EN CALIENTE desde el store editable (/data/ajustes.toml), sin
      # reiniciar el contenedor (store > env > defecto).
      # ENRIQUECER LA NOTA: con esto, antes de Redactar, Recolectar DESCARGA el cuerpo del
      # artículo (no solo el snippet RSS) y, en clusters, agrega el texto de CADA fuente. Da a
      # `claude -p` material real para sintetizar (clave en notas multi-fuente). Implica egress
      # del daemon a los medios; OFF por defecto. Encender por env (descomentar) o en caliente:
      #   KENI_PIPELINE_FETCH_FUENTE: "1"   # ingerir el cuerpo del/los artículo(s) en la nota
    volumes:
      - keni-data:/data
    # Secretos como ficheros en /run/secrets (no como env -> no salen en docker inspect).
    secrets:
      - postgres_password
      - s3_access_key
      - s3_secret_key
      - anthropic_api_key
    networks:
      # `data` para alcanzar db/files; `internal` conserva egress (Metricool, noticias).
      - internal
      - data
    # Arranque ordenado: Postgres sano (lee la cola/estado) y Garage sano (el
    # auto-arte importa media a S3). Evita crash-loop en cold start.
    depends_on:
      db:
        condition: service_healthy
      files:
        condition: service_healthy
    mem_limit: ${DAEMONS_MEM_LIMIT:-2g}
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    # Worker de generacion (#130 Fase 2 / ADR 0002 Fase B): consume la cola (tabla `jobs`
    # del Postgres compartido) y corre `claude -p`. SI lleva Node + `claude` (la del back
    # ya no). NO publica puertos ni va por Traefik: solo habla con db/files por la red
    # interna. Reiniciar el back NO mata sus jobs (es otro contenedor). Escalable: subir
    # `--scale worker=N` reparte la cola sin doble-ejecutar (claim FOR UPDATE SKIP LOCKED).
    build:
      context: ..
      dockerfile: deploy/worker/Dockerfile
    image: keni-social/worker:${WORKER_VERSION:-latest}
    restart: unless-stopped
    labels:
      - autoheal=true  # autoheal lo reinicia si el worker queda unhealthy/colgado
    environment:
      XDG_CONFIG_HOME: /data
      KENI_DATA_DIR: /data
      # Store EDITABLE de ajustes compartido con back/daemons (mismo volumen keni-data): el
      # worker ve los flags/tuning cambiados en caliente (store > env > defecto).
      KENI_CONSOLA_AJUSTES: /data/ajustes.toml
      # El worker YA corre como usuario no-root (deploy/worker/Dockerfile). Fuera de root,
      # `claude` NO restringe --dangerously-skip-permissions (esa guarda es solo para uid 0),
      # asi que IS_SANDBOX deja de ser necesario; lo dejamos en "1" (inocuo) por compatibilidad.
      IS_SANDBOX: "1"
      OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-}
      # Concurrencia de `claude` por worker + topes de coste/tiempo (mismos nombres que antes).
      # El worker corre un POOL de KENI_MAX_JOBS hilos => hasta N jobs `claude` EN PARALELO
      # (antes el bucle era serial y solo corria 1 a la vez pese a este valor). Default 6
      # (subido de 4: los jobs son mayormente ESPERA de API y el worker tiene 6 cpus/20 GiB;
      # la cola con prioridad aprovecha el hueco extra). OJO: si el .env del operador fija
      # KENI_MAX_JOBS, ese valor MANDA sobre este fallback. El mem_limit/cpus de abajo estan
      # dimensionados para 6 jobs concurrentes.
      KENI_MAX_JOBS: ${KENI_MAX_JOBS:-6}
      # API key OPCIONAL para `claude -p` (el back no la necesita: no genera). Vacía por
      # defecto; el entrypoint la exporta si está. La CUENTA de Claude no se fija aquí: la fija
      # el login del panel (credenciales en /data, ver abajo).
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      # Config/credenciales de `claude` en el volumen COMPARTIDO /data (ADR 0013): el login
      # desde el panel (lo corre el daemons) escribe aquí y el worker lo usa sin reiniciar.
      CLAUDE_CONFIG_DIR: /data/claude-cfg
      # Cola compartida (Postgres) + media (S3/Garage): el worker LEE la cola de Postgres y
      # ESCRIBE el post-procesado (historial/borradores/media) en la misma persistencia.
      # DATABASE_URL es OPCIONAL: si se deja en blanco, el worker la DERIVA de POSTGRES_* (con
      # %-encoding) para que NO pueda desincronizarse de la password. Solo fijala para apuntar
      # a un Postgres externo o un DSN con parametros especiales.
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    volumes:
      # Mismo volumen de estado que el back: secretos.toml (clave de imagen), media en
      # disco si no hay S3, y el contenido editorial YAML que el post-procesado escribe.
      - keni-data:/data
    # Secretos como ficheros en /run/secrets (no como env -> no salen en docker inspect).
    secrets:
      - postgres_password
      - s3_access_key
      - s3_secret_key
      - anthropic_api_key
    networks:
      # `data` para alcanzar db/files; `internal` conserva egress (Anthropic, OpenRouter).
      - internal
      - data
    # Arranque ordenado: el worker LEE la cola de Postgres y ESCRIBE media en S3/Garage,
    # ambos deben estar sanos antes de arrancar (evita crash-loop en cold start).
    depends_on:
      db:
        condition: service_healthy
      files:
        condition: service_healthy
    # El worker NO sirve HTTP (solo consume la cola): no hay endpoint que sondear. Como
    # heartbeat comprobamos que el bucle del worker (`keni_consola.worker`) sigue vivo
    # escaneando /proc con el python que ya trae la imagen (sin depender de procps/pgrep).
    # Si el bucle muere, el contenedor sale y `restart: unless-stopped` lo reinicia; este
    # healthcheck ademas lo marca `unhealthy` para visibilidad/monitorizacion.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          python -c "import os,glob,sys;
          sys.exit(0 if any('keni_consola.worker' in open(p).read().replace(chr(0),' ')
          for p in glob.glob('/proc/[0-9]*/cmdline')) else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # DIMENSIONADO PARA KENI_MAX_JOBS=6 CONCURRENTES (el worker corre N jobs `claude` EN
    # PARALELO, no de uno en uno). Cada `claude -p` (Node + uso de herramientas del modelo)
    # consume ~1.5–2.5 GiB en pico. Matematica: 6 × ~2.5 GiB ≈ 15 GiB + margen (post-
    # procesado, descarga de media S3, buffers de stream) ≈ 18–20 GiB. Si subes
    # KENI_MAX_JOBS, sube WORKER_MEM_LIMIT en proporcion (~3 GiB/job) y revisa la suma global
    # (cabecera de este fichero): a 20g el worker sigue dejando holgura sobre 61 GiB.
    # ESCALAR A worker=2: TODAVIA NO. Cuando haga falta mas throughput que KENI_MAX_JOBS=6,
    # el camino es `docker compose up -d --scale worker=2` (la cola reparte sin doble-
    # ejecutar: claim FOR UPDATE SKIP LOCKED), pero hay que re-presupuestar RAM antes
    # (2 workers × 20g no caben con holgura junto a db+CI en 61 GiB).
    # APAGADO LIMPIO: al recibir SIGTERM el pool del worker deja de reclamar, cancela los
    # `claude` en proceso y RE-ENCOLA cada job capturado (worker.py `_Pool.detener`, timeout
    # interno 10s). El default de Docker (10s a SIGKILL) cortaba ese cierre JUSTO al
    # limite; 30s le da margen real para devolver los jobs a `pendiente` sin perder nada.
    stop_grace_period: 30s
    mem_limit: ${WORKER_MEM_LIMIT:-20g}
    # CPU: 6 `claude` concurrentes quieren ~4–6 nucleos (cada uno empuja CPU al razonar/usar
    # tools; la mayor parte del tiempo es ESPERA de API). 6 da holgura para los picos sin
    # monopolizar la caja (12 vCPU). Es un TOPE, no reserva: si el worker esta ocioso, esos
    # nucleos quedan para el resto del stack/CI.
    cpus: ${WORKER_CPUS:-6}
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  worker-dev:
    # Worker de AUTO-DESARROLLO (carril `dev` de la cola). Gemelo del `worker` de contenido pero
    # corre `python -m keni_consola.worker_dev`: reclama SOLO los jobs cuyo `jobspec.carril == "dev"`
    # (el worker de contenido los EXCLUYE) y ejecuta `claude -p` SIN sandbox (Bash/Write/Edit
    # permitidos por diseño) sobre un CLON git del repo en /repo, donde crea worktrees+ramas y
    # promueve a `main` SOLO tras checkpoint humano. Misma imagen que el worker (trae Node+claude+
    # git+gh); NO publica puertos ni va por Traefik. La credencial gh viaja por /data/gh (volumen
    # compartido), conectada desde la UI; el clon /repo es un volumen persistente propio.
    build:
      context: ..
      dockerfile: deploy/worker/Dockerfile
    image: keni-social/worker:${WORKER_VERSION:-latest}
    restart: unless-stopped
    command: ["python", "-m", "keni_consola.worker_dev"]
    labels:
      - autoheal=true  # autoheal lo reinicia si el bucle queda unhealthy/colgado
    environment:
      XDG_CONFIG_HOME: /data
      KENI_DATA_DIR: /data
      KENI_CONSOLA_AJUSTES: /data/ajustes.toml
      IS_SANDBOX: "1"
      OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-}
      # Cupo de hilos del carril dev (jobs `claude -p` de desarrollo EN PARALELO). Def 2:
      # menos que el worker de contenido (cada job dev es pesado: clona/compila/testea).
      KENI_MAX_JOBS_DEV: ${KENI_MAX_JOBS_DEV:-2}
      # Clon git del repo sobre el que el motor crea worktrees y promueve a main.
      KENI_DEV_REPO: /repo
      # Identidad de los commits que crea el carril dev (lo hidrata el entrypoint con
      # `git config --global`). VACIAS por defecto: sin ellas git usa su default del contenedor.
      KENI_GIT_AUTHOR_NAME: ${KENI_GIT_AUTHOR_NAME:-}
      KENI_GIT_AUTHOR_EMAIL: ${KENI_GIT_AUTHOR_EMAIL:-}
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      # Config/credenciales de `claude` en el volumen COMPARTIDO /data (igual que el worker):
      # el login del panel escribe aquí y el carril dev lo usa sin reiniciar.
      CLAUDE_CONFIG_DIR: /data/claude-cfg
      # Cola compartida (Postgres) + media (S3/Garage), igual que el worker de contenido.
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    volumes:
      # Estado compartido con el back/worker (credenciales claude+gh, ajustes) + el clon git.
      - keni-data:/data
      - keni-repo:/repo
    secrets:
      - postgres_password
      - s3_access_key
      - s3_secret_key
      - anthropic_api_key
    networks:
      # `data` para alcanzar db/files; `internal` conserva egress (Anthropic, GitHub push).
      - internal
      - data
    depends_on:
      db:
        condition: service_healthy
      files:
        condition: service_healthy
    # Mismo criterio que el worker: el bucle no sirve HTTP, así que sondeamos /proc para
    # comprobar que `keni_consola.worker_dev` sigue vivo (sin depender de procps/pgrep).
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          python -c "import os,glob,sys;
          sys.exit(0 if any('keni_consola.worker_dev' in open(p).read().replace(chr(0),' ')
          for p in glob.glob('/proc/[0-9]*/cmdline')) else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Apagado limpio: como el worker, deja de reclamar y re-encola lo capturado.
    stop_grace_period: 30s
    # Carril dev más liviano que el worker de contenido (def 2 jobs vs 6). Overridable por .env.
    mem_limit: ${WORKER_DEV_MEM_LIMIT:-8g}
    cpus: ${WORKER_DEV_CPUS:-3.0}
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  worker-ralph:
    # Listener de AGENTES RALPH (sesiones `claude` persistentes multi-turno). Corre
    # `python -m keni_consola.worker_ralph`: un Starlette mínimo en uvicorn (KENI_RALPH_PORT, def
    # 8771) en la red INTERNA docker — NUNCA por Traefik. El back lo PROXEA (admin-gated) con el
    # bearer compartido. Cada Ralph trabaja sobre su propio worktree+rama del clon /repo, SIN
    # sandbox. Misma imagen que el worker (Node+claude+git+gh); credencial gh por /data/gh.
    build:
      context: ..
      dockerfile: deploy/worker/Dockerfile
    image: keni-social/worker:${WORKER_VERSION:-latest}
    restart: unless-stopped
    command: ["python", "-m", "keni_consola.worker_ralph"]
    labels:
      - autoheal=true  # autoheal lo reinicia si el listener queda unhealthy/colgado
    environment:
      XDG_CONFIG_HOME: /data
      KENI_DATA_DIR: /data
      KENI_CONSOLA_AJUSTES: /data/ajustes.toml
      IS_SANDBOX: "1"
      # Puerto del listener (interno). El back lo alcanza vía KENI_RALPH_URL (def :8771).
      KENI_RALPH_PORT: ${KENI_RALPH_PORT:-8771}
      # Tope de Ralphs vivos a la vez (pool de nombres estilo Nolan v1).
      KENI_MAX_RALPH: ${KENI_MAX_RALPH:-8}
      # Clon git compartido con worker-dev: cada Ralph crea ahí su worktree+rama.
      KENI_DEV_REPO: /repo
      # Identidad de los commits de los Ralph (lo hidrata el entrypoint con `git config --global`).
      KENI_GIT_AUTHOR_NAME: ${KENI_GIT_AUTHOR_NAME:-}
      KENI_GIT_AUTHOR_EMAIL: ${KENI_GIT_AUTHOR_EMAIL:-}
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      CLAUDE_CONFIG_DIR: /data/claude-cfg
    volumes:
      - keni-data:/data
      - keni-repo:/repo
    secrets:
      - anthropic_api_key
    networks:
      # `internal` basta: el back (también en `internal`) lo alcanza por DNS y conserva egress
      # (Anthropic, GitHub push). NO se publica el puerto al host ni se enruta por Traefik.
      - internal
    # Solo documental (Compose no publica `expose`): el listener escucha en KENI_RALPH_PORT y
    # es alcanzable SOLO dentro de la red interna docker.
    expose:
      - "${KENI_RALPH_PORT:-8771}"
    # El listener SÍ sirve HTTP: sondeamos su propia ruta /control/healthz (sin bearer) con el
    # python que ya trae la imagen (sin depender de curl/wget).
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          python -c "import os,urllib.request;
          urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('KENI_RALPH_PORT','8771')+'/control/healthz',timeout=3)"
          || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    mem_limit: ${WORKER_RALPH_MEM_LIMIT:-8g}
    cpus: ${WORKER_RALPH_CPUS:-3.0}
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  mcp:
    build:
      context: ..
      dockerfile: deploy/mcp/Dockerfile
    image: keni-social/mcp:${MCP_VERSION:-latest}
    restart: unless-stopped
    labels:
      - autoheal=true  # vigilado por el sidecar autoheal
    environment:
      KENI_MCP_TRANSPORT: http
      KENI_MCP_HOST: 0.0.0.0
      KENI_MCP_PORT: "8000"
      KENI_METRICAS_FUENTE: ${KENI_METRICAS_FUENTE}
      # KENI_METRICAS_CONFIG: /config/config.toml
    # volumes:
    #   - ./config:/config:ro   # monta aqui el config.toml real (fuente=real)
    networks:
      # `data` para alcanzar db/files (lectura de metricas); `internal` conserva egress.
      - internal
      - data
    # El endpoint /mcp (streamable-http) no responde 200 a un GET simple; comprobamos
    # que el puerto 8000 acepta conexiones con el python que ya trae la imagen (mismo
    # criterio que el HEALTHCHECK del Dockerfile, explicitado aqui).
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import socket; socket.create_connection(('127.0.0.1',8000),2)\" || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: ${MCP_MEM_LIMIT:-1g}
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # INTERNO por defecto: el endpoint /mcp NO lleva auth propia. Para exponerlo a
    # clientes Claude del equipo, añade un router Traefik con un middleware bearer/
    # basicauth y un subdominio (p.ej. mcp.kenitech.io). Ver README.

  db:
    # Tag FIJADO (antes `postgres:16` movil): evita que un `docker pull` del deploy salte
    # de version menor sin querer. 16.13 = la que corre hoy. Subir de minor a conciencia.
    image: postgres:16.13
    restart: unless-stopped
    # Tuning para el VPS real (61 GiB, db mem_limit 8g). La app abre MUCHAS conexiones
    # cortas (back + daemons + worker escalable); el techo por defecto (max_connections=100)
    # da "too many clients". Subimos a 200 y shared_buffers a ~25% del mem_limit (2GB). El
    # arreglo de fondo (pool de conexiones) sigue pendiente: con pool, 200 sobra. Si bajas
    # DB_MEM_LIMIT, baja shared_buffers en proporcion.
    # pg_stat_statements: telemetria de queries (top por tiempo total/medio) para diagnosticar
    # latencia en prod. Va en shared_preload_libraries (solo se carga al arranque); ademas hay
    # que crear la extension una vez (CREATE EXTENSION pg_stat_statements). track=top mide las
    # sentencias de nivel superior (no las anidadas en funciones), suficiente y mas barato.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=2GB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=top
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
      # Password del rol de aplicacion de MINIMO PRIVILEGIO `keni_app` (lo consume el
      # init script `postgres/initdb/10-app-role.sh` en el PRIMER arranque). El back
      # conecta como keni_app via DATABASE_URL, no como el superuser bootstrap.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea `keni_app` SOLO al inicializar un cluster vacio (postgres ejecuta initdb.d
      # una unica vez). En un volumen ya poblado no corre. Ver el script para detalles.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    # Secreto como fichero en /run/secrets: la imagen oficial de Postgres lee la password
    # del fichero via POSTGRES_PASSWORD_FILE (no como env -> no sale en docker inspect).
    secrets:
      - postgres_password
    networks:
      # SOLO `data` (internal): Postgres no necesita egress a internet. Sus consumidores
      # (back/daemons/worker) comparten esta red, asi que el DNS `db` sigue resolviendo.
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
    # Postgres es el corazon del stack: le reservamos holgura de RAM y NO le ponemos tope
    # de CPU (no queremos throttlearlo). El mem_limit es un suelo defensivo para que un pico
    # de otro servicio no lo OOM-mate; subelo si el VPS tiene RAM de sobra.
    mem_limit: ${DB_MEM_LIMIT:-8g}
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Sin `ports`: NO se publica 5432 al host (evita choque con learn-postgres y
    # no se expone a la red). Solo el back lo alcanza por la red interna.

  files:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    labels:
      - autoheal=true  # vigilado por el sidecar autoheal
    environment:
      # Secretos como FICHEROS (no env plano -> no salen en `docker inspect`): Garage
      # v1.0.x soporta GARAGE_RPC_SECRET_FILE / GARAGE_ADMIN_TOKEN_FILE (desde v0.8.5/
      # v0.9.1). deploy.sh los renderiza a ./secrets/ con 0400 root:root (Garage corre
      # como root en la imagen oficial y RECHAZA ficheros de secreto world-readable).
      GARAGE_RPC_SECRET_FILE: /run/secrets/garage_rpc_secret
      GARAGE_ADMIN_TOKEN_FILE: /run/secrets/garage_admin_token
    secrets:
      - garage_rpc_secret
      - garage_admin_token
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks:
      # SOLO `data` (internal): Garage no necesita egress a internet. Sus consumidores
      # (back/daemons/worker) comparten esta red, asi que el DNS `files` sigue resolviendo.
      - data
    # La imagen de Garage es minima (sin shell, ni curl/wget, ni python): no podemos usar
    # CMD-SHELL. Usamos su PROPIO binario `/garage status` (forma exec, sin shell), que se
    # conecta por RPC al daemon local leyendo /etc/garage.toml y sale !=0 si el nodo no
    # responde. start_period holgado por el arranque del motor LMDB.
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: ${FILES_MEM_LIMIT:-3g}
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Bootstrap de una vez (layout + bucket + clave): ver README. Sin `ports`:
    # interno; el back habla S3 por http://files:3900.

  # AUTO-HEALING: vigila los contenedores keni-social con healthcheck + label `autoheal=true`
  # y REINICIA los que pasen a `unhealthy`. Compose por si solo NO reinicia un contenedor
  # vivo-pero-COLGADO (solo si el proceso SALE); este sidecar cierra ese hueco (p.ej. un back
  # con el pool agotado, o un worker atascado, que dejan de responder al healthcheck sin morir).
  # Acotado por LABEL para NO tocar otros stacks del mismo host (CI Woodpecker, learn-postgres).
  # Excluidos a proposito: `db` (reiniciar Postgres ante un falso-negativo es disruptivo) y
  # `traefik` (ingress host-network). Es complemento de `restart: unless-stopped` (que cubre el
  # caso de proceso muerto), no su sustituto.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal   # solo contenedores con label autoheal=true
      AUTOHEAL_INTERVAL: "15"              # cada 15s revisa el estado de salud
      AUTOHEAL_START_PERIOD: "60"          # gracia inicial antes de actuar
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "20"  # SIGTERM->SIGKILL: deja al worker apagar limpio
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 64m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  # NOTA SUBREDES (auditoria 2026-06): en el server real `edge` = 172.19.0.0/16 e
  # `internal` = 172.18.0.0/16, ambas DENTRO de 172.16.0.0/12 (el pool por defecto de
  # Docker), que es lo que asume `--forwarded-allow-ips=172.16.0.0/12` del back. NO se
  # fija la subred con `ipam` a proposito: probado en el server, docker compose detecta
  # el cambio de config y RECREA la red (parando los contenedores enganchados), y a
  # `edge` esta enganchado tambien el woodpecker-server del stack keni-ci (red externa
  # para el), asi que el deploy fallaria/cortaria el CI. Si algun dia hace falta fijarla:
  # ventana de mantenimiento con AMBOS stacks abajo, ipam con subnet 172.19.0.0/16 (la
  # actual) y arrancar keni-social antes que keni-ci. Mientras tanto, NO cambies el pool
  # por defecto del daemon (default-address-pools) fuera de 172.16.0.0/12.
  edge:
  internal:
  # Red de DATOS interna (sin egress a internet): db (Postgres) y files (Garage) viven
  # SOLO aqui, de modo que no pueden salir a internet. Sus consumidores (back/daemons/
  # worker/mcp) la comparten ademas de `internal`/`edge`, asi que mantienen el DNS de
  # db/files Y conservan egress (Anthropic/OpenRouter/Metricool/noticias) por las otras.
  data:
    internal: true

volumes:
  traefik-acme:
  keni-data:
  # Clon git PERSISTENTE del repo para el carril de auto-desarrollo (worker-dev + worker-ralph):
  # en /repo crean worktrees+ramas y promueven a main tras checkpoint humano. Se siembra una vez
  # (clone si está vacío); ver deploy.sh. uid 10001 (keni) debe poder escribirlo (chown en deploy.sh).
  keni-repo:
  pgdata:
  garage-meta:
  garage-data:

# SECRETOS basados en FICHERO (no en env -> no salen en `docker inspect`). `deploy.sh` los
# RENDERIZA desde el .env del operador a `./secrets/<nombre>` (0600) en cada deploy; Compose
# los monta en /run/secrets/<nombre> dentro de los servicios que los listan. El codigo los
# lee via las env `*_FILE` (config._leer_secreto_fichero). El operador sigue editando .env.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  s3_access_key:
    file: ./secrets/s3_access_key
  s3_secret_key:
    file: ./secrets/s3_secret_key
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  consola_admin_pass:
    file: ./secrets/consola_admin_pass
  consola_token:
    file: ./secrets/consola_token
  mcp_bearer:
    file: ./secrets/mcp_bearer
  garage_rpc_secret:
    file: ./secrets/garage_rpc_secret
  garage_admin_token:
    file: ./secrets/garage_admin_token
