# SPA de la Consola. nginx NO conoce /api: eso lo enruta Traefik al gateway ANTES
# de llegar aqui (router con PathPrefix(`/api`) y prioridad mayor). Este server
# solo sirve estaticos y hace el fallback del SPA a index.html.
server {
    # nginx NO-ROOT (nginxinc/nginx-unprivileged): puerto >=1024, sin privilegios para bind.
    # Traefik enruta a este 8080 (loadbalancer.server.port en docker-compose.yml).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # COMPRESION: sin esto los bundles del SPA viajarian EN CRUDO (~1.5 MB de JS por
    # carga fria; medido: index-*.js 704 KB plano vs 212 KB gzip). Traefik no comprime
    # (sin middleware compress) y la imagen nginx-unprivileged trae gzip apagado.
    # Nivel 6 = equilibrio CPU/ratio; min_length evita comprimir respuestas diminutas.
    # `gzip_vary` para caches intermedios.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml
               text/plain application/manifest+json;

    # Assets con hash en el nombre: cache larga e inmutable.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api normalmente lo enruta Traefik al back (router con prioridad mayor) y NUNCA
    # llega aqui. PERO si el back esta caido/reiniciando (deploy, crash), Traefik tira
    # ese router y el /api cae a este front. Sin esta regla, un POST /api/auth/login
    # toparia con `try_files` (solo GET) y nginx responderia "405 Not Allowed" en HTML,
    # que el SPA mostraba crudo en el login. Devolvemos un 503 JSON limpio y reintentable.
    #
    # MENSAJE HONESTO: el back caido puede ser un DEPLOY (transitorio, vuelve solo) o una
    # AVERIA (no vuelve sin intervencion). deploy.sh crea ./estado/desplegando (montado aqui
    # en /estado:ro) mientras corre y lo borra al acabar; solo afirmamos "actualizando" si ese
    # flag existe. Sin el, decimos la verdad: caido y equipo avisado. El campo `motivo`
    # (deploy|incidente) deja que el SPA elija el panel correcto (barra de progreso vs aviso).
    location /api/ {
        default_type application/json;
        if (-f /estado/desplegando) {
            return 503 '{"motivo":"deploy","error":"Estamos actualizando la consola. Vuelve en unos segundos."}';
        }
        return 503 '{"motivo":"incidente","error":"La consola no esta disponible ahora mismo. El equipo ya ha sido avisado y esta trabajando en ello."}';
    }

    # DEGRADACION HONESTA del back PRESENTE-pero-no-listo. Cuando el router `back` SI esta
    # y Traefik recibe del upstream un 502/503/504 (desplegando, reiniciando, cuelgue), su
    # middleware `errors` (ver labels del back en docker-compose) pide ESTA pagina al `front`
    # y sirve su cuerpo en lugar del error crudo del proxy. Misma voz que el fallback de /api
    # de arriba, y el mismo flag distingue deploy de averia. Traefik fija el codigo del cliente
    # (503 via statusRewrites), no el de aqui; devolvemos 503 por coherencia. `no-store`: nunca
    # cachear un estado transitorio.
    location = /_errores/consola-no-disponible {
        default_type application/json;
        add_header Cache-Control "no-store";
        if (-f /estado/desplegando) {
            return 503 '{"motivo":"deploy","error":"Estamos actualizando la consola. Vuelve en unos segundos."}';
        }
        return 503 '{"motivo":"incidente","error":"La consola no esta disponible ahora mismo. El equipo ya ha sido avisado y esta trabajando en ello."}';
    }

    # SONDA de "¿hay deploy en curso?" SIEMPRE disponible (no pasa por el back). El flag llega al
    # SPA por el cuerpo del 503 de /api, pero ante un RESET de conexión (back reiniciando) el `me`
    # falla SIN cuerpo y el SPA no sabría si es deploy o avería. Esta sonda lo resuelve: el SPA la
    # consulta al caer y decide "actualizando" (deploy) vs "no disponible" (incidente). La sirve el
    # front; si el front se está recreando, la sirve `mantenimiento` (mismo endpoint, catch-all).
    # 200 siempre (es una consulta de estado, no un error); `no-store` (estado transitorio).
    location = /estado-deploy {
        default_type application/json;
        add_header Cache-Control "no-store";
        if (-f /estado/desplegando) {
            return 200 '{"desplegando":true}';
        }
        return 200 '{"desplegando":false}';
    }

    # Manifiesto de versión del build (lo escribe vite). El detector de actualizaciones
    # del SPA lo consulta para recargar solo tras un deploy: NUNCA se cachea, y 404 (no el
    # fallback a index.html) si no existe, para que el cliente caiga a su método alterno.
    location = /version.json {
        try_files $uri =404;
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # Fallback SPA: cualquier ruta de cliente devuelve index.html.
    location / {
        try_files $uri /index.html;
    }

    # index.html nunca se cachea (para que un deploy nuevo se vea al instante).
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
