// Auto-reboot tras parches de seguridad desatendidos (unattended-upgrades).
// Se instala en /etc/apt/apt.conf.d/52-keni-auto-reboot.conf.
//
// Por que: el kernel se parchea solo (unattended-upgrades activo), pero con
// Automatic-Reboot OFF (defecto) los CVE de kernel quedan DESCARGADOS pero NO
// activos hasta un reinicio manual. La caja ya demostro que el stack vuelve solo
// tras un reboot (live-restore + restart: unless-stopped). Reiniciamos en ventana
// de bajo trafico (04:00 UTC).
//
// WithUsers "true": reinicia aunque haya una sesion SSH abierta (si no, una sesion
// olvidada bloquearia el reboot indefinidamente).
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "04:00";
