# Endurecimiento SSH de keni-social. Drop-in: se instala en /etc/ssh/sshd_config.d/.
# VALIDA SIEMPRE con `sudo sshd -t` antes de `sudo systemctl reload ssh`, y comprueba
# una conexion NUEVA en otra terminal ANTES de cerrar la actual (evita autobloqueo).
#
# La base (99-learn-platform.conf) ya pone PasswordAuthentication/PermitRootLogin no,
# MaxAuthTries 3, etc. Esto ANADE lo que faltaba (alphabetico: 99-keni carga antes que
# 99-learn, y en sshd gana el PRIMER valor; los valores nuevos de aqui no colisionan).

# Solo el usuario de operacion entra por SSH (defensa si algun paquete crea otra cuenta).
AllowUsers ubuntu

# Rechaza claves RSA debiles (<3072 bits). La clave de operacion es ed25519 (no afectada).
RequiredRSASize 3072

# Cripto moderna: fuera DH group14 (2048-bit) y MACs SHA-1/UMAC-64 no-ETM. La sesion de
# operacion negocia curve25519 + chacha20/aes-gcm + *-etm, todos presentes aqui.
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

# Reduce movimiento lateral si una sesion se secuestra.
AllowAgentForwarding no
AllowStreamLocalForwarding no

# Registra la huella de la clave en cada conexion (forense).
LogLevel VERBOSE
