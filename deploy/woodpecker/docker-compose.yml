# Woodpecker CI para keni-social — stack SEPARADO en el server Latitude.
#
# Por que aqui y no en devops-infra (Ansible): los servers DevOps estan
# deprovisionados, asi que este stack vive junto a keni-social y REUSA su Traefik
# como ingress/TLS. Convenciones tomadas del rol Ansible de DevOps
# (kenidevops/devops-infra/ansible/roles/woodpecker): mismas imagenes v3, mismo
# layout de env, secreto compartido server<->agent, secretos via .env gitignored.
#
# INGRESS: no publica puertos. El server se cuelga de la red `keni-social_edge`
# (externa, creada por deploy/docker-compose.yml) y el Traefik host-mode existente
# lo enruta por labels + TLS Let's Encrypt (resolver `le`, igual que front/back).
#
# Proyecto compose separado (`keni-ci`): no interfiere con el proyecto
# `keni-social`. Arranque:  cd deploy/woodpecker && docker compose up -d
# (rellena .env desde .env.example primero; .env NUNCA va a git).

name: keni-ci

services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:${WOODPECKER_VERSION:-v3.13.0}
    container_name: woodpecker-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - woodpecker_data:/var/lib/woodpecker
    environment:
      WOODPECKER_HOST: "https://${WOODPECKER_HOSTNAME}"
      WOODPECKER_OPEN: "false"
      WOODPECKER_ADMIN: "${WOODPECKER_ADMIN}"
      WOODPECKER_GITHUB: "true"
      WOODPECKER_GITHUB_CLIENT: "${WOODPECKER_GITHUB_CLIENT}"
      WOODPECKER_GITHUB_SECRET: "${WOODPECKER_GITHUB_SECRET}"
      WOODPECKER_AGENT_SECRET: "${WOODPECKER_AGENT_SECRET}"
      WOODPECKER_LOG_LEVEL: "info"
    networks:
      - woodpecker
      - edge
    # Limite REAL de RAM: `deploy.resources` se IGNORA en Compose fuera de Swarm; lo que
    # aplica en este host single-VPS es `mem_limit` top-level (igual que en el stack
    # principal). Cambio de FICHERO solamente: se aplica a mano en la siguiente ventana
    # (NO recrear los servicios Woodpecker con pipelines en vuelo).
    mem_limit: 512m
    # Sin healthcheck: la imagen es scratch (sin shell/wget/curl).
    labels:
      - traefik.enable=true
      - traefik.docker.network=keni-social_edge
      - "traefik.http.routers.woodpecker.rule=Host(`${WOODPECKER_HOSTNAME}`)"
      - traefik.http.routers.woodpecker.entrypoints=websecure
      - traefik.http.routers.woodpecker.tls.certresolver=le
      - traefik.http.services.woodpecker.loadbalancer.server.port=8000

  # Proxy de la API Docker (tecnativa): unico con acceso al socket crudo. Expone una
  # API FILTRADA al agente (solo lo que el backend docker de Woodpecker necesita) y
  # DENIEGA por defecto lo peligroso (swarm/secrets/configs/services/nodes/plugins/
  # system/exec). En su PROPIA red `proxy` (interna), que los contenedores de step NO
  # ven: solo el agente la alcanza. Sustituye al montaje directo de /var/run/docker.sock.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: woodpecker-docker-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    privileged: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      POST: "1"
      INFO: "1"
      VERSION: "1"
    networks:
      - proxy
    # mem_limit top-level: ver nota en woodpecker-server (deploy.resources se ignora sin Swarm).
    mem_limit: 64m

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:${WOODPECKER_VERSION:-v3.13.0}
    container_name: woodpecker-agent
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - woodpecker-server
      - docker-socket-proxy
    volumes:
      - woodpecker_agent_data:/var/lib/woodpecker
    environment:
      WOODPECKER_SERVER: "woodpecker-server:9000"
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
      WOODPECKER_AGENT_SECRET: "${WOODPECKER_AGENT_SECRET}"
      WOODPECKER_MAX_WORKFLOWS: "${WOODPECKER_MAX_WORKFLOWS:-3}"
      # Red donde el agente engancha los contenedores de cada step del pipeline.
      WOODPECKER_BACKEND_DOCKER_NETWORK: "keni-ci_woodpecker"
      WOODPECKER_LOG_LEVEL: "info"
    networks:
      - woodpecker
      - proxy
    # mem_limit top-level: ver nota en woodpecker-server (deploy.resources se ignora sin Swarm).
    mem_limit: 4g

volumes:
  # `external: true`: volumenes gestionados FUERA de compose (no los crea/borra). Silencia el
  # warning "already exists but was not created by Docker Compose" y protege los datos de CI de
  # un `docker compose down -v` accidental. En un host NUEVO, pre-crearlos una vez:
  #   docker volume create woodpecker_data && docker volume create woodpecker_agent_data
  woodpecker_data:
    name: woodpecker_data
    external: true
  woodpecker_agent_data:
    name: woodpecker_agent_data
    external: true

networks:
  # Red dedicada agente<->proxy. `internal`: sin salida externa; los contenedores de
  # step (en `woodpecker`) no la ven, asi no pueden hablar con la API Docker.
  proxy:
    name: keni-ci_proxy
    internal: true
  # Red interna del stack de CI (server <-> agent <-> steps). Nombre explicito
  # para que coincida con WOODPECKER_BACKEND_DOCKER_NETWORK.
  woodpecker:
    name: keni-ci_woodpecker
  # Red del stack principal: Traefik (host-mode) enruta al server por aqui.
  edge:
    name: keni-social_edge
    external: true
