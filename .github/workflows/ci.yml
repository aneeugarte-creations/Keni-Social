name: CI

on:
  push:
  pull_request:

jobs:
  mcp-metricas:
    # Matriz multi-SO: ubuntu cubre el grueso y macos ejercita el lanzador macOS
    # y la consola (Starlette/uvicorn) en su SO real.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp-metricas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest

  keni-consola:
    # La consola es ahora su propio paquete (keni-consola) que DEPENDE de
    # keni-metricas. Matriz multi-SO: macos ejercita el lanzador macOS y la pila
    # ASGI (Starlette/uvicorn) en su SO real.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar keni-metricas (dependencia de la consola)
        run: pip install -e ./mcp-metricas
      - name: Instalar keni-consola con dev
        run: pip install -e "./consola[dev]"
      - name: Lint (ruff)
        working-directory: consola
        run: ruff check .
      - name: Tests (pytest)
        working-directory: consola
        run: pytest

  keni-consola-frontend:
    # SPA React (Vite + TS) de la consola. El bundle compilado se versiona en
    # src/keni_consola/webapp/ (para instalar sin Node); aqui validamos que el
    # codigo FUENTE compila, tipa y pasa lint. SO-agnostico -> solo ubuntu.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consola/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: consola/frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Build (vite)
        run: npm run build

  skills-copy-estatico:
    # Solo los chequeos ESTATICOS de skills-copy (sin modelo, sin whisper, sin red).
    # El gate local con `claude -p` (skills-copy/evals/run.sh) NO corre en CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pytest
        run: pip install pytest
      - name: Chequeos estaticos (frontmatter, contexto-editorial, contar.py)
        working-directory: skills-copy/evals
        run: pytest -q test_static.py test_checks_copy.py
