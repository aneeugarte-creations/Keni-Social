# CI de keni-social (#136).
#
# DESACTIVADO (2026-05-27): la CI real corre en Woodpecker self-hosted
# (https://ci-social.kenitech.io, pipelines en `.woodpecker/`, espejo de este
# fichero). GitHub Actions seguia bloqueado por facturacion y producia checks
# rojos en cada push, asi que aqui el trigger es MANUAL (workflow_dispatch).
# Para reactivarlo, restaura `push:` y `pull_request:` en `on:`.
#
# Red de seguridad real que la documentacion ya prometia. Jobs:
#
#   1. cambios               — detecta QUÉ cambió (filtro de rutas) para el scoping.
#   2. fronteras             — CONTRATO anti-spaghetti (lint de fronteras + catálogo).
#   3. tests-python          — SUITE COMPLETA (keni-shared / keni-metricas / consola).
#   4. tests-app-{produccion,metricas,operacion,shell} — tests SCOPED por app.
#   5. skills-copy-estatico  — evals ESTATICOS de skills-copy (sin modelo ni red).
#   6. frontend-build        — compila el bundle de la SPA (npm ci && npm run build).
#
# TEST SCOPING (ADR 0005 §Test scoping · plan §1.5): como el lint de fronteras
# garantiza que las apps NO se importan entre sí, es seguro correr SOLO los tests de
# la app tocada + el contrato (`fronteras`) + keni-shared. Un cambio en keni-shared
# (o en la fontanería del gateway / el MCP) corre la SUITE COMPLETA (`tests-python`).
# El scoping se hace con un job `cambios` (dorny/paths-filter) + `if:` por job; el
# espejo en Woodpecker lo hace con `when: path:` por pipeline.
#
# Lo que NO corre aqui (a proposito): el gate LOCAL de copy de skills-copy/evals
# (run.sh -> assert_output.py), que necesita `claude -p` (consume modelo) y, para
# clip, whisper en local. Ese sigue siendo un gate de maquina, documentado en
# skills-copy/evals/README.md.

name: CI

on:
  workflow_dispatch:

# Cancela ejecuciones viejas de la misma rama cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 0) Detecta qué partes del monorepo cambiaron, para el test scoping por ruta.
  #    `base_comun` agrupa keni-shared + el MCP + la fontanería del gateway: si tocan,
  #    corre la SUITE COMPLETA (su contrato afecta a TODAS las apps).
  cambios:
    name: Detectar cambios (scoping)
    runs-on: ubuntu-latest
    outputs:
      base_comun: ${{ steps.filtro.outputs.base_comun }}
      backend: ${{ steps.filtro.outputs.backend }}
      produccion: ${{ steps.filtro.outputs.produccion }}
      metricas: ${{ steps.filtro.outputs.metricas }}
      operacion: ${{ steps.filtro.outputs.operacion }}
      shell: ${{ steps.filtro.outputs.shell }}
      frontend: ${{ steps.filtro.outputs.frontend }}
      skills_copy: ${{ steps.filtro.outputs.skills_copy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            base_comun:
              - 'keni-shared/**'
              - 'mcp-metricas/**'
              - 'consola/src/keni_consola/app.py'
              - 'consola/src/keni_consola/db.py'
              - 'consola/src/keni_consola/motor_db.py'
              - 'consola/src/keni_consola/repos.py'
              - 'consola/src/keni_consola/migracion.py'
              - 'consola/src/keni_consola/{cola,worker,observabilidad,seguridad,programador}.py'
              - 'consola/src/keni_consola/{marcas,redes,estados,rutas,ficheros,indice}.py'
              - 'consola/pyproject.toml'
              - 'consola/tests/conftest.py'
              - 'consola/tests/_postgres.py'
            backend:
              - 'consola/src/keni_consola/**'
              - 'consola/tests/**'
            produccion:
              - 'consola/src/keni_consola/api/agentes.py'
              - 'consola/src/keni_consola/api/generaciones.py'
              - 'consola/src/keni_consola/api/hashtags.py'
              - 'consola/src/keni_consola/api/plantillas.py'
              - 'consola/src/keni_consola/api/skills*.py'
              - 'consola/src/keni_consola/api/qa_editorial.py'
              - 'consola/src/keni_consola/api/verificaciones.py'
              - 'consola/src/keni_consola/api/reciclaje.py'
              - 'consola/src/keni_consola/api/rss.py'
              - 'consola/src/keni_consola/api/termometro.py'
              - 'consola/src/keni_consola/api/radar.py'
              - 'consola/src/keni_consola/dominio/{hashtags,qa_editorial,reciclaje,skills,extraccion_url}.py'
              - 'consola/src/keni_consola/apps/produccion.toml'
            metricas:
              - 'consola/src/keni_consola/api/metricas.py'
              - 'consola/src/keni_consola/api/comercial.py'
              - 'consola/src/keni_consola/api/reporte_deportes.py'
              - 'consola/src/keni_consola/comercial.py'
              - 'consola/src/keni_consola/apps/metricas.toml'
            operacion:
              - 'consola/src/keni_consola/api/publicaciones.py'
              - 'consola/src/keni_consola/api/aprobacion.py'
              - 'consola/src/keni_consola/api/franjas.py'
              - 'consola/src/keni_consola/api/rota.py'
              - 'consola/src/keni_consola/api/tareas.py'
              - 'consola/src/keni_consola/rota.py'
              - 'consola/src/keni_consola/dominio/{publicaciones,aprobacion}.py'
              - 'consola/src/keni_consola/apps/operacion.toml'
            shell:
              - 'consola/src/keni_consola/api/{auth,usuarios,config,estado,conexiones,limites,media,panel,sugerencias,carpetas,proyectos,catalogo}.py'
              - 'consola/src/keni_consola/apps/shell.toml'
            frontend:
              - 'consola/frontend/**'
              - 'consola/src/keni_consola/esquema_api/**'
            skills_copy:
              - 'skills-copy/**'
              - 'keni-shared/**'

  # 1) CONTRATO de fronteras (ADR 0002 Fase A · ADR 0005 §Seams). Barato (AST + TOML),
  #    sin BD ni red. Corre en cualquier cambio de backend: es el "+contrato" que
  #    acompaña a CADA app tocada (test scoping, artefacto 5 del plan).
  fronteras:
    name: Contrato de fronteras entre apps
    needs: cambios
    if: needs.cambios.outputs.backend == 'true' || needs.cambios.outputs.base_comun == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar paquetes editables
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './keni-shared[dev]' -e './mcp-metricas[dev]' -e './consola[dev]'
      - name: Lint de fronteras + contrato del catálogo
        run: python -m pytest consola/tests/test_fronteras.py consola/tests/test_catalogo.py -q

  # 2) SUITE COMPLETA. Corre cuando cambia la base común (keni-shared / MCP /
  #    fontanería del gateway). Postgres efímero para el backend HOSTED real (#130);
  #    sin él, los tests de Postgres se SALTAN (la suite SQLite/local sigue verde).
  tests-python:
    name: Tests Python (suite completa)
    needs: cambios
    if: needs.cambios.outputs.base_comun == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keni
          POSTGRES_PASSWORD: keni
          POSTGRES_DB: keni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keni -d keni_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      KENI_TEST_DATABASE_URL: postgresql://keni:keni@localhost:5432/keni_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar paquetes editables (orden de dependencia)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './keni-shared[dev]' -e './mcp-metricas[dev]' -e './consola[dev]'
      - name: pytest keni-shared
        run: python -m pytest keni-shared/tests -q
      - name: pytest keni-metricas
        run: python -m pytest mcp-metricas/tests -q
      - name: pytest keni-consola (incluye el lint de fronteras)
        run: python -m pytest consola/tests -q

  # 3) Tests SCOPED por app. Cada uno corre SOLO si cambió su app (y la base común
  #    NO, para no duplicar la suite completa). Incluyen keni-shared (base) + el
  #    contrato de fronteras + los tests de su app. Postgres efímero como arriba.
  tests-app-produccion:
    name: Tests app · Producción (scoped)
    needs: cambios
    if: needs.cambios.outputs.produccion == 'true' && needs.cambios.outputs.base_comun == 'false'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: keni, POSTGRES_PASSWORD: keni, POSTGRES_DB: keni_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keni -d keni_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      KENI_TEST_DATABASE_URL: postgresql://keni:keni@localhost:5432/keni_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e './keni-shared[dev]' -e './mcp-metricas[dev]' -e './consola[dev]'
      - name: keni-shared (base) + contrato + tests de A
        run: |
          python -m pytest keni-shared/tests -q
          python -m pytest consola/tests/test_fronteras.py consola/tests/test_catalogo.py -q
          python -m pytest -q \
            consola/tests/test_api_agentes.py \
            consola/tests/test_api_agentes_abiertos.py \
            consola/tests/test_api_agentes_runner.py \
            consola/tests/test_generaciones.py \
            consola/tests/test_api_hashtags.py \
            consola/tests/test_api_plantillas.py \
            consola/tests/test_skills_piezas.py \
            consola/tests/test_skills_url.py \
            consola/tests/test_skills_imagenes.py \
            consola/tests/test_skills_catalogo.py \
            consola/tests/test_api_qa_editorial.py \
            consola/tests/test_api_verificaciones.py \
            consola/tests/test_api_reciclaje.py \
            consola/tests/test_reciclaje_dominio.py \
            consola/tests/test_api_rss.py \
            consola/tests/test_api_termometro.py \
            consola/tests/test_api_radar.py \
            consola/tests/test_radar.py \
            consola/tests/test_metricas_runs.py

  tests-app-metricas:
    name: Tests app · Métricas (scoped)
    needs: cambios
    if: needs.cambios.outputs.metricas == 'true' && needs.cambios.outputs.base_comun == 'false'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: keni, POSTGRES_PASSWORD: keni, POSTGRES_DB: keni_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keni -d keni_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      KENI_TEST_DATABASE_URL: postgresql://keni:keni@localhost:5432/keni_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e './keni-shared[dev]' -e './mcp-metricas[dev]' -e './consola[dev]'
      - name: keni-shared (base) + contrato + tests de B
        run: |
          python -m pytest keni-shared/tests -q
          python -m pytest consola/tests/test_fronteras.py consola/tests/test_catalogo.py -q
          python -m pytest -q \
            consola/tests/test_api_metricas.py \
            consola/tests/test_api_comercial.py \
            consola/tests/test_comercial.py \
            consola/tests/test_reporte_deportes.py

  tests-app-operacion:
    name: Tests app · Operación (scoped)
    needs: cambios
    if: needs.cambios.outputs.operacion == 'true' && needs.cambios.outputs.base_comun == 'false'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: keni, POSTGRES_PASSWORD: keni, POSTGRES_DB: keni_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keni -d keni_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      KENI_TEST_DATABASE_URL: postgresql://keni:keni@localhost:5432/keni_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e './keni-shared[dev]' -e './mcp-metricas[dev]' -e './consola[dev]'
      - name: keni-shared (base) + contrato + tests de C
        run: |
          python -m pytest keni-shared/tests -q
          python -m pytest consola/tests/test_fronteras.py consola/tests/test_catalogo.py -q
          python -m pytest -q \
            consola/tests/test_api_publicaciones.py \
            consola/tests/test_api_publicaciones_contenido.py \
            consola/tests/test_api_aprobacion.py \
            consola/tests/test_aprobacion_dominio.py \
            consola/tests/test_api_franjas.py \
            consola/tests/test_api_rota.py \
            consola/tests/test_api_rota_ampliada.py \
            consola/tests/test_api_rota_franjas.py \
            consola/tests/test_api_rota_piezas.py \
            consola/tests/test_api_rota_programas.py \
            consola/tests/test_api_rota_swaps.py \
            consola/tests/test_rota.py \
            consola/tests/test_api_tareas_tablero.py \
            consola/tests/test_api_reciclar.py \
            consola/tests/test_db_piezas.py

  tests-shell:
    name: Tests · Shell (scoped)
    needs: cambios
    if: needs.cambios.outputs.shell == 'true' && needs.cambios.outputs.base_comun == 'false'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: keni, POSTGRES_PASSWORD: keni, POSTGRES_DB: keni_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keni -d keni_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      KENI_TEST_DATABASE_URL: postgresql://keni:keni@localhost:5432/keni_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e './keni-shared[dev]' -e './mcp-metricas[dev]' -e './consola[dev]'
      - name: keni-shared (base) + contrato + tests del shell
        run: |
          python -m pytest keni-shared/tests -q
          python -m pytest consola/tests/test_fronteras.py consola/tests/test_catalogo.py -q
          python -m pytest -q \
            consola/tests/test_auth.py \
            consola/tests/test_auth_hardening.py \
            consola/tests/test_api_config.py \
            consola/tests/test_config.py \
            consola/tests/test_api_estado.py \
            consola/tests/test_api_conexiones.py \
            consola/tests/test_api_conexiones_permisos.py \
            consola/tests/test_api_limites.py \
            consola/tests/test_api_media.py \
            consola/tests/test_almacen_media.py \
            consola/tests/test_api_panel.py \
            consola/tests/test_api_sugerencias.py \
            consola/tests/test_api_carpetas.py \
            consola/tests/test_api_proyectos.py \
            consola/tests/test_permisos.py \
            consola/tests/test_secretos.py \
            consola/tests/test_seguridad.py \
            consola/tests/test_app.py

  # 4) Evals ESTATICOS de skills-copy: estructura del repo, frontmatter de cada
  #    SKILL.md, limites de plataforma anclados a keni_shared y el motor de
  #    aserciones (checks.py). Python puro + PyYAML; sin modelo, sin whisper, sin red.
  skills-copy-estatico:
    name: Evals estaticos de skills-copy
    needs: cambios
    if: needs.cambios.outputs.skills_copy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias (pytest + PyYAML + keni-shared)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML
          python -m pip install -e ./keni-shared
      - name: pytest (capa estatica)
        working-directory: skills-copy/evals
        run: >-
          python -m pytest -q
          test_static.py
          test_checks_copy.py
          test_limites.py
          test_wave3_skills.py
          test_brief_junta.py

  # 5) Bundle del frontend: verifica que la SPA COMPILA. `npm run build` corre
  #    `tsc -b && vite build`, asi que falla el job tanto si el typecheck como si
  #    el build de Vite se rompen. El bundle compilado vive versionado en
  #    consola/src/keni_consola/webapp/; aqui solo comprobamos que sigue compilando.
  frontend-build:
    name: Build del frontend (Vite)
    needs: cambios
    if: needs.cambios.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: consola/frontend/package-lock.json
      - name: npm ci
        working-directory: consola/frontend
        run: npm ci
      - name: npm run build
        working-directory: consola/frontend
        run: npm run build
