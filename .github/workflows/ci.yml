# CI de keni-social (#136).
#
# DESACTIVADO (2026-05-27): la CI real corre en Woodpecker self-hosted
# (https://ci-social.kenitech.io, pipelines en `.woodpecker/`, espejo de este
# fichero). GitHub Actions seguia bloqueado por facturacion y producia checks
# rojos en cada push, asi que aqui el trigger es MANUAL (workflow_dispatch).
# Para reactivarlo, restaura `push:` y `pull_request:` en `on:`.
#
# Red de seguridad real que la documentacion ya prometia: corre en cada push y en
# cada pull_request, sobre todas las ramas. Tres jobs en paralelo:
#
#   1. tests-python        — pytest de keni-shared, keni-metricas y keni-consola.
#   2. skills-copy-estatico — evals ESTATICOS de skills-copy (sin modelo ni red).
#   3. frontend-build      — compila el bundle de la SPA (npm ci && npm run build).
#
# Lo que NO corre aqui (a proposito): el gate LOCAL de copy de skills-copy/evals
# (run.sh -> assert_output.py), que necesita `claude -p` (consume modelo) y, para
# clip, whisper en local. Ese sigue siendo un gate de maquina, documentado en
# skills-copy/evals/README.md.

name: CI

on:
  workflow_dispatch:

# Cancela ejecuciones viejas de la misma rama cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Tests de los tres paquetes Python del monorepo.
  #
  # keni-metricas depende de keni-shared, y keni-consola depende de ambos. Los
  # pyproject.toml los referencian por NOMBRE (no por ruta), asi que los
  # instalamos editables en orden de dependencia para que pip resuelva el grafo
  # local en vez de buscarlos en un indice. Las extras [dev] traen pytest y las
  # dependencias de test (respx, anyio, python-pptx para el render del deck).
  tests-python:
    name: Tests Python (keni-shared / keni-metricas / keni-consola)
    runs-on: ubuntu-latest
    # Postgres efimero para los tests del backend Postgres (#130). El service expone 5432;
    # los tests lo usan via KENI_TEST_DATABASE_URL. Si por lo que sea no estuviera, los
    # tests de Postgres se SALTAN (no fallan): la suite SQLite/local sigue verde igual.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keni
          POSTGRES_PASSWORD: keni
          POSTGRES_DB: keni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keni -d keni_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Apunta los tests de Postgres al service. Quita esta var (o el service) y los tests
      # de Postgres se saltan en vez de fallar — el resto de la suite no se entera.
      KENI_TEST_DATABASE_URL: postgresql://keni:keni@localhost:5432/keni_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar paquetes editables (orden de dependencia)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './keni-shared[dev]' -e './mcp-metricas[dev]' -e './consola[dev]'

      - name: pytest keni-shared
        run: python -m pytest keni-shared/tests -q

      - name: pytest keni-metricas
        run: python -m pytest mcp-metricas/tests -q

      # consola: incluye los tests del backend Postgres (KENI_TEST_DATABASE_URL apunta al
      # service) y los de S3 (moto, sin red). Sin el service, esos se saltarian.
      - name: pytest keni-consola
        run: python -m pytest consola/tests -q

  # 2) Evals ESTATICOS de skills-copy: estructura del repo, frontmatter de cada
  #    SKILL.md, limites de plataforma anclados a keni_shared y el motor de
  #    aserciones (checks.py). Python puro + PyYAML; sin modelo, sin whisper, sin
  #    red. Instalamos keni-shared para que test_limites use la FUENTE UNICA de
  #    limites (keni_shared.limites_plataforma) en vez de su respaldo.
  skills-copy-estatico:
    name: Evals estaticos de skills-copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (pytest + PyYAML + keni-shared)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML
          python -m pip install -e ./keni-shared

      - name: pytest (capa estatica)
        working-directory: skills-copy/evals
        run: >-
          python -m pytest -q
          test_static.py
          test_checks_copy.py
          test_limites.py
          test_wave3_skills.py
          test_brief_junta.py

  # 3) Bundle del frontend: verifica que la SPA COMPILA. `npm run build` corre
  #    `tsc -b && vite build`, asi que falla el job tanto si el typecheck como si
  #    el build de Vite se rompen. El bundle compilado vive versionado en
  #    consola/src/keni_consola/webapp/; aqui solo comprobamos que sigue
  #    compilando (no lo recommiteamos).
  frontend-build:
    name: Build del frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: consola/frontend/package-lock.json

      - name: npm ci
        working-directory: consola/frontend
        run: npm ci

      - name: npm run build
        working-directory: consola/frontend
        run: npm run build
