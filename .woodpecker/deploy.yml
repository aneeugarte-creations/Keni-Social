# Woodpecker: DESPLIEGUE de keni-social (build de imagenes + recreacion del stack).
#
# >>> AVISO: ESTE PIPELINE NO FUNCIONA HASTA COMPLETAR EL SETUP DE HOST. <<<
# Antes montaba el /var/run/docker.sock REAL (acceso root al daemon desde un step de CI).
# Ahora NO monta el sock ni volumenes: invoca un despliegue PRE-ACORDADO en el host por SSH
# contra el usuario sin privilegios `keni-deploy` (forced command + sudo a un wrapper que solo
# acepta una SHA validada y antecesora de origin/main). El step NO elige que se ejecuta: solo
# entrega la SHA. Mientras no se complete el runbook de host NINGUN deploy pasara —es DELIBERADO,
# falla cerrado. Pasos manuales de host (crear `keni-deploy`, authorized_keys con forced command,
# wrapper /usr/local/sbin/keni-deploy-run, sudoers, clon git read-only, secretos de Woodpecker):
#   deploy/host/HARDENING-RUNBOOK.md  (seccion F).
#
# AUTO-DEPLOY en push a `main`, DESPUES de que pasen los 3 pipelines de test (depends_on).
# Un push con tests en rojo NO despliega. Tambien disparable a mano ("manual"). NO
# despliega en PRs ni en otras ramas. El deploy real (build + up -d + healthchecks + rollback)
# lo sigue haciendo `deploy/deploy.sh` EN EL HOST, sin cambios: este pipeline solo cambia COMO
# se invoca (sock -> ssh), no la logica de despliegue.
#
# SECRETOS de Woodpecker (Repo Settings -> Secrets), ver runbook:
#   deploy_ssh_key      clave PRIVADA SSH del par cuyo publico esta en authorized_keys de keni-deploy.
#   deploy_known_hosts  linea(s) known_hosts con la host-key PUBLICA del destino (host-key FIJADA;
#                       StrictHostKeyChecking=yes, sin TOFU). El host es publico (ssh-keyscan), no secreto.
when:
  - event: push
    branch: main
  - event: manual

depends_on:
  - frontend-build
  - tests-python

steps:
  - name: build-and-deploy
    image: alpine:3.20
    # Alcanza el sshd del HOST desde el contenedor de step via la gateway del bridge Docker
    # (host-gateway). Evita salir por la IP publica (hairpin/fail2ban). El nombre
    # `host.docker.internal` es tambien la clave de la linea known_hosts (ver runbook).
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      SSH_KEY:
        from_secret: deploy_ssh_key
      KNOWN_HOSTS:
        from_secret: deploy_known_hosts
    commands:
      - apk add --no-cache openssh-client
      - install -d -m 700 ~/.ssh
      # Clave privada y host-key FIJADA a ficheros con permisos estrictos.
      - printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
      - printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      # El UNICO argumento es la SHA del commit: la forced command del host la valida
      # (^[0-9a-f]{40}$), exige que sea antecesora de origin/main y corre deploy.sh bajo flock.
      # StrictHostKeyChecking=yes: si la host-key no casa, ABORTA (sin TOFU).
      - >-
        ssh -i ~/.ssh/deploy_key
        -o UserKnownHostsFile=~/.ssh/known_hosts
        -o StrictHostKeyChecking=yes
        -o BatchMode=yes
        keni-deploy@host.docker.internal "$CI_COMMIT_SHA"
