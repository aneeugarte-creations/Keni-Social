# Woodpecker: DESPLIEGUE INDEPENDIENTE del guardián (guardian-ui + incident-keeper).
#
# El guardián es quien ARREGLA el CI rojo de `main`. Encadenar su despliegue al gate de la suite
# completa (`tests-python`, como hace deploy.yml) creaba un CÍRCULO absurdo: para publicar una
# mejora del guardián había que esperar a que el CI estuviera verde… que es justo lo que el
# guardián arregla. Este carril lo rompe: despliega el guardián SOLO, gateado por SUS PROPIOS tests
# (paso `test-guardian` aquí mismo), que la suite roja de la app nunca bloquea.
#
# POR QUÉ EL GATE VA COMO PASO, NO COMO `depends_on`: Woodpecker SALTA un workflow cuyo `depends_on`
# fue saltado. Si gateáramos con `depends_on: tests-guardian`, un commit que tocara solo este YAML
# (sin tocar código del guardián) NO dispararía `tests-guardian` -> su salto arrastraría a este
# deploy (justo lo que pasó con el pipeline #73). Metiendo los tests como PRIMER paso del MISMO
# workflow, el deploy gatea de verdad (si el paso de tests falla, el de deploy se salta) sin
# depender de otro workflow.
#
# POR QUÉ ES BARATO (sin build): ambos servicios corren la imagen del worker (ya construida; su tag
# `:latest` siempre existe en el host) pero montan su CÓDIGO por BIND-MOUNT del dir estable del host
# (`./guardian-ui`, `./incident-keeper`). Así, desplegar = sincronizar las fuentes al dir estable y
# RECREAR los dos contenedores (`--force-recreate` re-lee el bind-mount); no compila imágenes ni
# toca db/back/front (`--no-deps`). `WORKER_VERSION` no se pasa -> compose resuelve `worker:latest`.
#
# CUÁNDO DISPARA: push a `main` que toque SUS rutas (no en cada commit de la app -> no recrea el
# keeper, ni corta un fix en curso, por cambios ajenos) y manual.
when:
  - event: push
    branch: main
    path:
      include:
        - "deploy/guardian-ui/**"
        - "deploy/incident-keeper/**"
        - ".woodpecker/deploy-guardian.yml"
  - event: manual

steps:
  # Gate: los tests stdlib del guardián/keeper (sin Postgres). Si fallan, el paso de deploy se salta.
  - name: test-guardian
    image: python:3.11
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install pytest starlette  # app.py importa starlette; lo demás es stdlib
      - python -m pytest deploy/incident-keeper/test_sesion.py deploy/incident-keeper/test_ci_watch.py deploy/guardian-ui/test_app.py deploy/guardian-ui/test_cuenta.py -q

  - name: deploy-guardian
    # Mismo pin por DIGEST que deploy.yml: el step monta el docker.sock, así que su imagen es parte
    # de la TCB del deploy. Actualízalo en sincronía con deploy.yml (`docker manifest inspect docker:27-cli`).
    image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Dir estable del host al MISMO path (host==contenedor) para que los bind mounts del compose
      # resuelvan en el host. Aquí vive también el .env (no en git).
      - /home/ubuntu/keni-social:/home/ubuntu/keni-social
    commands:
      - apk add --no-cache docker-cli-compose rsync flock
      # rsync ACOTADO a los DOS dirs de código bind-montados (no el árbol entero): así NUNCA borra
      # estado host-only del dir estable —`deploy/secrets/*` (renderizados por deploy.sh), `.env`,
      # `estado/`—. El deploy general sí rsync-ea todo, pero re-renderiza los secrets acto seguido;
      # este carril NO corre deploy.sh, así que un `rsync --delete ./` del árbol entero los dejaría
      # sin renderizar y el `compose up` fallaría al montarlos. Ambos dirs solo tienen ficheros de
      # git, así que `--delete` dentro de ellos es seguro. Todo bajo el flock del dir estable
      # (serializa con el deploy general). El flag `estado/desplegando` evita que el `guardian`
      # resucitador pelee con la recreación; se borra SIEMPRE al salir vía trap, así no queda huérfano.
      # `docker tag worker:latest worker:keeper`: re-sella el tag DEDICADO al que apuntan estos dos
      # servicios (ver docker-compose.yml) con el worker recién construido. Es lo ÚNICO que mueve
      # `:keeper`, así que un deploy de la app (que mueve `:latest`/`:${VERSION}` pero no `:keeper`) ya
      # no los recrea a media sesión. La recreación de abajo los lleva al worker nuevo + código nuevo.
      - >-
        flock -x -w 1800 /home/ubuntu/keni-social/.deploy.lock sh -c "
        rsync -a --delete ./deploy/guardian-ui/ /home/ubuntu/keni-social/deploy/guardian-ui/
        && rsync -a --delete ./deploy/incident-keeper/ /home/ubuntu/keni-social/deploy/incident-keeper/
        && docker tag keni-social/worker:latest keni-social/worker:keeper
        && cd /home/ubuntu/keni-social/deploy
        && mkdir -p estado && chmod 0777 estado 2>/dev/null || true
        && : > estado/desplegando && trap 'rm -f estado/desplegando' EXIT
        && docker compose --env-file .env up -d --no-deps --force-recreate guardian-ui incident-keeper"
