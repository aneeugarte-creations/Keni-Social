# Woodpecker: SUITE COMPLETA de los paquetes Python del monorepo.
# Espejo del job `tests-python` de .github/workflows/ci.yml.
# keni-metricas y mcp-tablero dependen de keni-shared, y consola de keni-shared y
# keni-metricas; se instalan editables en orden de dependencia para que pip resuelva
# el grafo local.
#
# TEST SCOPING (ADR 0005): esta es la suite COMPLETA. Corre
# cuando cambia keni-shared (la base común: su contrato afecta a TODAS las apps), o el
# mcp de métricas, o la fontanería del gateway (app.py, db, repos, motor_db…), o en
# push a `main` y a mano. Los cambios acotados a
# UNA app NO la disparan: usan su pipeline scoped (`tests-app-*`) + el contrato
# (`fronteras`). Postgres efímero: ejercita el backend HOSTED real (no solo SQLite).
#
# GATEA EL DEPLOY (`deploy.yml depends_on: tests-python`): un rojo de esta suite NO despliega,
# así prod nunca sirve un bug de COMPORTAMIENTO que la suite atrapa (el deploy es all-or-nothing,
# blue-green al 100% del tráfico sin canary, así que el health-check `/healthz` no basta —solo
# ve "arranca", no "se comporta bien"—). Para que el gate NO domine la latencia prompt-a-prod, la
# suite se mantiene RÁPIDA subiendo el techo de CPU por step del agente (4 vCPU,
# WOODPECKER_BACKEND_DOCKER_LIMIT_CPU_QUOTA en deploy/woodpecker), no sacándola del camino crítico.
when:
  # Suite completa: base común / fontanería del gateway / MCP.
  - event: [push, pull_request]
    path:
      include:
        - "keni-shared/**"
        - "mcp-metricas/**"
        - "mcp-tablero/**"
        - "consola/src/keni_consola/{app,db,motor_db,repos,migracion,cola,worker,observabilidad,seguridad,programador,marcas,redes,estados,rutas,ficheros,indice}.py"
        - "consola/pyproject.toml"
        - "consola/tests/conftest.py"
        - "consola/tests/_postgres.py"
        - ".woodpecker/tests-python.yml"
  # En push a `main` SIEMPRE: verificación pesada en PARALELO al deploy (ya no lo gatea)…
  - event: push
    branch: main
    # …SALVO un cambio SOLO del guardián (guardian-ui/incident-keeper/sus pipelines): tiene su carril
    # propio (deploy-guardian.yml) y no necesita la suite de la app. Sin este exclude, esta rama
    # "main sin filtro" arrastraba el pesado tests-python en cada commit del guardián. Un commit MIXTO
    # (app + guardián) SÍ corre: basta UN fichero fuera del exclude para disparar.
    path:
      exclude:
        - "deploy/guardian-ui/**"
        - "deploy/incident-keeper/**"
        - ".woodpecker/deploy-guardian.yml"
        - ".woodpecker/tests-guardian.yml"
  - event: manual

services:
  - name: postgres
    image: postgres:16
    # Postgres efímero de tests: la BD se descarta al terminar, así que sin durabilidad.
    # fsync/synchronous_commit/full_page_writes off elimina la tormenta de fsync; el page
    # cache del host (RAM de sobra) absorbe las escrituras a velocidad de memoria.
    entrypoint: [docker-entrypoint.sh, postgres, -c, fsync=off, -c, synchronous_commit=off, -c, full_page_writes=off]
    environment:
      POSTGRES_USER: keni
      POSTGRES_PASSWORD: keni
      POSTGRES_DB: keni_test

steps:
  - name: pytest
    image: python:3.11
    environment:
      # Apunta los tests de Postgres al servicio (hostname = nombre del servicio). Quita
      # esta var (o el servicio) y los tests de Postgres se SALTAN en vez de fallar.
      KENI_TEST_DATABASE_URL: postgresql://keni:keni@postgres:5432/keni_test
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install -e './keni-shared[dev]' -e './mcp-metricas[dev]' -e './mcp-tablero[dev]' -e './consola[dev]'
      # Espera a que el Postgres del servicio acepte conexiones (acotado, no cuelga).
      - for i in $(seq 1 30); do python -c "import os,psycopg; psycopg.connect(os.environ['KENI_TEST_DATABASE_URL']).close()" 2>/dev/null && break; echo "esperando postgres ($i)"; sleep 1; done
      - python -m pytest keni-shared/tests -q
      - python -m pytest mcp-metricas/tests -q
      - python -m pytest mcp-tablero/tests -q
      # consola en PARALELO (pytest-xdist): cada worker usa su PROPIA BD Postgres (`keni_test_gwN`,
      # ver tests/_postgres.py), asi el aislamiento por TRUNCATE no choca entre workers. Es el paso
      # dominante del pipeline (la suite monohilo era ~5min en un agente de 12 nucleos).
      # `-n 6` (no `auto`): el runner self-hosted COMPARTE host con prod. El techo de CPU por step
      # (4 vCPU, WOODPECKER_BACKEND_DOCKER_LIMIT_CPU_QUOTA) y el `cpuset 3-11` aislan el CI de los
      # cores 0-2 del back; 6 workers sobre 4 vCPU solapan la espera de Postgres sin saturar la RAM
      # del step. `auto`=12 (un worker por hilo del host) saturaba memoria y abortaba workers.
      - python -m pytest consola/tests -q -n 6
