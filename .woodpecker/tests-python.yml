# Woodpecker: tests de los tres paquetes Python del monorepo.
# Espejo del job `tests-python` de .github/workflows/ci.yml.
# keni-metricas depende de keni-shared, y consola de ambos; se instalan editables
# en orden de dependencia para que pip resuelva el grafo local.
#
# Postgres efímero: el back HOSTED corre sobre Postgres, así que CI debe ejercitar ESE
# backend (no solo SQLite local). Sin este servicio, los tests de Postgres se SALTABAN y
# pasó desapercibido el drift de esquema en Postgres (rota_eventos sin las columnas de la
# ola B -> 500 del calendario). Con el servicio, KENI_TEST_DATABASE_URL los activa de verdad.
when:
  - event: [push, pull_request, manual]

services:
  - name: postgres
    image: postgres:16
    environment:
      POSTGRES_USER: keni
      POSTGRES_PASSWORD: keni
      POSTGRES_DB: keni_test

steps:
  - name: pytest
    image: python:3.11
    environment:
      # Apunta los tests de Postgres al servicio (hostname = nombre del servicio). Quita
      # esta var (o el servicio) y los tests de Postgres se SALTAN en vez de fallar.
      KENI_TEST_DATABASE_URL: postgresql://keni:keni@postgres:5432/keni_test
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install -e './keni-shared[dev]' -e './mcp-metricas[dev]' -e './consola[dev]'
      # Espera a que el Postgres del servicio acepte conexiones (acotado, no cuelga).
      - for i in $(seq 1 30); do python -c "import os,psycopg; psycopg.connect(os.environ['KENI_TEST_DATABASE_URL']).close()" 2>/dev/null && break; echo "esperando postgres ($i)"; sleep 1; done
      - python -m pytest keni-shared/tests -q
      - python -m pytest mcp-metricas/tests -q
      - python -m pytest consola/tests -q
