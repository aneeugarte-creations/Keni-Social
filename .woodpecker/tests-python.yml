# Woodpecker: SUITE COMPLETA de los tres paquetes Python del monorepo.
# Espejo del job `tests-python` de .github/workflows/ci.yml.
# keni-metricas depende de keni-shared, y consola de ambos; se instalan editables
# en orden de dependencia para que pip resuelva el grafo local.
#
# TEST SCOPING (ADR 0005 §Test scoping · plan §1.5): esta es la suite COMPLETA. Corre
# cuando cambia keni-shared (la base común: su contrato afecta a TODAS las apps), o el
# mcp de métricas, o la fontanería del gateway (app.py, db, repos, motor_db…), o en
# push a `main` (el deploy depende de este pipeline) y a mano. Los cambios acotados a
# UNA app NO la disparan: usan su pipeline scoped (`tests-app-*`) + el contrato
# (`fronteras`). Postgres efímero: ejercita el backend HOSTED real (no solo SQLite).
when:
  # Suite completa: base común / fontanería del gateway / MCP.
  - event: [push, pull_request]
    path:
      include:
        - "keni-shared/**"
        - "mcp-metricas/**"
        - "consola/src/keni_consola/{app,db,motor_db,repos,migracion,cola,worker,observabilidad,seguridad,programador,marcas,redes,estados,rutas,ficheros,indice}.py"
        - "consola/pyproject.toml"
        - "consola/tests/conftest.py"
        - "consola/tests/_postgres.py"
        - ".woodpecker/tests-python.yml"
  # En push a `main` SIEMPRE (el deploy `depends_on: tests-python` necesita que corra).
  - event: push
    branch: main
  - event: manual

services:
  - name: postgres
    image: postgres:16
    environment:
      POSTGRES_USER: keni
      POSTGRES_PASSWORD: keni
      POSTGRES_DB: keni_test

steps:
  - name: pytest
    image: python:3.11
    environment:
      # Apunta los tests de Postgres al servicio (hostname = nombre del servicio). Quita
      # esta var (o el servicio) y los tests de Postgres se SALTAN en vez de fallar.
      KENI_TEST_DATABASE_URL: postgresql://keni:keni@postgres:5432/keni_test
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install -e './keni-shared[dev]' -e './mcp-metricas[dev]' -e './consola[dev]'
      # Espera a que el Postgres del servicio acepte conexiones (acotado, no cuelga).
      - for i in $(seq 1 30); do python -c "import os,psycopg; psycopg.connect(os.environ['KENI_TEST_DATABASE_URL']).close()" 2>/dev/null && break; echo "esperando postgres ($i)"; sleep 1; done
      - python -m pytest keni-shared/tests -q
      - python -m pytest mcp-metricas/tests -q
      # consola en PARALELO (pytest-xdist): cada worker usa su PROPIA BD Postgres (`keni_test_gwN`,
      # ver tests/_postgres.py), asi el aislamiento por TRUNCATE no choca entre workers. Es el paso
      # dominante del pipeline (la suite monohilo era ~5min en un agente de 12 nucleos).
      # `-n 6` (no `auto`): el runner self-hosted COMPARTE host con prod (keni-social) y otros
      # contenedores; `auto`=12 workers, cada uno con su BD + la app cargada, saturaba memoria y
      # abortaba un worker a mitad de la suite (fallo flaky sin test roto). 6 da margen y sigue rapido.
      - python -m pytest consola/tests -q -n 6
