# Woodpecker: tests de la app B · MÉTRICAS (test scoping por ruta, plan §1.5).
# Espejo del job `tests-app-metricas` de .github/workflows/ci.yml.
#
# Cambio en los módulos de B (api/metricas, comercial, reporte_deportes) -> SOLO los
# tests de B + contrato de fronteras + keni-shared. Cambio en keni-shared -> suite
# completa (`tests-python`). El MCP de métricas tiene su propio paquete/tests.
when:
  - event: [push, pull_request]
    path:
      include:
        - "consola/src/keni_consola/api/metricas.py"
        - "consola/src/keni_consola/api/comercial.py"
        - "consola/src/keni_consola/api/reporte_deportes.py"
        - "consola/src/keni_consola/comercial.py"
        - "consola/src/keni_consola/apps/metricas.toml"

services:
  - name: postgres
    image: postgres:16
    environment:
      POSTGRES_USER: keni
      POSTGRES_PASSWORD: keni
      POSTGRES_DB: keni_test

steps:
  - name: pytest-metricas
    image: python:3.11
    environment:
      KENI_TEST_DATABASE_URL: postgresql://keni:keni@postgres:5432/keni_test
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install -e './keni-shared[dev]' -e './mcp-metricas[dev]' -e './consola[dev]'
      - for i in $(seq 1 30); do python -c "import os,psycopg; psycopg.connect(os.environ['KENI_TEST_DATABASE_URL']).close()" 2>/dev/null && break; echo "esperando postgres ($i)"; sleep 1; done
      - python -m pytest keni-shared/tests -q
      - python -m pytest consola/tests/test_fronteras.py consola/tests/test_catalogo.py -q
      - >-
        python -m pytest -q
        consola/tests/test_api_metricas.py
        consola/tests/test_api_comercial.py
        consola/tests/test_comercial.py
        consola/tests/test_reporte_deportes.py
