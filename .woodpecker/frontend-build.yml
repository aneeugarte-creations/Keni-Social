# Woodpecker: calidad del frontend (lint + tests + bundle).
# `npm run lint`  -> eslint (estilo y errores de patrón).
# `npm run test`  -> vitest (tests del frontend).
# `npm run build` -> tsc -b && vite build (typecheck + build de la SPA).
# Los tres corren tras un unico `npm ci`; falla a la primera. La SPA se compila a
# `consola/src/keni_consola/webapp/` (vite outDir, GITIGNORED: no se versiona);
# aqui solo se comprueba que compila.
# TEST SCOPING (plan §1.5): solo corre cuando cambia el frontend (o sus tipos
# generados / el contrato), y SIEMPRE en push a `main` (el deploy `depends_on:
# frontend-build` lo necesita) y a mano.
when:
  - event: [push, pull_request]
    path:
      include:
        - "consola/frontend/**"
        - "consola/src/keni_consola/esquema_api/**"
  - event: push
    branch: main
  - event: manual

steps:
  - name: build
    image: node:22
    commands:
      - cd consola/frontend
      - npm ci
      - npm run lint
      - npm run test
      - npm run build
