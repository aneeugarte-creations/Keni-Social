nombre: Termómetro mundial
explicacion: Arma el posteo de galería diario con las 5–8 noticias internacionales más importantes. Jerarquiza las notas que le pasas por relevancia internacional, impacto y frescura, las reparte por región en slides y cierra con el copy del posteo (MX) listo para revisar.
grupo: experimentales
aplica_redes: false
salida: documento
media: false
orden: 46
campos:
  - id: noticias
    etiqueta: Noticias internacionales del día
    tipo: textarea
    requerido: true
    placeholder: "Pega aquí las notas candidatas (titulares, links o resúmenes), una por línea o en bloques. El termómetro se arma SOLO con esto."
    ayuda: "La materia prima del termómetro. No inventa nada fuera de aquí: jerarquiza estas notas, elige el top y las reparte por región."
    opciones: []
    media_tipos: ""
  - id: numero
    etiqueta: Número de slides
    tipo: select
    requerido: false
    placeholder: ""
    ayuda: Cuántas noticias entran en la galería (entre 5 y 8). Si lo dejas vacío, se usan 8.
    opciones:
      - "5"
      - "6"
      - "7"
      - "8"
    media_tipos: ""
  - id: regiones
    etiqueta: Regiones a cubrir
    tipo: texto
    requerido: false
    placeholder: "EEUU, América Latina, Europa, Asia, Medio Oriente, África, Oceanía"
    ayuda: Regiones que quieres representar, separadas por coma. Si lo dejas vacío, se reparte por defecto priorizando la diversidad geográfica.
    opciones: []
    media_tipos: ""
  - id: fecha
    etiqueta: Fecha del termómetro
    tipo: fecha
    requerido: false
    placeholder: ""
    ayuda: La fecha que va en la portada. Si la dejas vacía, se usa la de hoy.
    opciones: []
    media_tipos: ""
plantilla_invocacion: |
  usa termometro-mundial para armar el Termómetro mundial, marca {marca}.

  Fecha del termómetro (vacío = hoy): {fecha}
  Número de slides (5–8, vacío = 8): {numero}
  Regiones a cubrir (vacío = reparto por defecto): {regiones}

  Noticias internacionales candidatas:
  {noticias}
