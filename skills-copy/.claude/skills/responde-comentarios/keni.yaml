nombre: Responde comentarios
explicacion: Clasifica y responde comentarios de publicaciones en la voz de la marca. Triaje y redacción; no modera transmisiones en vivo.
grupo: comunidad
aplica_redes: false
salida: documento
media: false
orden: 80
campos:
  - id: comentarios
    etiqueta: Comentarios
    tipo: textarea
    requerido: true
    placeholder: Pega aquí uno o varios comentarios…
    ayuda: Los trata uno por uno, conservando su orden.
    opciones: []
    media_tipos: ""
  - id: contexto
    etiqueta: Contexto de la publicación
    tipo: textarea
    requerido: false
    placeholder: De qué trata el post al que responden…
    ayuda: Delimita qué se puede afirmar. Sin contexto, casi todo dato pedido se marca para verificar.
    opciones: []
    media_tipos: ""
  - id: plataforma
    etiqueta: Plataforma
    tipo: select
    requerido: false
    placeholder: ""
    ayuda: La red donde está el comentario, para ajustar largo y tono.
    opciones:
      - X
      - Instagram
      - Facebook
      - TikTok
      - YouTube
    media_tipos: ""
plantilla_invocacion: |
  usa responde-comentarios, marca {marca}. Plataforma: {plataforma}. Contexto de la publicación: {contexto}. Comentarios:

  {comentarios}
