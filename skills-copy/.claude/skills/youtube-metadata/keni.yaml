nombre: Metadatos de YouTube
explicacion: Arma el paquete de YouTube (títulos, descripción, etiquetas, capítulos y hashtags) optimizado para SEO.
grupo: validadas
aplica_redes: false
salida: documento
media: false
orden: 50
campos:
  - id: fuente
    etiqueta: Nota, transcripción o tema
    tipo: textarea
    requerido: true
    placeholder: Pega la nota, la transcripción o describe el tema del video…
    ayuda: Si la transcripción trae marcas de tiempo, además genera capítulos.
    opciones: []
    media_tipos: ""
  - id: tipo_video
    etiqueta: Tipo de video
    tipo: select
    requerido: false
    placeholder: ""
    ayuda: Un Short lleva #Shorts y título más corto; un video largo prioriza SEO de búsqueda.
    opciones:
      - Video largo
      - Short
    media_tipos: ""
plantilla_invocacion: |
  usa youtube-metadata con la siguiente fuente, marca {marca}. Tipo de video: {tipo_video}.

  {fuente}
