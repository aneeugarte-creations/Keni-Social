nombre: Copy desde nota
explicacion: Convierte una nota o transcripción en copy listo para publicar, una variante por red.
grupo: validadas
aplica_redes: true
salida: piezas
media: false
orden: 10
campos:
  - id: fuente
    etiqueta: Nota o transcripción
    tipo: textarea
    requerido: true
    placeholder: Pega aquí la nota, los cables o la transcripción…
    ayuda: Una o varias notas, cables del mismo tema o una transcripción de clip.
    opciones: []
    media_tipos: ""
plantilla_invocacion: |
  usa copy-desde-nota con la siguiente nota, marca {marca}:

