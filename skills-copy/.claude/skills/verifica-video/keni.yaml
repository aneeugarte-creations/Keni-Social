nombre: Verifica video
explicacion: Pega el enlace de un video viral y te dice si parece nuevo o si ya circulaba desde antes (reciclado), antes de decidir si retomarlo.
grupo: experimentales
aplica_redes: false
salida: documento
media: false
orden: 110
campos:
  - id: enlace
    etiqueta: Enlace del video (o ruta local)
    tipo: texto
    requerido: true
    placeholder: https://x.com/.../status/...  o  /ruta/al/video.mp4
    ayuda: URL de X, TikTok, Facebook, Instagram o YouTube (o un archivo local). Se analiza en local; solo se leen metadatos públicos.
    opciones: []
    media_tipos: ""
  - id: contexto
    etiqueta: Qué se afirma del video (opcional)
    tipo: texto
    requerido: false
    placeholder: "supuestamente del sismo de hoy / dicen que es de las protestas de mayo 2026"
    ayuda: Lo que se dice del video, para comparar contra la fecha real. Opcional pero ayuda al veredicto.
    opciones: []
    media_tipos: ""
plantilla_invocacion: |
  usa verifica-video con este enlace o ruta, y di si el video es nuevo o ya circulaba desde antes:

  enlace: {enlace}
  se afirma que: {contexto}
