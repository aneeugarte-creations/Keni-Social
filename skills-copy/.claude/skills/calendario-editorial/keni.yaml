nombre: Calendario editorial
explicacion: Propone un calendario de contenidos día x plataforma. Soporta ventana semanal y modo evergreen anual (efemérides × nicho de marca).
grupo: planificacion
aplica_redes: false
salida: documento
media: false
orden: 70
campos:
  - id: eventos
    etiqueta: Eventos, notas y temas
    tipo: textarea
    requerido: false
    placeholder: Pega aquí los eventos, notas o temas próximos… (vacío = modo evergreen anual)
    ayuda: Si está vacío o solo hay "evergreen", genera el calendario anual de efemérides cruzadas con el nicho de la marca.
    opciones: []
    media_tipos: ""
  - id: ventana
    etiqueta: Ventana
    tipo: texto
    requerido: false
    placeholder: p. ej. esta semana · próximas 2 semanas · anual
    ayuda: La semana, el rango o "anual" para el calendario evergreen. Por defecto, la semana en curso.
    opciones: []
    media_tipos: ""
plantilla_invocacion: |
  usa calendario-editorial, marca {marca}. Ventana: {ventana}. Eventos y temas:

  {eventos}
