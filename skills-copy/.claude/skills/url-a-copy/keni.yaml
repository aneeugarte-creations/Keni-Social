nombre: Copy desde un enlace
explicacion: Pega el link de una nota y genera copy por red. La Consola lee la página en tu equipo y trata el contenido como NO verificado.
grupo: validadas
aplica_redes: true
salida: piezas
media: false
ingesta: url
orden: 15
campos:
  - id: url
    etiqueta: Enlace de la nota
    tipo: texto
    requerido: true
    placeholder: https://www.unotv.com/...
    ayuda: Pega el enlace de una nota o artículo. La Consola descarga la página y extrae su texto en el servidor; el texto se trata como NO verificado y se marca para que tú lo confirmes. Para video o transmisiones usa «Clip a copy».
    opciones: []
    media_tipos: ""
plantilla_invocacion: |
  usa copy-desde-nota con la nota extraída del enlace {url}, marca {marca}.

  El texto se extrae de la página en el servidor y se trata como NO VERIFICADO: marca nombres, cargos, cifras y fechas como «a verificar».
