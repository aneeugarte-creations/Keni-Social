nombre: Estudio de imagen
explicacion: "Enruta una tarea de imagen al motor correcto: herramientas deterministas para lo exacto (recortar, redimensionar, comprimir, extender fondo, logo + pleca + breaking) e IA para ilustraciones, fondos, gráficos y para extender el fondo de una foto. Cierra revisando lo legal/editorial. Dry-run, no publica."
grupo: experimentales
aplica_redes: false
salida: documento
media: true
orden: 36
campos:
  - id: imagen
    etiqueta: Imagen (opcional)
    tipo: archivo
    requerido: false
    placeholder: ""
    ayuda: La foto a tratar (recortar, redimensionar, ponerle el breaking). Déjala vacía si solo vas a generar una ilustración o un fondo con IA.
    opciones: []
    media_tipos: image/*
  - id: peticion
    etiqueta: Qué quieres hacer
    tipo: textarea
    requerido: true
    placeholder: "P. ej.: recórtame esta foto a 4:5 y ponle el breaking de Claro Sports; o saca las 3 medidas; o genérame un fondo abstracto rojo para una placa."
    ayuda: El enrutador decide la herramienta (recortar, redimensionar, comprimir, extender fondo, placa, breaking, generar ilustración/fondo, o extender el fondo con IA).
    opciones: []
    media_tipos: ""
  - id: formato
    etiqueta: Formato
    tipo: select
    requerido: false
    placeholder: ""
    ayuda: vertical 9:16 (Reels/TikTok) · feed 4:5 (IG/FB) · cuadrado 1:1 · horizontal 16:9 (YouTube/web). Vacío = no forzar.
    opciones:
      - vertical
      - feed
      - cuadrado
      - horizontal
    media_tipos: ""
  - id: ajuste
    etiqueta: Si no cabe en el formato
    tipo: select
    requerido: false
    placeholder: ""
    ayuda: 'Cómo encajar la foto. "recortar" rellena el formato (puede cortar al sujeto). "extender fondo" añade cielo/negro por el borde uniforme SIN cortar al sujeto (sin IA). "extender fondo con IA" rellena la banda con IA cuando el fondo no es uniforme; el sujeto queda intacto. Vacío = el enrutador decide.'
    opciones:
      - recortar
      - extender fondo
      - extender fondo con IA
    media_tipos: ""
  - id: peso
    etiqueta: Peso del archivo (formato "full")
    tipo: select
    requerido: false
    placeholder: ""
    ayuda: 'Para subir en el internet malo de un evento. Comprime conservando el tamaño hasta el peso elegido. Vacío = sin comprimir (original).'
    opciones:
      - "≤ 3 MB"
      - "≤ 2 MB"
      - "≤ 1 MB"
    media_tipos: ""
plantilla_invocacion: |
  usa estudio-imagen, marca {marca}.

  Imagen (ruta, vacío si solo es generativo): {imagen}

  Lo que quiero hacer:
  {peticion}

  Formato (vacío = no forzar): {formato}

  Si no cabe en el formato (vacío = decides tú): {ajuste}

  Peso del archivo "full" (vacío = sin comprimir): {peso}
