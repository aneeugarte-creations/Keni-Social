nombre: Estudio de imagen
explicacion: "Enruta una tarea de imagen al motor correcto: herramientas deterministas para lo exacto sobre fotos reales (recortar, redimensionar, logo + pleca + breaking) e IA solo para ilustraciones, fondos y gráficos. No altera fotos de noticia reales con IA. Cierra revisando lo legal/editorial. Dry-run, no publica."
grupo: experimentales
aplica_redes: false
salida: piezas
media: true
orden: 36
campos:
  - id: imagen
    etiqueta: Imagen (opcional)
    tipo: archivo
    requerido: false
    placeholder: ""
    ayuda: La foto a tratar (recortar, redimensionar, ponerle el breaking). Déjala vacía si solo vas a generar una ilustración o un fondo con IA.
    opciones: []
    media_tipos: image/*
  - id: peticion
    etiqueta: Qué quieres hacer
    tipo: textarea
    requerido: true
    placeholder: "P. ej.: recórtame esta foto a 4:5 y ponle el breaking de Claro Sports; o saca las 3 medidas; o genérame un fondo abstracto rojo para una placa."
    ayuda: El enrutador decide la herramienta. Sobre una foto real solo hace operaciones deterministas; la IA generativa es para ilustraciones, fondos y gráficos.
    opciones: []
    media_tipos: ""
  - id: formato
    etiqueta: Formato
    tipo: select
    requerido: false
    placeholder: ""
    ayuda: vertical 9:16 (Reels/TikTok) · feed 4:5 (IG/FB) · cuadrado 1:1 · horizontal 16:9 (YouTube/web). Vacío = no forzar.
    opciones:
      - vertical
      - feed
      - cuadrado
      - horizontal
    media_tipos: ""
plantilla_invocacion: |
  usa estudio-imagen, marca {marca}.

  Imagen (ruta, vacío si solo es generativo): {imagen}

  Lo que quiero hacer:
  {peticion}

  Formato (vacío = no forzar): {formato}
