# Plantilla de configuracion LOCAL POR PERSONA.
# Copiala a ~/.config/keni-metricas/config.toml y rellena lo tuyo.
# NUNCA la subas a git: contiene tus llaves. Se queda en tu maquina.
#
# Por defecto fuente = "muestra" (datos offline): el MCP funciona sin configurar
# nada. Cambia a "real" cuando tengas credenciales de las plataformas.

fuente = "muestra"   # "muestra" | "metricool" | "real"

# --- Fuente `metricool` (B es CONSUMIDOR de Metricool; ADR 0005 §B) -----------
# Pon fuente = "metricool" para leer dato REAL de la API REST de Metricool (plan
# Advanced -> API token). Si faltan credenciales, degrada solo a "muestra" (demo),
# sin inventar dato real. `user_token` va en la cabecera X-Mc-Auth; `user_id` y los
# `blog_id` por marca van como query params. El userToken se saca de Metricool en
# Ajustes de la cuenta -> seccion API. Override por env: METRICOOL_USER_TOKEN,
# METRICOOL_USER_ID.
# [metricool]
# user_token = "xxxxxxxx"   # X-Mc-Auth (token de API, plan Advanced)
# user_id = "1234567"       # id de usuario de la cuenta Metricool
# [metricool.marcas.claro_sports]   # id de marca keni -> blogId de Metricool
# blog_id = "7654321"
# nombre = "Claro Sports"
# plataformas = ["facebook", "instagram", "x", "tiktok", "youtube"]  # opcional
# [metricool.marcas.unotv]
# blog_id = "7654322"

# --- Acotamiento por marca (multiusuario) ------------------------------------
# Si gestionas solo algunas marcas, declaralas aqui y el MCP SOLO mostrara esas
# (en listar_cuentas, reporte_consolidado, picos, etc.). Asi 16 personas sobre 5
# marcas no se pisan. Si lo dejas vacio/sin poner, ves TODAS (comportamiento
# por defecto). La env var KENI_METRICAS_MARCAS="claro_sports,unotv" tiene
# prioridad sobre este campo.
# marcas = ["claro_sports", "unotv"]

# --- Cuentas/marcas que gestionas y su handle/id en cada plataforma ----------
[[cuenta]]
id = "claro_sports"
nombre = "Claro Sports"
[cuenta.plataformas]
facebook = "PAGE_ID"
instagram = "IG_USER_ID"
youtube = "CHANNEL_ID"
x = "USER_ID"
# tiktok va por el token del usuario (no necesita handle)

[[cuenta]]
id = "unotv"
nombre = "UnoTV"
[cuenta.plataformas]
facebook = "PAGE_ID"
instagram = "IG_USER_ID"

# --- Credenciales por plataforma (solo si fuente = "real") -------------------
# Cada bloque es opcional: si falta, esa plataforma se omite con un aviso.
[credenciales.meta]
access_token = "EAAB..."     # token de Meta Graph (requiere App Review)
# app_id / app_secret: opcionales, para extender el token (fb_exchange_token) ante un 401
# app_id = "..."
# app_secret = "..."

[credenciales.youtube]
access_token = "ya29..."     # OAuth con scope yt-analytics.readonly
# para refresco automático (el access token de Google caduca en ~1h):
# client_id = "..."
# client_secret = "..."
# refresh_token = "..."

[credenciales.x]
bearer_token = "AAAA..."     # X API v2 (tier de pago); el bearer de app no caduca

[credenciales.tiktok]
access_token = "act...."     # TikTok Display API (requiere auditoria)
# para refresco automático del token:
# client_key = "..."
# client_secret = "..."
# refresh_token = "..."
