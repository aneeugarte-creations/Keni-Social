[project]
name = "keni-metricas"
version = "0.2.0"
description = "Servidor MCP de metricas de redes sociales multi-plataforma (Keni)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Keni Engineering" }]
dependencies = [
    # Capa mas baja: definiciones canonicas compartidas (marca, limites, io_atomico,
    # engagement_pct). keni-metricas y keni-consola importan de aqui la MISMA fuente (H3/E1).
    "keni-shared",
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# `deck` habilita el reporte semanal de deportes en PPTX (keni-reporte-deck).
# Es opcional: el MCP/servidor no lo necesita y no debe cargar python-pptx.
deck = ["python-pptx>=0.6.23"]
# dev incluye python-pptx para que CI ejercite el render del deck.
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "anyio>=4", "ruff>=0.6", "python-pptx>=0.6.23"]

[project.scripts]
keni-metricas = "keni_metricas.server:main"
keni-reporte = "keni_metricas.reporte:main"
keni-reporte-deck = "keni_metricas.reporte_deck:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keni_metricas"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
