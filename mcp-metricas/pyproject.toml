[project]
name = "keni-metricas"
version = "0.1.0"
description = "Servidor MCP de metricas de redes sociales multi-plataforma (Keni)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Keni Engineering" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "anyio>=4"]

[project.scripts]
keni-metricas = "keni_metricas.server:main"
keni-reporte = "keni_metricas.reporte:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keni_metricas"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
